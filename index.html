<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verint Mapping Manager</title>
<style>
  :root{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --ink:#1f2430;
    --muted:#6b7280;
    --line:#e5e7eb;
    --brand:#2f6fed;
    --brand-soft:#e8f0fe;
    --awd:#2f6fed;
    --manual:#0f9d76;
    --danger:#e0483b;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
    --font:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .icon{width:16px;height:16px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  /* Top bar */
  .topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:45}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.2px;min-width:0}
  .brand .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .brand .mark svg{width:16px;height:16px;stroke:#fff}
  .brand-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .spacer{flex:1}
  .topbar-actions{display:contents}
  .menu-toggle{display:none;width:36px;height:36px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;align-items:center;justify-content:center;flex:0 0 auto}
  .menu-toggle:hover{background:#f7f8fa}
  .menu-toggle .icon{width:18px;height:18px}
  .tbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font-size:13px;font-weight:500;flex:0 0 auto;white-space:nowrap}
  .tbtn:hover{background:#f7f8fa}
  .tbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .tbtn.primary:hover{background:#2560d8}
  .tbtn .icon{width:15px;height:15px}
  .drawer-backdrop{display:none;position:fixed;inset:56px 0 0 0;background:rgba(17,24,39,.4);z-index:38}
  .drawer-backdrop.show{display:block}

  /* Layout */
  .layout{display:flex;height:calc(100vh - 56px)}
  .sidebar{width:340px;flex:0 0 340px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .26s cubic-bezier(.4,0,.2,1)}
  .side-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  .side-head .row{display:flex;gap:8px;align-items:center}
  .search{flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
  .search input{border:0;background:transparent;outline:none;width:100%;font-size:13px;color:var(--ink)}
  .search .icon{color:var(--muted)}
  .addfn{height:34px;width:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff}
  .addfn:hover{background:#2560d8}
  .side-stats{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .chip{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
  .tree{overflow:auto;padding:8px;flex:1}
  .dev-info{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .dev-avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
  .dev-meta{min-width:0}
  .dev-label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  .dev-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dev-mail{font-size:11px;color:var(--brand);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .dev-mail:hover{text-decoration:underline}

  .node{user-select:none}
  .node .label{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;position:relative}
  .node .label:hover{background:#f5f6f8}
  .node .label.active{background:var(--brand-soft)}
  .caret{width:16px;height:16px;color:var(--muted);transition:transform .12s ease;flex:0 0 auto}
  .caret.open{transform:rotate(90deg)}
  .caret.hidden{visibility:hidden}
  .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .fn-name{font-weight:600}
  .sf-name{font-weight:500}
  .cnt{font-size:11px;color:var(--muted);background:#eef0f3;border-radius:10px;padding:1px 7px}
  .rowactions{display:none;gap:2px}
  .node .label:hover .rowactions{display:flex}
  .minibtn{width:24px;height:24px;border:0;background:transparent;color:var(--muted);border-radius:6px;display:flex;align-items:center;justify-content:center}
  .minibtn:hover{background:#e6e8ec;color:var(--ink)}
  .minibtn.del:hover{background:#fde7e5;color:var(--danger)}
  .minibtn.ok:hover{background:#e4f6ef;color:var(--manual)}
  .children{margin-left:14px;border-left:1px solid var(--line);padding-left:4px}

  .tag{font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:5px;text-transform:uppercase}
  .tag.awd{background:#e8f0fe;color:var(--awd)}
  .tag.manual{background:#e4f6ef;color:var(--manual)}

  .addline{display:flex;align-items:center;gap:6px;padding:5px 8px;margin:2px 0;color:var(--brand);font-size:12px;font-weight:600;border-radius:7px;cursor:pointer}
  .addline:hover{background:var(--brand-soft)}

  /* Main */
  .main{flex:1;overflow:auto;padding:22px 26px}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center;gap:10px}
  .empty svg{width:44px;height:44px;color:#c3c8d0}
  .empty h3{margin:6px 0 0;color:var(--ink);font-weight:600}
  .empty p{margin:0;max-width:380px;line-height:1.5}

  .detail-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
  .breadcrumb{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .breadcrumb b{color:var(--ink);font-weight:600}
  .detail-head h1{margin:0;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
  .detail-head .spacer{flex:1}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .card .k{font-size:12px;color:var(--muted)}
  .card .v{font-size:22px;font-weight:700;margin-top:2px}

  .section-bar{display:flex;align-items:center;margin:0 0 12px}
  .section-bar h2{font-size:15px;margin:0;font-weight:600}
  .section-bar .spacer{flex:1}

  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:visible}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fafbfc}
  tbody tr.editing{background:#f5f8ff !important}
  .org-pill{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:2px 8px;font-weight:600;font-size:12px;margin:1px 0}
  .upd{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
  .ver-badge{display:inline-block;background:#eef0f3;color:var(--muted);border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700;width:fit-content}
  .upd-date{font-size:11px;color:var(--muted)}
  .ver-dot{position:absolute;top:-3px;right:-3px;background:var(--brand);color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1}
  .vchk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
  .vchk input{position:absolute;opacity:0;width:0;height:0}
  .vchk .box{width:18px;height:18px;border:1.6px solid #c3c8d0;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;transition:.12s}
  .vchk .box .icon{width:13px;height:13px;stroke-width:2.6}
  .vchk.on .box{background:var(--manual);border-color:var(--manual)}
  .vchk:hover .box{border-color:var(--manual)}
  .vchk .vtxt{font-size:11px;color:var(--manual);font-weight:600}
  .vchk:not(.on) .vtxt{font-weight:400}
  .muted{color:var(--muted)}
  .cellactions{display:flex;gap:4px;justify-content:flex-end}
  .table-empty{padding:34px;text-align:center;color:var(--muted)}
  .inline-input{width:100%;min-width:70px;height:32px;padding:0 8px;border:1px solid var(--brand);border-radius:6px;font-size:13px;font-family:inherit;color:var(--ink);outline:none;background:#fff}
  .inline-input:focus{box-shadow:0 0 0 3px rgba(47,111,237,.14)}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:13px;font-weight:500;color:var(--ink)}
  .btn:hover{background:#f7f8fa}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#2560d8}
  .btn.small{height:30px;padding:0 10px;font-size:12px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);width:100%;max-width:560px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
  .modal.wide{max-width:680px}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal-head h3{margin:0;font-size:16px;font-weight:700}
  .modal-head .x{margin-left:auto;width:30px;height:30px;border:0;background:transparent;color:var(--muted);border-radius:7px;display:flex;align-items:center;justify-content:center}
  .modal-head .x:hover{background:#f0f1f3;color:var(--ink)}
  .modal-body{padding:18px 20px;overflow:auto}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fafbfc}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .field label .req{color:var(--danger)}
  .field .hint{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
  .input,.select,textarea{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;outline:none}
  textarea{height:auto;padding:9px 11px;resize:vertical;min-height:62px;line-height:1.4}
  .input:focus,.select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* type toggle */
  .toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .toggle .opt{border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  .toggle .opt:hover{border-color:#cfd6e4}
  .toggle .opt.sel{border-color:var(--brand);background:var(--brand-soft)}
  .toggle .opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid #c3c8d0;margin-top:1px;flex:0 0 auto}
  .toggle .opt.sel .dot{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px #fff}
  .toggle .opt .t{font-weight:600;font-size:13px}
  .toggle .opt .d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}

  /* org tokens */
  .orgbox{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:40px}
  .orgbox input{border:0;outline:none;flex:1;min-width:120px;height:26px;font-size:13px;font-family:inherit}
  .token{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:3px 6px 3px 9px;font-size:12px;font-weight:600}
  .token button{border:0;background:transparent;color:var(--brand);cursor:pointer;display:flex;padding:0;line-height:0}
  .token button:hover{color:var(--danger)}

  /* directories modal */
  .dir-layout{display:flex;min-height:360px}
  .dir-cats{width:200px;border-right:1px solid var(--line);padding-right:12px;display:flex;flex-direction:column;gap:3px}
  .dir-cat{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%;color:var(--ink)}
  .dir-cat:hover{background:#f4f5f7}
  .dir-cat.sel{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .dir-cat .c{margin-left:auto;font-size:11px;background:#eef0f3;color:var(--muted);border-radius:10px;padding:1px 7px}
  .dir-cat.sel .c{background:#fff;color:var(--brand)}
  .dir-entries{flex:1;padding-left:16px;display:flex;flex-direction:column;min-width:0}
  .dir-add{display:flex;gap:8px;margin-bottom:12px}
  .dir-list{overflow:auto;max-height:330px;display:flex;flex-direction:column;gap:6px;padding-right:2px}
  .dir-item{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border:1px solid var(--line);border-radius:8px}
  .dir-item .t{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dir-item input{flex:1;height:30px;border:1px solid var(--brand);border-radius:6px;padding:0 8px;font-size:13px;outline:none;font-family:inherit}
  .dir-empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:13px}

  /* version history */
  .hist-meta{display:flex;gap:20px;flex-wrap:wrap;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px}
  .hist-meta .m{display:flex;flex-direction:column;gap:2px}
  .hist-meta .m .l{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  .hist-meta .m .v{font-size:13px;font-weight:600}
  .timeline{position:relative;padding-left:22px}
  .timeline:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 16px 6px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item .dot{position:absolute;left:-22px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--brand)}
  .tl-item.old .dot{border-color:#c3c8d0}
  .tl-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .tl-head .vb{background:var(--brand-soft);color:var(--brand);border-radius:5px;padding:1px 8px;font-size:11px;font-weight:700}
  .tl-item.old .tl-head .vb{background:#eef0f3;color:var(--muted)}
  .tl-head .when{font-size:12px;color:var(--muted)}
  .tl-head .cur{font-size:10px;font-weight:700;color:var(--manual);text-transform:uppercase;letter-spacing:.4px}
  .tl-head .spacer{flex:1}
  .tl-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .tl-fields .f{font-size:12px;display:flex;flex-direction:column;gap:1px;min-width:0}
  .tl-fields .f .fl{font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:600}
  .tl-fields .f .fv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl-fields .f.chg .fv{color:var(--brand);font-weight:600}
  .hist-empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:13px}

  /* list view */
  .list-filters{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .lv-select{width:auto;min-width:150px}
  /* sortable headers */
  th.th-sort{cursor:pointer;user-select:none;white-space:nowrap}
  th.th-sort:hover{background:#f0f2f5;color:var(--ink)}
  th.th-sort.active{color:var(--brand)}
  th.th-sort .tha{color:var(--brand);font-size:10px}
  /* sidebar controls */
  .side-controls{margin-top:10px;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;gap:8px}
  .sc-row{display:flex;align-items:center;gap:8px}
  .sc-row label{font-size:11px;font-weight:600;color:var(--muted);width:42px;flex:0 0 auto}
  .sc-sel{flex:1;height:30px;font-size:12px;padding:0 8px;min-width:0}
  .sc-dir{width:30px;height:30px;flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--brand)}
  .sc-dir:hover{background:#f0f2f5}
  .sc-dir .icon{width:14px;height:14px}
  .sc-clear{border:0;background:transparent;color:var(--brand);font-size:12px;font-weight:600;cursor:pointer;padding:2px;text-align:left}
  .sc-clear:hover{text-decoration:underline}
  .keycode{font-family:"Consolas",ui-monospace,monospace;font-size:12px;background:#f1f3f6;border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--ink);white-space:nowrap}
  .lv-val{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
  .lv-val.on{color:var(--manual)}
  .lv-val.on .icon{width:13px;height:13px;stroke-width:2.6}

  /* about */
  .ab-hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .ab-logo{width:52px;height:52px;border-radius:12px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ab-name{font-size:19px;font-weight:700}
  .ab-ver{font-size:13px;color:var(--muted);margin-top:2px}
  .ab-purpose{font-size:13px;line-height:1.55;color:var(--ink);background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 18px}
  .ab-sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:0 0 10px}
  .ab-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
  .ab-stat{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center}
  .ab-stat .n{display:block;font-size:20px;font-weight:700}
  .ab-stat .l{font-size:11px;color:var(--muted)}
  .ab-feats{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:20px}
  .ab-feat{display:flex;gap:9px;align-items:flex-start}
  .ab-fi{width:20px;height:20px;border-radius:6px;background:#e4f6ef;color:var(--manual);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
  .ab-fi .icon{width:13px;height:13px;stroke-width:2.6}
  .ab-feat b{display:block;font-size:13px}
  .ab-feat span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:1px}
  .ab-kv{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
  .ab-kv>div{display:flex;gap:12px;font-size:12.5px;align-items:baseline}
  .ab-kv>div span{color:var(--muted);flex:0 0 130px}
  .ab-kv>div b{font-weight:600;word-break:break-word}
  .ab-dev{display:flex;align-items:center;gap:12px;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px}
  .ab-dev-name{font-size:14px;font-weight:700}
  .ab-dev-role{font-size:12px;color:var(--muted);margin:1px 0 2px}
  .ab-tech{font-size:11px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:12px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2430;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;z-index:80;display:flex;align-items:center;gap:9px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .icon{color:#4ade80}

  /* ============================================================
     RESPONSIVE  ·  tablet & mobile
     ============================================================ */

  /* Tablet & down: narrower sidebar, icon-only topbar buttons */
  @media (max-width:1080px){
    .tbtn{font-size:0;gap:0;padding:0 11px}
    .tbtn .icon{width:17px;height:17px}
    .sidebar{width:300px;flex-basis:300px}
    .main{padding:20px 20px}
  }

  /* Below 900px: sidebar becomes an off-canvas drawer */
  @media (max-width:900px){
    .menu-toggle{display:flex}
    .layout{position:relative}
    .sidebar{
      position:fixed;top:56px;left:0;bottom:0;z-index:39;
      width:320px;max-width:86vw;flex-basis:auto;
      transform:translateX(-100%);
      box-shadow:0 12px 40px rgba(0,0,0,.18);
    }
    .sidebar.open{transform:translateX(0)}
    .main{width:100%}
    /* tables scroll horizontally instead of crushing */
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .table-wrap table{min-width:720px}
  }

  /* Phones */
  @media (max-width:640px){
    .topbar{gap:8px;padding:0 12px}
    .brand{font-size:14px}
    .main{padding:16px 13px}
    .detail-head{flex-wrap:wrap;gap:10px}
    .detail-head h1{font-size:18px}
    .detail-head .btn{flex:1 1 auto;justify-content:center}
    .cards{grid-template-columns:repeat(2,1fr);gap:10px}
    .card .v{font-size:19px}
    /* filter bars stack full width */
    .list-filters{gap:8px}
    .list-filters .search{max-width:none;width:100%;flex:1 1 100%}
    .lv-select{flex:1 1 calc(50% - 5px);min-width:0}
    .list-filters .chip{margin-left:0 !important}
    /* modals go near-fullscreen */
    .overlay{padding:0;align-items:flex-end}
    .modal,.modal.wide{max-width:100%;width:100%;max-height:94vh;border-radius:16px 16px 0 0}
    .modal-body{padding:16px}
    .modal-foot{flex-wrap:wrap}
    .modal-foot .btn{flex:1 1 auto;justify-content:center}
    .grid2{grid-template-columns:1fr}
    .toggle{grid-template-columns:1fr}
    /* directories: stack categories on top */
    .dir-layout{flex-direction:column;min-height:0}
    .dir-cats{width:auto;border-right:0;border-bottom:1px solid var(--line);padding:0 0 10px;flex-direction:row;flex-wrap:wrap;gap:6px}
    .dir-cat{width:auto}
    .dir-cat .c{margin-left:6px}
    .dir-entries{padding-left:0;padding-top:12px}
    .dir-list{max-height:46vh}
    .dir-add{flex-wrap:wrap}
    /* about panel */
    .ab-stats{grid-template-columns:repeat(2,1fr)}
    .ab-feats{grid-template-columns:1fr}
    .ab-kv>div{flex-direction:column;gap:2px}
    .ab-kv>div span{flex-basis:auto}
    /* version history timeline fields */
    .tl-fields{grid-template-columns:1fr 1fr}
    .hist-meta{gap:12px}
    /* sidebar controls stack */
    .sc-row label{width:38px}
  }

  /* Small phones */
  @media (max-width:400px){
    .brand-text{display:none}
    .cards{grid-template-columns:1fr 1fr}
    .lv-select{flex:1 1 100%}
    .tl-fields{grid-template-columns:1fr}

  }

  /* Landscape / short screens: keep modals scrollable */
  @media (max-height:520px){
    .modal,.modal.wide{max-height:96vh}
  }

  /* Larger desktops: let the workspace breathe */
  @media (min-width:1600px){
    .main{padding:26px 40px}
  }
</style>

<script>
/* ============================================================
   Verint Mapping Manager
   Single-file · localStorage + IndexedDB · Directories + autocomplete
   Inline row editing · JSON/CSV I/O
   ============================================================ */

const LS_KEY = "verint_mapping_manager_v2";
const IDB_NAME = "VerintMappingDB";
const IDB_STORE = "state";

const DIR_CATS = [
  {key:"businessArea", label:"Business Area"},
  {key:"worktype",     label:"Worktype"},
  {key:"status",       label:"Status"},
  {key:"organization", label:"Organization Name"},
  {key:"manualQueue",  label:"Manual Verint Queue"},
  {key:"source",       label:"Source Name"}
];
const DIR_KEYS = DIR_CATS.map(c=>c.key);

/* ---------- State ---------- */
let state = { functions: [], directories: {} };
let selection = { worktypeId: null };
let searchTerm = "";
let viewMode = "detail";         // "detail" | "list"
let listFilters = { text:"", type:"", validated:"" };
let listSort = { key:"function", dir:"asc" };
let sidebarSort = { key:"custom", dir:"asc", type:"", validated:"" };
let detailFilter = { text:"", validated:"", org:"" };
let detailSort = { key:"", dir:"asc" };
let editingMapId = null;         // inline table edit
let inlineOrgs = [];             // (reserved) not used for inline; orgs edited as comma list
const expanded = new Set();

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- Persistence ---------- */
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSave(data){
  try{ const db=await idbOpen(); const tx=db.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).put(data,"current"); }catch(e){}
}
async function idbLoad(){
  try{ const db=await idbOpen();
    return await new Promise(res=>{ const tx=db.transaction(IDB_STORE,"readonly"); const g=tx.objectStore(IDB_STORE).get("current"); g.onsuccess=()=>res(g.result||null); g.onerror=()=>res(null); });
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} idbSave(state); }
async function load(){
  let data=null;
  try{ const raw=localStorage.getItem(LS_KEY); if(raw) data=JSON.parse(raw); }catch(e){}
  if(!data){ data=await idbLoad(); }
  if(data && data.functions){ state=data; }
  ensureDirectories();
}
function ensureDirectories(){
  if(!state.directories||typeof state.directories!=="object") state.directories={};
  DIR_KEYS.forEach(k=>{ if(!Array.isArray(state.directories[k])) state.directories[k]=[]; });
}

/* ---------- Traversal helpers ---------- */
function allWorktypes(){
  const out=[];
  state.functions.forEach(fn=>(fn.subFunctions||[]).forEach(sf=>
    (sf.worktypes||[]).forEach(wt=>out.push({fn,sf,wt}))));
  return out;
}
function findWorktype(id){
  for(const fn of state.functions)
    for(const sf of (fn.subFunctions||[]))
      for(const wt of (sf.worktypes||[]))
        if(wt.id===id) return {fn,sf,wt};
  return null;
}
function orgCount(wt){
  const s=new Set();
  (wt.mappings||[]).forEach(m=>(m.organizations||[]).forEach(o=>s.add(o.toLowerCase())));
  return s.size;
}

/* ---------- Generic comparison for sorting ---------- */
function cmp(a,b){
  if(a==null) a=""; if(b==null) b="";
  // numeric compare when both look numeric
  const na=parseFloat(a), nb=parseFloat(b);
  if(typeof a==="number"&&typeof b==="number") return a-b;
  if(!isNaN(na)&&!isNaN(nb)&&String(a).trim()!==""&&String(b).trim()!==""&&/^[\d.\-]+$/.test(String(a))&&/^[\d.\-]+$/.test(String(b))) return na-nb;
  return String(a).toLowerCase().localeCompare(String(b).toLowerCase());
}
function sortBy(arr, keyFn, dir){
  const s=[...arr].sort((x,y)=>cmp(keyFn(x),keyFn(y)));
  if(dir==="desc") s.reverse();
  return s;
}
/* value extractor for a mapping given a sort key */
function mapSortVal(m, wt, key){
  switch(key){
    case "businessArea": return m.businessArea||"";
    case "worktype":     return m.worktype||"";
    case "status":       return m.status||"";
    case "manualQueue":  return m.manualQueue||"";
    case "key":          return awdManualKey(wt.type,m);
    case "organizations":return (m.organizations||[]).join(", ");
    case "source":       return m.source||"";
    case "remarks":      return m.remarks||"";
    case "validated":    return m.validated?1:0;
    case "validatedAt":  return m.validatedAt||"";
    case "version":      return m.version||1;
    case "createdAt":    return m.createdAt||"";
    case "modifiedAt":   return m.modifiedAt||m.createdAt||"";
    default: return "";
  }
}

/* ---------- Suggestions (directory + values already in use) ---------- */
function suggestions(kind){
  const set=new Set((state.directories[kind]||[]));
  allWorktypes().forEach(({wt})=>(wt.mappings||[]).forEach(m=>{
    if(kind==="businessArea"&&m.businessArea) set.add(m.businessArea);
    if(kind==="worktype"&&m.worktype)         set.add(m.worktype);
    if(kind==="status"&&m.status)             set.add(m.status);
    if(kind==="manualQueue"&&m.manualQueue)   set.add(m.manualQueue);
    if(kind==="source"&&m.source)             set.add(m.source);
    if(kind==="organization") (m.organizations||[]).forEach(o=>set.add(o));
  }));
  return [...set].filter(Boolean).sort((a,b)=>a.localeCompare(b));
}
function pushUniq(arr,v){ v=(v||"").trim(); if(v && !arr.some(x=>x.toLowerCase()===v.toLowerCase())) arr.push(v); }
/* Split pasted/imported text on newlines, commas, tabs, semicolons; trim; de-dupe within the paste */
function parseBulkValues(raw){
  const out=[];
  (raw||"").split(/[\r\n,;\t]+/).forEach(v=>{
    v=v.trim();
    if(v && !out.some(x=>x.toLowerCase()===v.toLowerCase())) out.push(v);
  });
  return out;
}
function learn(rec){
  const d=state.directories;
  pushUniq(d.businessArea, rec.businessArea);
  pushUniq(d.worktype,     rec.worktype);
  pushUniq(d.status,       rec.status);
  pushUniq(d.manualQueue,  rec.manualQueue);
  pushUniq(d.source,       rec.source);
  (rec.organizations||[]).forEach(o=>pushUniq(d.organization,o));
}
function renderDatalists(){
  document.getElementById("datalists").innerHTML =
    DIR_KEYS.map(k=>`<datalist id="dl_${k}">`+suggestions(k).map(v=>`<option value="${esc(v)}"></option>`).join("")+`</datalist>`).join("");
}

/* ============================================================
   Icons
   ============================================================ */
function svg(path,cls){ return `<svg class="icon ${cls||''}" viewBox="0 0 24 24">${path}</svg>`; }
const IC={
  caret:'<path d="M9 6l6 6-6 6"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  layers:'<path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 13l9 5 9-5"/>',
  doc:'<path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  del:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  restore:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 8v4l3 2"/>'
};

/* ============================================================
   RENDER: Sidebar tree
   ============================================================ */
function renderTree(){
  const tree=document.getElementById("tree");
  const stats=document.getElementById("sideStats");
  const wts=allWorktypes();
  const totalMaps=wts.reduce((a,x)=>a+(x.wt.mappings?.length||0),0);
  stats.innerHTML=
    `<span class="chip">${state.functions.length} Functions</span>`+
    `<span class="chip">${wts.length} Worktypes</span>`+
    `<span class="chip">${totalMaps} Mappings</span>`;

  if(state.functions.length===0){
    tree.innerHTML=`<div style="padding:24px 12px;color:var(--muted);text-align:center;line-height:1.6">
      ${svg(IC.folder)}<div style="margin-top:8px">No functions yet.</div>
      <div style="font-size:12px">Click the <b>+</b> button to add your first Function.</div></div>`;
    return;
  }

  const q=searchTerm.trim().toLowerCase();
  const F=sidebarSort;
  const hasFilter = !!q || F.type || F.validated;

  const wtValState=(wt)=>{
    const ms=wt.mappings||[]; if(ms.length===0) return "none";
    const v=ms.filter(m=>m.validated).length;
    if(v===0) return "none"; if(v===ms.length) return "full"; return "partial";
  };
  const match=(wt)=>{
    if(F.type && wt.type!==F.type) return false;
    if(F.validated && wtValState(wt)!==F.validated) return false;
    if(!q) return true;
    if(wt.name.toLowerCase().includes(q)) return true;
    return (wt.mappings||[]).some(m=>
      [m.manualQueue,m.businessArea,m.worktype,m.status,m.source,m.remarks,(m.organizations||[]).join(" ")]
      .filter(Boolean).some(v=>v.toLowerCase().includes(q)));
  };
  const sortWts=(list)=>{
    if(F.key==="custom") return list;
    const keyFn=(wt)=>{
      if(F.key==="name") return wt.name||"";
      if(F.key==="type") return wt.type||"";
      if(F.key==="mappings") return (wt.mappings||[]).length;
      if(F.key==="validated") return (wt.mappings||[]).filter(m=>m.validated).length;
      return wt.name||"";
    };
    return sortBy(list, keyFn, F.dir);
  };

  let html="";
  state.functions.forEach(fn=>{
    const fnOpen=expanded.has(fn.id)||hasFilter;
    const subs=fn.subFunctions||[];
    const visSubs=subs.map(sf=>({sf,wtsV:sortWts((sf.worktypes||[]).filter(match))})).filter(x=>!hasFilter||x.wtsV.length);
    if(hasFilter && visSubs.length===0) return;

    html+=`<div class="node">
      <div class="label" data-toggle="${fn.id}">
        ${svg(IC.caret,'caret '+(fnOpen?'open':''))}${svg(IC.folder)}
        <span class="name fn-name">${esc(fn.name)}</span>
        <span class="cnt">${subs.length}</span>
        <span class="rowactions">
          <button class="minibtn" title="Add sub-function" data-act="addsf" data-fn="${fn.id}">${svg(IC.plus)}</button>
          <button class="minibtn" title="Rename" data-act="editfn" data-fn="${fn.id}">${svg(IC.edit)}</button>
          <button class="minibtn del" title="Delete" data-act="delfn" data-fn="${fn.id}">${svg(IC.del)}</button>
        </span>
      </div>`;
    if(fnOpen){
      html+=`<div class="children">`;
      (hasFilter?visSubs.map(x=>x.sf):subs).forEach(sf=>{
        const sfOpen=expanded.has(sf.id)||hasFilter;
        const wtsAll=sf.worktypes||[];
        const wtsV=sortWts(hasFilter?wtsAll.filter(match):wtsAll);
        html+=`<div class="node">
          <div class="label" data-toggle="${sf.id}">
            ${svg(IC.caret,'caret '+(sfOpen?'open':''))}${svg(IC.layers)}
            <span class="name sf-name">${esc(sf.name)}</span>
            <span class="cnt">${wtsAll.length}</span>
            <span class="rowactions">
              <button class="minibtn" title="Add worktype" data-act="addwt" data-sf="${sf.id}">${svg(IC.plus)}</button>
              <button class="minibtn" title="Rename" data-act="editsf" data-sf="${sf.id}">${svg(IC.edit)}</button>
              <button class="minibtn del" title="Delete" data-act="delsf" data-sf="${sf.id}">${svg(IC.del)}</button>
            </span>
          </div>`;
        if(sfOpen){
          html+=`<div class="children">`;
          wtsV.forEach(wt=>{
            const active=selection.worktypeId===wt.id?'active':'';
            html+=`<div class="node">
              <div class="label ${active}" data-select="${wt.id}">
                <span class="caret hidden"></span>${svg(IC.doc)}
                <span class="name">${esc(wt.name)}</span>
                <span class="tag ${wt.type}">${wt.type}</span>
                <span class="rowactions">
                  <button class="minibtn" title="Edit" data-act="editwt" data-wt="${wt.id}">${svg(IC.edit)}</button>
                  <button class="minibtn del" title="Delete" data-act="delwt" data-wt="${wt.id}">${svg(IC.del)}</button>
                </span>
              </div></div>`;
          });
          if(!hasFilter) html+=`<div class="addline" data-act="addwt" data-sf="${sf.id}">${svg(IC.plus)} Add worktype</div>`;
          html+=`</div>`;
        }
        html+=`</div>`;
      });
      if(!hasFilter) html+=`<div class="addline" data-act="addsf" data-fn="${fn.id}">${svg(IC.plus)} Add sub-function</div>`;
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  if(hasFilter && html==="") html=`<div style="padding:24px 12px;color:var(--muted);text-align:center;line-height:1.6">
      ${svg(IC.list)}<div style="margin-top:8px">No worktypes match the current filters.</div>
      <div style="font-size:12px">Try clearing the filters.</div></div>`;
  tree.innerHTML=html;
}

/* ============================================================
   RENDER: Main detail panel  (with inline editing)
   ============================================================ */
function renderMain(){
  const main=document.getElementById("main");
  if(viewMode==="list"){ renderListView(); return; }
  const ctx=selection.worktypeId?findWorktype(selection.worktypeId):null;

  if(!ctx){
    main.innerHTML=`<div class="empty">
      ${svg(IC.db)}
      <h3>Select a Dashboard Worktype</h3>
      <p>Choose a worktype from the left to view and manage its mapping combinations, or create a new Function to get started.</p>
      <button class="btn primary" onclick="openEntity('function')">${svg(IC.plus)} New Function</button>
    </div>`;
    return;
  }

  const {fn,sf,wt}=ctx;
  const maps=wt.mappings||[];
  const isManual=wt.type==="manual";

  const head=`<div class="detail-head">
    <div>
      <div class="breadcrumb">${svg(IC.folder)} <b>${esc(fn.name)}</b> ${svg(IC.caret)} ${svg(IC.layers)} <b>${esc(sf.name)}</b></div>
      <h1>${esc(wt.name)} <span class="tag ${wt.type}">${wt.type}</span></h1>
    </div>
    <div class="spacer"></div>
    <button class="btn" onclick="openEntity('worktype','${wt.id}')">${svg(IC.edit)} Edit</button>
    <button class="btn primary" onclick="openMapping('${wt.id}')">${svg(IC.plus)} Add mapping</button>
  </div>`;

  const valCount=maps.filter(m=>m.validated).length;
  const cards=`<div class="cards">
    <div class="card"><div class="k">Type</div><div class="v" style="text-transform:uppercase;color:${isManual?'var(--manual)':'var(--awd)'}">${wt.type}</div></div>
    <div class="card"><div class="k">Mapping rows</div><div class="v">${maps.length}</div></div>
    <div class="card"><div class="k">Organizations counted</div><div class="v">${orgCount(wt)}</div></div>
    <div class="card"><div class="k">Validated</div><div class="v" style="color:${valCount===maps.length&&maps.length?'var(--manual)':'var(--ink)'}">${valCount}<span style="font-size:14px;color:var(--muted);font-weight:500">/${maps.length}</span></div></div>
  </div>`;

  // ----- filter + sort the mapping rows -----
  const df=detailFilter;
  let vmaps=[...maps];
  const dq=(df.text||"").trim().toLowerCase();
  if(dq) vmaps=vmaps.filter(m=>[m.manualQueue,m.businessArea,m.worktype,m.status,m.source,m.remarks,(m.organizations||[]).join(" "),awdManualKey(wt.type,m)]
      .filter(Boolean).some(v=>v.toLowerCase().includes(dq)));
  if(df.validated==="yes") vmaps=vmaps.filter(m=>m.validated);
  if(df.validated==="no")  vmaps=vmaps.filter(m=>!m.validated);
  if(df.org) vmaps=vmaps.filter(m=>(m.organizations||[]).some(o=>o.toLowerCase()===df.org.toLowerCase()));
  if(detailSort.key) vmaps=sortBy(vmaps, m=>mapSortVal(m,wt,detailSort.key), detailSort.dir);

  // org options for this worktype
  const orgOpts=[...new Set(maps.flatMap(m=>m.organizations||[]))].sort((a,b)=>a.localeCompare(b));
  const anyFilter = dq||df.validated||df.org||detailSort.key;

  const bar=`<div class="section-bar"><h2>Mapping combinations</h2><div class="spacer"></div>
    <span class="chip">${isManual?'Manual · Queue mapping':'AWD · Business Area / Worktype / Status'}</span></div>
    <div class="list-filters">
      <div class="search" style="max-width:260px">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
        <input id="dfSearch" placeholder="Filter mappings…" value="${esc(df.text)}">
      </div>
      <select class="select lv-select" id="dfVal">
        <option value="">All validation</option>
        <option value="yes" ${df.validated==='yes'?'selected':''}>Validated</option>
        <option value="no" ${df.validated==='no'?'selected':''}>Not validated</option>
      </select>
      <select class="select lv-select" id="dfOrg">
        <option value="">All organizations</option>
        ${orgOpts.map(o=>`<option value="${esc(o)}" ${df.org===o?'selected':''}>${esc(o)}</option>`).join("")}
      </select>
      ${anyFilter?`<button class="btn small" id="dfClear">${svg(IC.x)} Clear</button>`:''}
      <span class="chip" style="margin-left:auto">${vmaps.length} of ${maps.length} shown</span>
    </div>`;

  let thead;
  if(isManual) thead=`<tr>${sh('Manual Verint Queue','manualQueue')}${sh('Organization(s) counted','organizations')}${sh('Source','source')}${sh('Remarks','remarks')}${sh('Validated','validated')}${sh('Updated','modifiedAt')}<th style="width:104px"></th></tr>`;
  else thead=`<tr>${sh('Business Area','businessArea')}${sh('Worktype','worktype')}${sh('Status','status')}${sh('Organization(s) counted','organizations')}${sh('Source','source')}${sh('Remarks','remarks')}${sh('Validated','validated')}${sh('Updated','modifiedAt')}<th style="width:104px"></th></tr>`;

  const rows=vmaps.map(m=> (m.id===editingMapId ? rowEdit(wt,m,isManual) : rowView(wt,m,isManual)).trim()).join("");

  const table=maps.length
    ? (vmaps.length
      ? `<div class="table-wrap"><table><thead>${thead}</thead><tbody>${rows}</tbody></table></div>`
      : `<div class="table-wrap"><div class="table-empty">${svg(IC.db)}<div style="margin-top:8px">No mappings match the current filters.</div></div></div>`)
    : `<div class="table-wrap"><div class="table-empty">
        ${svg(IC.db)}<div style="margin-top:8px">No mappings yet for this worktype.</div>
        <div style="margin-top:12px"><button class="btn primary small" onclick="openMapping('${wt.id}')">${svg(IC.plus)} Add first mapping</button></div>
      </div></div>`;

  main.innerHTML=head+cards+bar+table;

  // wire detail filter/sort
  const ds=document.getElementById("dfSearch");
  if(ds){ ds.oninput=()=>{ detailFilter.text=ds.value; renderMain(); const el=document.getElementById("dfSearch"); el.focus(); el.setSelectionRange(el.value.length,el.value.length); }; }
  const dv=document.getElementById("dfVal"); if(dv) dv.onchange=()=>{ detailFilter.validated=dv.value; renderMain(); };
  const dorg=document.getElementById("dfOrg"); if(dorg) dorg.onchange=()=>{ detailFilter.org=dorg.value; renderMain(); };
  const dc=document.getElementById("dfClear"); if(dc) dc.onclick=()=>{ detailFilter={text:"",validated:"",org:""}; detailSort={key:"",dir:"asc"}; renderMain(); };
  document.querySelectorAll("#main th[data-sort]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort;
    if(detailSort.key===k) detailSort.dir=detailSort.dir==="asc"?"desc":"asc";
    else { detailSort.key=k; detailSort.dir="asc"; }
    renderMain();
  });

  if(editingMapId) document.querySelector("tr.editing .inline-input")?.focus();
}
/* sortable header cell for detail table */
function sh(label,key){
  const active=detailSort.key===key;
  const arrow=active?(detailSort.dir==="asc"?' ▲':' ▼'):'';
  return `<th data-sort="${key}" class="th-sort ${active?'active':''}">${label}<span class="tha">${arrow}</span></th>`;
}

function rowView(wt,m,isManual){
  const histCount=(m.history||[]).length;
  const histBtn = histCount
    ? `<button class="minibtn" title="Version history (${histCount})" onclick="openHistory('${wt.id}','${m.id}')" style="position:relative">${svg(IC.clock)}<span class="ver-dot">${histCount}</span></button>`
    : `<button class="minibtn" title="Version history" onclick="openHistory('${wt.id}','${m.id}')">${svg(IC.clock)}</button>`;
  const acts=`<div class="cellactions">
    ${histBtn}
    <button class="minibtn" title="Edit inline" onclick="startInlineEdit('${m.id}')">${svg(IC.edit)}</button>
    <button class="minibtn del" title="Delete" onclick="deleteMapping('${wt.id}','${m.id}')">${svg(IC.del)}</button></div>`;
  const updated=`<div class="upd">
      <span class="ver-badge">v${m.version||1}</span>
      <span class="upd-date" title="Created: ${fmtDate(m.createdAt)}\nModified: ${fmtDate(m.modifiedAt)}">${fmtDateShort(m.modifiedAt||m.createdAt)}</span>
    </div>`;
  const validated=validatedCell(wt,m);
  if(isManual){
    return `<tr>
      <td><b>${esc(m.manualQueue)||'<span class="muted">—</span>'}</b></td>
      <td>${orgPills(m.organizations)}</td>
      <td>${esc(m.source)||'<span class="muted">—</span>'}</td>
      <td class="muted">${esc(m.remarks)||'—'}</td>
      <td>${validated}</td>
      <td>${updated}</td>
      <td>${acts}</td></tr>`;
  }
  return `<tr>
    <td><b>${esc(m.businessArea)||'<span class="muted">—</span>'}</b></td>
    <td>${esc(m.worktype)||'<span class="muted">—</span>'}</td>
    <td>${esc(m.status)||'<span class="muted">—</span>'}</td>
    <td>${orgPills(m.organizations)}</td>
    <td>${esc(m.source)||'<span class="muted">—</span>'}</td>
    <td class="muted">${esc(m.remarks)||'—'}</td>
    <td>${validated}</td>
    <td>${updated}</td>
    <td>${acts}</td></tr>`;
}
function validatedCell(wt,m){
  const on=!!m.validated;
  return `<label class="vchk ${on?'on':''}" title="${on?('Validated on '+fmtDate(m.validatedAt)):'Mark as validated'}">
      <input type="checkbox" ${on?'checked':''} onchange="toggleValidated('${wt.id}','${m.id}',this.checked)">
      <span class="box">${on?svg(IC.check):''}</span>
      <span class="vtxt">${on?fmtDateShort(m.validatedAt):'<span class="muted">Not validated</span>'}</span>
    </label>`;
}

function rowEdit(wt,m,isManual){
  const acts=`<div class="cellactions">
    <button class="minibtn ok" title="Save" onclick="saveInlineEdit('${wt.id}','${m.id}')">${svg(IC.check)}</button>
    <button class="minibtn" title="Cancel" onclick="cancelInlineEdit()">${svg(IC.x)}</button></div>`;
  const orgVal=(m.organizations||[]).join(", ");
  if(isManual){
    return `<tr class="editing">
      <td><input class="inline-input" id="ie_manualQueue" list="dl_manualQueue" value="${esc(m.manualQueue)}" placeholder="Queue name"></td>
      <td><input class="inline-input" id="ie_orgs" list="dl_organization" value="${esc(orgVal)}" placeholder="Org1, Org2"></td>
      <td><input class="inline-input" id="ie_source" list="dl_source" value="${esc(m.source)}" placeholder="Source"></td>
      <td><input class="inline-input" id="ie_remarks" value="${esc(m.remarks)}" placeholder="Remarks"></td>
      <td>${validatedCell(wt,m)}</td>
      <td><span class="ver-badge">v${m.version||1}</span></td>
      <td>${acts}</td></tr>`;
  }
  return `<tr class="editing">
    <td><input class="inline-input" id="ie_businessArea" list="dl_businessArea" value="${esc(m.businessArea)}" placeholder="Business Area"></td>
    <td><input class="inline-input" id="ie_worktype" list="dl_worktype" value="${esc(m.worktype)}" placeholder="Worktype"></td>
    <td><input class="inline-input" id="ie_status" list="dl_status" value="${esc(m.status)}" placeholder="Status"></td>
    <td><input class="inline-input" id="ie_orgs" list="dl_organization" value="${esc(orgVal)}" placeholder="Org1, Org2"></td>
    <td><input class="inline-input" id="ie_source" list="dl_source" value="${esc(m.source)}" placeholder="Source"></td>
    <td><input class="inline-input" id="ie_remarks" value="${esc(m.remarks)}" placeholder="Remarks"></td>
    <td>${validatedCell(wt,m)}</td>
    <td><span class="ver-badge">v${m.version||1}</span></td>
    <td>${acts}</td></tr>`;
}

function orgPills(orgs){
  if(!orgs||!orgs.length) return '<span class="muted">—</span>';
  return orgs.map(o=>`<span class="org-pill">${esc(o)}</span>`).join(" ");
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   RENDER: List View — all mappings across every worktype
   ============================================================ */
function flattenMappings(){
  const out=[];
  state.functions.forEach(fn=>(fn.subFunctions||[]).forEach(sf=>(sf.worktypes||[]).forEach(wt=>{
    (wt.mappings||[]).forEach(m=>out.push({fn,sf,wt,m}));
  })));
  return out;
}
function renderListView(){
  const main=document.getElementById("main");
  let rows=flattenMappings();
  const total=rows.length;

  // filters
  const f=listFilters;
  const q=(f.text||"").trim().toLowerCase();
  if(q) rows=rows.filter(r=>{
    const {fn,sf,wt,m}=r;
    return [fn.name,sf.name,wt.name,m.manualQueue,m.businessArea,m.worktype,m.status,m.source,m.remarks,(m.organizations||[]).join(" "),awdManualKey(wt.type,m)]
      .filter(Boolean).some(v=>v.toLowerCase().includes(q));
  });
  if(f.type) rows=rows.filter(r=>r.wt.type===f.type);
  if(f.validated==="yes") rows=rows.filter(r=>r.m.validated);
  if(f.validated==="no") rows=rows.filter(r=>!r.m.validated);

  // sort
  const lvKeyFn=(r)=>{
    switch(listSort.key){
      case "function": return r.fn.name||"";
      case "subFunction": return r.sf.name||"";
      case "worktypeName": return r.wt.name||"";
      case "type": return r.wt.type||"";
      case "key": return awdManualKey(r.wt.type,r.m);
      case "organizations": return (r.m.organizations||[]).join(", ");
      case "source": return r.m.source||"";
      case "validated": return r.m.validated?1:0;
      case "version": return r.m.version||1;
      default: return r.fn.name||"";
    }
  };
  rows=sortBy(rows, lvKeyFn, listSort.dir);

  const head=`<div class="detail-head">
    <div>
      <div class="breadcrumb">${svg(IC.list)} <b>All Mappings</b> · consolidated list view</div>
      <h1>List View</h1>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btnExportCsv2">${svg(IC.doc)} Export CSV</button>
  </div>`;

  const valTotal=flattenMappings().filter(r=>r.m.validated).length;
  const cards=`<div class="cards">
    <div class="card"><div class="k">Total mappings</div><div class="v">${total}</div></div>
    <div class="card"><div class="k">AWD</div><div class="v" style="color:var(--awd)">${flattenMappings().filter(r=>r.wt.type==='awd').length}</div></div>
    <div class="card"><div class="k">Manual</div><div class="v" style="color:var(--manual)">${flattenMappings().filter(r=>r.wt.type==='manual').length}</div></div>
    <div class="card"><div class="k">Validated</div><div class="v" style="color:${valTotal===total&&total?'var(--manual)':'var(--ink)'}">${valTotal}<span style="font-size:14px;color:var(--muted);font-weight:500">/${total}</span></div></div>
  </div>`;

  const filters=`<div class="list-filters">
    <div class="search" style="max-width:320px">
      ${svg(IC.list,'').replace(IC.list,'<circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/>')}
      <input id="lvSearch" placeholder="Search all mappings…" value="${esc(f.text)}">
    </div>
    <select class="select lv-select" id="lvType">
      <option value="">All types</option>
      <option value="awd" ${f.type==='awd'?'selected':''}>AWD only</option>
      <option value="manual" ${f.type==='manual'?'selected':''}>Manual only</option>
    </select>
    <select class="select lv-select" id="lvVal">
      <option value="">All validation</option>
      <option value="yes" ${f.validated==='yes'?'selected':''}>Validated</option>
      <option value="no" ${f.validated==='no'?'selected':''}>Not validated</option>
    </select>
    ${(f.text||f.type||f.validated||listSort.key!=='function'||listSort.dir!=='asc')?`<button class="btn small" id="lvClear">${svg(IC.x)} Clear</button>`:''}
    <span class="chip" style="margin-left:auto">${rows.length} of ${total} shown</span>
  </div>`;

  const lvh=(label,key)=>{
    const active=listSort.key===key;
    const arrow=active?(listSort.dir==="asc"?' ▲':' ▼'):'';
    return `<th data-lvsort="${key}" class="th-sort ${active?'active':''}">${label}<span class="tha">${arrow}</span></th>`;
  };
  const thead=`<tr>
    ${lvh('Function','function')}${lvh('Sub-Function','subFunction')}${lvh('Dashboard Worktype','worktypeName')}${lvh('Type','type')}
    ${lvh('AWD &amp; Manual Verint Queue','key')}${lvh('Organization(s)','organizations')}${lvh('Source','source')}
    ${lvh('Validated','validated')}${lvh('Version','version')}<th style="width:80px"></th></tr>`;

  const body=rows.map(r=>{
    const {fn,sf,wt,m}=r;
    const key=awdManualKey(wt.type,m);
    const valCell=m.validated
      ? `<span class="lv-val on">${svg(IC.check)} ${fmtDateShort(m.validatedAt)}</span>`
      : `<span class="lv-val muted">—</span>`;
    return `<tr>
      <td>${esc(fn.name)}</td>
      <td>${esc(sf.name)}</td>
      <td><b>${esc(wt.name)}</b></td>
      <td><span class="tag ${wt.type}">${wt.type}</span></td>
      <td><code class="keycode">${esc(key)||'<span class="muted">—</span>'}</code></td>
      <td>${orgPills(m.organizations)}</td>
      <td>${esc(m.source)||'<span class="muted">—</span>'}</td>
      <td>${valCell}</td>
      <td><span class="ver-badge">v${m.version||1}</span></td>
      <td><div class="cellactions">
        <button class="minibtn" title="Open in detail" onclick="openFromList('${wt.id}')">${svg(IC.doc)}</button>
        <button class="minibtn" title="History" onclick="openHistory('${wt.id}','${m.id}')">${svg(IC.clock)}</button>
      </div></td></tr>`;
  }).join("");

  const table = rows.length
    ? `<div class="table-wrap"><table><thead>${thead}</thead><tbody>${body}</tbody></table></div>`
    : `<div class="table-wrap"><div class="table-empty">${svg(IC.db)}<div style="margin-top:8px">${total?'No mappings match the current filters.':'No mappings yet. Add worktypes and mappings to see them here.'}</div></div></div>`;

  main.innerHTML=head+cards+filters+`<div class="section-bar"><h2>All mapping combinations</h2></div>`+table;

  // wiring
  const s=document.getElementById("lvSearch");
  s.oninput=()=>{ listFilters.text=s.value; renderListView(); s.focus(); s.setSelectionRange(s.value.length,s.value.length); };
  document.getElementById("lvType").onchange=(e)=>{ listFilters.type=e.target.value; renderListView(); };
  document.getElementById("lvVal").onchange=(e)=>{ listFilters.validated=e.target.value; renderListView(); };
  document.getElementById("btnExportCsv2").onclick=()=>document.getElementById("btnExportCsv").click();
  const lvc=document.getElementById("lvClear");
  if(lvc) lvc.onclick=()=>{ listFilters={text:"",type:"",validated:""}; listSort={key:"function",dir:"asc"}; renderListView(); };
  document.querySelectorAll("#main th[data-lvsort]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.lvsort;
    if(listSort.key===k) listSort.dir=listSort.dir==="asc"?"desc":"asc";
    else { listSort.key=k; listSort.dir="asc"; }
    renderListView();
  });
}
function openFromList(wtId){ viewMode="detail"; selection.worktypeId=wtId; editingMapId=null; renderAll(); }

function parseOrgs(str){

/* ============================================================
   Change tracking: created / modified dates + version history
   ============================================================ */
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return "—";
  const d=new Date(iso); if(isNaN(d)) return "—";
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function fmtDateShort(iso){
  if(!iso) return "—";
  const d=new Date(iso); if(isNaN(d)) return "—";
  const p=n=>String(n).padStart(2,"0");
  return p(d.getMonth()+1)+"/"+p(d.getDate())+"/"+String(d.getFullYear()).slice(2)+" "+p(d.getHours())+":"+p(d.getMinutes());
}
/* snapshot of the editable fields only */
function snapshotFields(m){
  return {
    manualQueue:m.manualQueue||"", businessArea:m.businessArea||"", worktype:m.worktype||"",
    status:m.status||"", organizations:[...(m.organizations||[])], source:m.source||"", remarks:m.remarks||""
  };
}
function sameFields(a,b){
  return a.manualQueue===b.manualQueue && a.businessArea===b.businessArea && a.worktype===b.worktype
    && a.status===b.status && a.source===b.source && a.remarks===b.remarks
    && (a.organizations||[]).join("|").toLowerCase()===(b.organizations||[]).join("|").toLowerCase();
}
/* build a history entry capturing an OLD version before it is overwritten */
function historyEntry(m){
  return { version:m.version||1, savedAt:m.modifiedAt||m.createdAt||nowISO(), fields:snapshotFields(m) };
}
/* stamp a brand new record */
function stampNew(rec){
  const t=nowISO();
  rec.createdAt=t; rec.modifiedAt=t; rec.version=1; rec.history=[];
  return rec;
}
/* apply an edit to an existing in-place record `m`, given its pre-edit snapshot `before` */
function stampEdit(m, before){
  if(!m.createdAt) m.createdAt=nowISO();
  const after=snapshotFields(m);
  if(!sameFields(before, after)){
    m.history=m.history||[];
    m.history.push({ version:m.version||1, savedAt:m.modifiedAt||m.createdAt, fields:before });
    m.version=(m.version||1)+1;
    m.modifiedAt=nowISO();
    return true;
  }
  if(!m.modifiedAt) m.modifiedAt=m.createdAt;
  return false;
}

/* ============================================================
   Version history modal
   ============================================================ */
let histCtx=null;
function openHistory(wtId,mId){
  const ctx=findWorktype(wtId); if(!ctx) return;
  const m=(ctx.wt.mappings||[]).find(x=>x.id===mId); if(!m) return;
  histCtx={wtId,mId};
  const isManual=ctx.wt.type==="manual";
  const labelOf = isManual
    ? (m.manualQueue||"(queue)")
    : [m.businessArea,m.worktype,m.status].filter(Boolean).join(" · ")||"(mapping)";
  document.getElementById("histTitle").textContent="Version History · "+labelOf;

  const meta=`<div class="hist-meta">
    <div class="m"><span class="l">Created</span><span class="v">${fmtDate(m.createdAt)}</span></div>
    <div class="m"><span class="l">Last modified</span><span class="v">${fmtDate(m.modifiedAt||m.createdAt)}</span></div>
    <div class="m"><span class="l">Current version</span><span class="v">v${m.version||1}</span></div>
    <div class="m"><span class="l">Revisions</span><span class="v">${(m.history||[]).length}</span></div>
  </div>`;

  // Build timeline: current version first, then previous versions (newest first)
  const items=[];
  items.push(tlItem(m.version||1, m.modifiedAt||m.createdAt, snapshotFields(m), isManual, true, null, m));
  const hist=[...(m.history||[])].sort((a,b)=>(b.version||0)-(a.version||0));
  let prevForDiff=snapshotFields(m);
  hist.forEach(h=>{
    items.push(tlItem(h.version, h.savedAt, h.fields, isManual, false, prevForDiff, m));
    prevForDiff=h.fields;
  });

  const body = (m.history&&m.history.length)
    ? meta+`<div class="timeline">${items.join("")}</div>`
    : meta+`<div class="hist-empty">No previous revisions yet — this mapping is still on its first version.<br>Any future edits will be recorded here.</div>`;

  document.getElementById("histBody").innerHTML=body;
  showOverlay("hist");

  document.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>restoreVersion(+b.dataset.restore));
}
function tlItem(version, when, f, isManual, isCurrent, diffAgainst, m){
  const fields = isManual
    ? [["Manual Verint Queue","manualQueue"],["Organizations","organizations"],["Source","source"],["Remarks","remarks"]]
    : [["Business Area","businessArea"],["Worktype","worktype"],["Status","status"],["Organizations","organizations"],["Source","source"],["Remarks","remarks"]];
  const cells=fields.map(([lab,key])=>{
    let cur = key==="organizations" ? (f.organizations||[]).join(", ") : (f[key]||"");
    let changed=false;
    if(diffAgainst){
      let other = key==="organizations" ? (diffAgainst.organizations||[]).join(", ") : (diffAgainst[key]||"");
      changed = (cur.toLowerCase()!==other.toLowerCase());
    }
    return `<div class="f ${changed?'chg':''}"><span class="fl">${lab}</span><span class="fv" title="${esc(cur)}">${esc(cur)||'<span class="muted">—</span>'}</span></div>`;
  }).join("");
  const restoreBtn = isCurrent ? "" :
    `<button class="btn small" data-restore="${version}" title="Restore this version">${svg(IC.restore)} Restore</button>`;
  return `<div class="tl-item ${isCurrent?'':'old'}">
    <span class="dot"></span>
    <div class="tl-head">
      <span class="vb">v${version}</span>
      <span class="when">${fmtDate(when)}</span>
      ${isCurrent?'<span class="cur">Current</span>':''}
      <span class="spacer"></span>
      ${restoreBtn}
    </div>
    <div class="tl-fields">${cells}</div>
  </div>`;
}
function restoreVersion(version){
  if(!histCtx) return;
  const ctx=findWorktype(histCtx.wtId); if(!ctx) return;
  const m=(ctx.wt.mappings||[]).find(x=>x.id===histCtx.mId); if(!m) return;
  const h=(m.history||[]).find(x=>x.version===version); if(!h) return;
  if(!confirm(`Restore version v${version}? The current values will be saved as a new version.`)) return;
  const before=snapshotFields(m);
  const f=h.fields;
  m.manualQueue=f.manualQueue||""; m.businessArea=f.businessArea||""; m.worktype=f.worktype||"";
  m.status=f.status||""; m.organizations=[...(f.organizations||[])]; m.source=f.source||""; m.remarks=f.remarks||"";
  stampEdit(m, before);
  learn(m);
  closeOverlay("hist"); renderAll(); toast("Restored to v"+version+" (now v"+m.version+")");
}

          <textarea id="dirBulkText" placeholder="Paste multiple ${esc(label)} values — one per line, or comma / tab / semicolon separated…"></textarea>
          <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap">
            <button class="btn primary small" id="dirBulkAdd">${svg(IC.check)} Add all</button>
            <button class="btn small" id="dirBulkFile">${svg(IC.folder)} Import from file (.csv/.txt)</button>
            <input type="file" id="dirBulkFileInput" accept=".csv,.txt" style="display:none" />
            <span class="hint" id="dirBulkHint" style="margin-left:auto">Duplicates are skipped automatically</span>
          </div>
        </div>
      </div>
      <div class="dir-list">${list}</div>
    </div></div>`;

  // wiring
  document.querySelectorAll(".dir-cat").forEach(b=>b.onclick=()=>{ dirActiveCat=b.dataset.cat; dirEditIdx=null; renderDir(); });
  const addBtn=document.getElementById("dirAddBtn");
  const newInp=document.getElementById("dirNewInput");
  const doAdd=()=>{ const v=newInp.value.trim(); if(!v){ toast("Enter a value","warn"); return; }
    if((state.directories[dirActiveCat]||[]).some(x=>x.toLowerCase()===v.toLowerCase())){ toast("Already exists","warn"); return; }
    state.directories[dirActiveCat].push(v); newInp.value=""; save(); renderDatalists(); renderDir(); toast("Added"); };
  addBtn.onclick=doAdd;
  newInp.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); doAdd(); } };
  setTimeout(()=>newInp.focus(),20);

  // ---- Bulk paste / import ----
  const bulkToggle=document.getElementById("dirBulkToggle");
  const bulkPanel=document.getElementById("dirBulkPanel");
  bulkToggle.onclick=()=>{ bulkPanel.style.display = bulkPanel.style.display==="none"?"block":"none"; if(bulkPanel.style.display==="block") document.getElementById("dirBulkText").focus(); };
  const commitBulk=(raw)=>{
    const items=parseBulkValues(raw);
    if(items.length===0){ toast("No values found","warn"); return; }
    const existing=state.directories[dirActiveCat]||[];
    let added=0, skipped=0;
    items.forEach(v=>{
      if(existing.some(x=>x.toLowerCase()===v.toLowerCase())) { skipped++; return; }
      existing.push(v); added++;
    });
    save(); renderDatalists(); renderDir();
    toast(`Added ${added}${skipped?`, skipped ${skipped} duplicate${skipped>1?'s':''}`:''}`);
  };
  document.getElementById("dirBulkAdd").onclick=()=>commitBulk(document.getElementById("dirBulkText").value);
  document.getElementById("dirBulkFile").onclick=()=>document.getElementById("dirBulkFileInput").click();
  document.getElementById("dirBulkFileInput").onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ commitBulk(r.result); e.target.value=""; };
    r.readAsText(f);
  };

  document.querySelectorAll("[data-diract]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.diract, i=+b.dataset.i;
    if(a==="edit"){ dirEditIdx=i; renderDir(); document.getElementById("dirEditInput")?.focus(); }
    if(a==="cancel"){ dirEditIdx=null; renderDir(); }
    if(a==="save"){
      const nv=document.getElementById("dirEditInput").value.trim();
      if(!nv){ toast("Value cannot be empty","warn"); return; }
      state.directories[dirActiveCat][i]=nv; dirEditIdx=null; save(); renderDatalists(); renderDir(); toast("Updated");
    }
    if(a==="del"){
      if(!confirm(`Remove "${state.directories[dirActiveCat][i]}" from ${label}?`)) return;
      state.directories[dirActiveCat].splice(i,1); dirEditIdx=null; save(); renderDatalists(); renderDir(); toast("Removed");
    }
  });
  const ei=document.getElementById("dirEditInput");
  if(ei) ei.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); document.querySelector('[data-diract="save"]')?.click(); }
    else if(e.key==="Escape"){ dirEditIdx=null; renderDir(); } };
}
function dirItem(v,i){
  if(i===dirEditIdx){
    return `<div class="dir-item">
      <input id="dirEditInput" value="${esc(v)}" />
      <button class="minibtn ok" data-diract="save" data-i="${i}" title="Save">${svg(IC.check)}</button>
      <button class="minibtn" data-diract="cancel" data-i="${i}" title="Cancel">${svg(IC.x)}</button>
    </div>`;
  }
  return `<div class="dir-item">
    <span class="t">${esc(v)}</span>
    <button class="minibtn" data-diract="edit" data-i="${i}" title="Edit">${svg(IC.edit)}</button>
    <button class="minibtn del" data-diract="del" data-i="${i}" title="Remove">${svg(IC.del)}</button>
  </div>`;
}
document.getElementById("btnDirectories").onclick=openDirectories;
document.getElementById("btnAbout").onclick=openAbout;

/* ---- Responsive sidebar drawer ---- */
function isDrawerMode(){ return window.matchMedia("(max-width:900px)").matches; }
function openDrawer(){ document.getElementById("sidebar").classList.add("open"); document.getElementById("drawerBackdrop").classList.add("show"); }
function closeDrawer(){ document.getElementById("sidebar").classList.remove("open"); document.getElementById("drawerBackdrop").classList.remove("show"); }
function toggleDrawer(){ document.getElementById("sidebar").classList.contains("open")?closeDrawer():openDrawer(); }
document.getElementById("menuToggle").onclick=toggleDrawer;
document.getElementById("drawerBackdrop").onclick=closeDrawer;
window.addEventListener("resize",()=>{ if(!isDrawerMode()) closeDrawer(); });
document.getElementById("btnListView").onclick=()=>{
  viewMode = viewMode==="list" ? "detail" : "list";
  editingMapId=null; renderAll(); if(isDrawerMode()) closeDrawer();
};

/* ============================================================
   Tree interactions
   ============================================================ */
document.getElementById("tree").addEventListener("click",(e)=>{
  const actBtn=e.target.closest("[data-act]");
  if(actBtn){
    e.stopPropagation();
    const a=actBtn.dataset.act;
    if(a==="addsf") openEntity("subfunction",null,actBtn.dataset.fn);
    if(a==="editfn") openEntity("function",actBtn.dataset.fn);
    if(a==="delfn") deleteFunction(actBtn.dataset.fn);
    if(a==="addwt") openEntity("worktype",null,actBtn.dataset.sf);
    if(a==="editsf") openEntity("subfunction",actBtn.dataset.sf);
    if(a==="delsf") deleteSub(actBtn.dataset.sf);
    if(a==="editwt") openEntity("worktype",actBtn.dataset.wt);
    if(a==="delwt") deleteWorktype(actBtn.dataset.wt);
    return;
  }
  const sel=e.target.closest("[data-select]");
  if(sel){ viewMode="detail"; selection.worktypeId=sel.dataset.select; editingMapId=null; renderAll(); if(isDrawerMode()) closeDrawer(); return; }
  const tog=e.target.closest("[data-toggle]");
  if(tog){ const id=tog.dataset.toggle; expanded.has(id)?expanded.delete(id):expanded.add(id); renderTree(); }
});

/* ============================================================
   Toolbar: search / add / import / export
   ============================================================ */
document.getElementById("searchInput").oninput=(e)=>{ searchTerm=e.target.value; renderTree(); };
document.getElementById("btnAddFunction").onclick=()=>openEntity("function");

/* ---- Sidebar filter & sort ---- */
function updateSideDirBtn(){
  const b=document.getElementById("scDir");
  const disabled = sidebarSort.key==="custom";
  b.style.opacity = disabled?".4":"1";
  b.style.pointerEvents = disabled?"none":"auto";
  b.innerHTML = sidebarSort.dir==="asc"
    ? '<svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>'
    : '<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';
}
function updateSideFilterBadge(){
  const btn=document.getElementById("btnSideFilter");
  const active = sidebarSort.key!=="custom" || sidebarSort.type || sidebarSort.validated;
  btn.style.color = active?"var(--brand)":"var(--muted)";
  btn.style.borderColor = active?"var(--brand)":"var(--line)";
}
document.getElementById("btnSideFilter").onclick=()=>{
  const c=document.getElementById("sideControls");
  c.style.display = c.style.display==="none" ? "block" : "none";
};
document.getElementById("scSort").onchange=(e)=>{ sidebarSort.key=e.target.value; updateSideDirBtn(); updateSideFilterBadge(); renderTree(); };
document.getElementById("scDir").onclick=()=>{ sidebarSort.dir=sidebarSort.dir==="asc"?"desc":"asc"; updateSideDirBtn(); renderTree(); };
document.getElementById("scType").onchange=(e)=>{ sidebarSort.type=e.target.value; updateSideFilterBadge(); renderTree(); };
document.getElementById("scVal").onchange=(e)=>{ sidebarSort.validated=e.target.value; updateSideFilterBadge(); renderTree(); };
document.getElementById("scClear").onclick=()=>{

  document.getElementById("scSort").value="custom";

  document.getElementById("scVal").value="";

};
updateSideDirBtn(); updateSideFilterBadge();

document.getElementById("btnExportJson").onclick=()=>{
  download("verint-mapping-"+stamp()+".json", JSON.stringify(state,null,2), "application/json"); toast("JSON exported");
};
document.getElementById("btnExportCsv").onclick=()=>{
  download("verint-mapping-"+stamp()+".csv", buildCsv(), "text/csv"); toast("CSV exported");
};
document.getElementById("btnImport").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=(e)=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.functions) throw 0;
      if(!confirm("Import will replace current data. Continue?")){ e.target.value=""; return; }
      state=data; ensureDirectories(); selection.worktypeId=null; editingMapId=null; renderAll(); toast("Data imported");
    }catch{ toast("Invalid JSON file","warn"); }
    e.target.value="";
  };
  r.readAsText(f);
};

/* Build the combined key:
   AWD  -> BUSINESSAREA_WORKTYPE_STATUS
   Manual -> Manual Verint Queue value */
function awdManualKey(type,m){
  if(type==="manual") return (m.manualQueue||"").trim();
  return [m.businessArea,m.worktype,m.status].map(v=>(v||"").trim()).join("_");
}
function buildCsv(){
  const head=["Function","Sub-Function","Dashboard Worktype","Type","AWD & Manual Verint Queue","Manual Verint Queue","Business Area","Worktype","Status","Organization","Source","Remarks","Validated","Validation Date","Version","Created Date","Modified Date"];
  const rows=[head];
  state.functions.forEach(fn=>(fn.subFunctions||[]).forEach(sf=>(sf.worktypes||[]).forEach(wt=>{
    const maps=wt.mappings||[];
    if(maps.length===0){ rows.push([fn.name,sf.name,wt.name,wt.type,"","","","","","","","","","","","",""]); return; }
    maps.forEach(m=>{
      const key=awdManualKey(wt.type,m);
      const orgs=(m.organizations||[]); const list=orgs.length?orgs:[""];
      list.forEach(org=>rows.push([fn.name,sf.name,wt.name,wt.type, key,
        m.manualQueue||"", m.businessArea||"", m.worktype||"", m.status||"", org, m.source||"", m.remarks||"",
        m.validated?"Yes":"No", m.validated?fmtDate(m.validatedAt):"",
        "v"+(m.version||1), fmtDate(m.createdAt), fmtDate(m.modifiedAt||m.createdAt)]));
    });
  })));
  return rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
}
function csvCell(v){ v=(v==null?"":String(v)); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function download(name,content,type){
  const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes()); }

/* ============================================================
   Overlay + toast
   ============================================================ */
function showOverlay(k){ document.getElementById(k+"Overlay").classList.add("show"); }
function closeOverlay(k){ document.getElementById(k+"Overlay").classList.remove("show"); }
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeOverlay(b.dataset.close));
document.querySelectorAll(".overlay").forEach(o=>o.onclick=(e)=>{ if(e.target===o) o.classList.remove("show"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ document.querySelectorAll(".overlay.show").forEach(o=>o.classList.remove("show")); closeDrawer(); } });

let toastT;
function toast(msg,type){
  const t=document.getElementById("toast");
  t.innerHTML=(type==="warn"
    ? '<svg class="icon" viewBox="0 0 24 24" style="color:#fbbf24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>'
    : '<svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>')+esc(msg);
  t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200);
}

   Init
   ============================================================ */

load().then(init);
