<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verint Mapping Manager</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb;
    --brand:#2f6fed; --brand-soft:#e8f0fe; --awd:#2f6fed; --manual:#0f9d76; --danger:#e0483b; --warn:#d97706;
    --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
    --font:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .icon{width:16px;height:16px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  .topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:45}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.2px;min-width:0}
  .brand .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .brand .mark svg{width:16px;height:16px;stroke:#fff}
  .brand-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .spacer{flex:1}
  .menu-toggle{display:none;width:36px;height:36px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;align-items:center;justify-content:center;flex:0 0 auto}
  .menu-toggle:hover{background:#f7f8fa}
  .menu-toggle .icon{width:18px;height:18px}
  .tbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font-size:13px;font-weight:500;flex:0 0 auto;white-space:nowrap}
  .tbtn:hover{background:#f7f8fa}
  .tbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .tbtn.primary:hover{background:#2560d8}
  .tbtn .icon{width:15px;height:15px}
  .drawer-backdrop{display:none;position:fixed;inset:56px 0 0 0;background:rgba(17,24,39,.4);z-index:38}
  .drawer-backdrop.show{display:block}

  .layout{display:flex;height:calc(100vh - 56px)}
  .sidebar{width:340px;flex:0 0 340px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .26s cubic-bezier(.4,0,.2,1)}
  .side-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  .side-head .row{display:flex;gap:8px;align-items:center}
  .search{flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
  .search input{border:0;background:transparent;outline:none;width:100%;font-size:13px;color:var(--ink)}
  .search .icon{color:var(--muted)}
  .addfn{height:34px;width:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;flex:0 0 auto}
  .addfn:hover{background:#2560d8}
  .side-controls{margin-top:10px;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;gap:8px}
  .sc-row{display:flex;align-items:center;gap:8px}
  .sc-row label{font-size:11px;font-weight:600;color:var(--muted);width:42px;flex:0 0 auto}
  .sc-sel{flex:1;height:30px;font-size:12px;padding:0 8px;min-width:0}
  .sc-dir{width:30px;height:30px;flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--brand)}
  .sc-dir:hover{background:#f0f2f5}
  .sc-dir .icon{width:14px;height:14px}
  .sc-clear{border:0;background:transparent;color:var(--brand);font-size:12px;font-weight:600;cursor:pointer;padding:2px;text-align:left}
  .sc-clear:hover{text-decoration:underline}
  .side-stats{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .chip{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
  .tree{overflow:auto;padding:8px;flex:1}
  .dev-info{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .dev-avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
  .dev-meta{min-width:0}
  .dev-label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  .dev-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dev-mail{font-size:11px;color:var(--brand);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .dev-mail:hover{text-decoration:underline}

  .node{user-select:none}
  .node .label{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;position:relative}
  .node .label:hover{background:#f5f6f8}
  .node .label.active{background:var(--brand-soft)}
  .caret{width:16px;height:16px;color:var(--muted);transition:transform .12s ease;flex:0 0 auto}
  .caret.open{transform:rotate(90deg)}
  .caret.hidden{visibility:hidden}
  .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .fn-name{font-weight:600}
  .sf-name{font-weight:500}
  .cnt{font-size:11px;color:var(--muted);background:#eef0f3;border-radius:10px;padding:1px 7px}
  .rowactions{display:none;gap:2px}
  .node .label:hover .rowactions{display:flex}
  .minibtn{width:24px;height:24px;border:0;background:transparent;color:var(--muted);border-radius:6px;display:flex;align-items:center;justify-content:center}
  .minibtn:hover{background:#e6e8ec;color:var(--ink)}
  .minibtn.del:hover{background:#fde7e5;color:var(--danger)}
  .minibtn.ok:hover{background:#e4f6ef;color:var(--manual)}
  .children{margin-left:14px;border-left:1px solid var(--line);padding-left:4px}
  .tag{font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:5px;text-transform:uppercase}
  .tag.awd{background:#e8f0fe;color:var(--awd)}
  .tag.manual{background:#e4f6ef;color:var(--manual)}
  .addline{display:flex;align-items:center;gap:6px;padding:5px 8px;margin:2px 0;color:var(--brand);font-size:12px;font-weight:600;border-radius:7px;cursor:pointer}
  .addline:hover{background:var(--brand-soft)}

  .main{flex:1;overflow:auto;padding:22px 26px}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center;gap:10px}
  .empty svg{width:44px;height:44px;color:#c3c8d0}
  .empty h3{margin:6px 0 0;color:var(--ink);font-weight:600}
  .empty p{margin:0;max-width:380px;line-height:1.5}
  .detail-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
  .breadcrumb{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .breadcrumb b{color:var(--ink);font-weight:600}
  .detail-head h1{margin:0;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
  .detail-head .spacer{flex:1}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .card .k{font-size:12px;color:var(--muted)}
  .card .v{font-size:22px;font-weight:700;margin-top:2px}
  .section-bar{display:flex;align-items:center;margin:0 0 12px}
  .section-bar h2{font-size:15px;margin:0;font-weight:600}
  .section-bar .spacer{flex:1}

  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:visible}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fafbfc}
  tbody tr.editing{background:#f5f8ff !important}
  tbody tr.row-selected{background:var(--brand-soft) !important}
  .org-pill{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:2px 8px;font-weight:600;font-size:12px;margin:1px 0}
  .muted{color:var(--muted)}
  .cellactions{display:flex;gap:4px;justify-content:flex-end}
  .table-empty{padding:34px;text-align:center;color:var(--muted)}
  .inline-input{width:100%;min-width:70px;height:32px;padding:0 8px;border:1px solid var(--brand);border-radius:6px;font-size:13px;font-family:inherit;color:var(--ink);outline:none;background:#fff}
  .inline-input:focus{box-shadow:0 0 0 3px rgba(47,111,237,.14)}
  .upd{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
  .ver-badge{display:inline-block;background:#eef0f3;color:var(--muted);border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700;width:fit-content}
  .upd-date{font-size:11px;color:var(--muted)}
  .ver-dot{position:absolute;top:-3px;right:-3px;background:var(--brand);color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1}
  .vchk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
  .vchk input{position:absolute;opacity:0;width:0;height:0}
  .vchk .box{width:18px;height:18px;border:1.6px solid #c3c8d0;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;transition:.12s}
  .vchk .box .icon{width:13px;height:13px;stroke-width:2.6}
  .vchk.on .box{background:var(--manual);border-color:var(--manual)}
  .vchk:hover .box{border-color:var(--manual)}
  .vchk .vtxt{font-size:11px;color:var(--manual);font-weight:600}
  .vchk:not(.on) .vtxt{font-weight:400}
  .statustog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:3px 10px 3px 8px;cursor:pointer;white-space:nowrap;font-family:inherit}
  .statustog:hover{border-color:#c3c8d0}
  .statustog .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .statustog.on .dot{background:var(--manual);box-shadow:0 0 0 3px rgba(15,157,118,.16)}
  .statustog.off .dot{background:#c3c8d0;box-shadow:0 0 0 3px rgba(150,150,150,.14)}
  .statustog .st-lbl{font-size:12px;font-weight:700}
  .statustog.on .st-lbl{color:var(--manual)}
  .statustog.off .st-lbl{color:var(--muted)}
  .statustog .st-date{font-size:10px;color:var(--muted)}
  .rowcb{display:inline-flex;align-items:center;cursor:pointer}
  .rowcb input{position:absolute;opacity:0;width:0;height:0}
  .rowcb .cbbox{width:18px;height:18px;border:1.6px solid #c3c8d0;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;transition:.12s}
  .rowcb .cbbox .icon{width:13px;height:13px;stroke-width:2.8}
  .rowcb.on .cbbox{background:var(--brand);border-color:var(--brand)}
  .rowcb:hover .cbbox{border-color:var(--brand)}
  .dupflag{display:inline-flex;align-items:center;gap:4px;margin-left:6px;color:var(--warn);font-size:11px;font-weight:700;cursor:help}
  .dupflag .icon{width:13px;height:13px}

  .bulkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:10px;padding:9px 12px;margin-bottom:12px;box-shadow:var(--shadow);animation:bbIn .18s ease}
  @keyframes bbIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .bb-count{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
  .bb-count .icon{width:15px;height:15px;color:#4ade80}
  .bb-sep{width:1px;height:20px;background:rgba(255,255,255,.2)}
  .bb-act{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:7px;font-size:12.5px;font-weight:500}
  .bb-act:hover{background:rgba(255,255,255,.18)}
  .bb-act .icon{width:14px;height:14px}
  .bb-act.danger{border-color:rgba(224,72,59,.5);background:rgba(224,72,59,.22)}
  .bb-act.danger:hover{background:rgba(224,72,59,.4)}
  .bb-clear{border:0;background:transparent;color:#cbd5e1;font-size:12.5px;font-weight:600;cursor:pointer;margin-left:auto}
  .bb-clear:hover{color:#fff;text-decoration:underline}

  .btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:13px;font-weight:500;color:var(--ink)}
  .btn:hover{background:#f7f8fa}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#2560d8}
  .btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
  .btn.warn:hover{filter:brightness(.94)}
  .btn.small{height:30px;padding:0 10px;font-size:12px}

  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);width:100%;max-width:560px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
  .modal.wide{max-width:680px}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal-head h3{margin:0;font-size:16px;font-weight:700}
  .modal-head .x{margin-left:auto;width:30px;height:30px;border:0;background:transparent;color:var(--muted);border-radius:7px;display:flex;align-items:center;justify-content:center}
  .modal-head .x:hover{background:#f0f1f3;color:var(--ink)}
  .modal-body{padding:18px 20px;overflow:auto}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fafbfc;align-items:center}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .field label .req{color:var(--danger)}
  .field .hint{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
  .input,.select,textarea{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;outline:none}
  textarea{height:auto;padding:9px 11px;resize:vertical;min-height:62px;line-height:1.4}
  .input:focus,.select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .toggle .opt{border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  .toggle .opt:hover{border-color:#cfd6e4}
  .toggle .opt.sel{border-color:var(--brand);background:var(--brand-soft)}
  .toggle .opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid #c3c8d0;margin-top:1px;flex:0 0 auto}
  .toggle .opt.sel .dot{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px #fff}
  .toggle .opt .t{font-weight:600;font-size:13px}
  .toggle .opt .d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}

  .tokbox{border:1px solid var(--line);border-radius:8px;padding:7px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:40px}
  .tokbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  .tokbox input{border:0;outline:none;flex:1;min-width:120px;height:26px;font-size:13px;font-family:inherit;background:transparent}
  .token{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:3px 6px 3px 9px;font-size:12px;font-weight:600}
  .token.org{background:#e4f6ef;color:var(--manual)}
  .token button{border:0;background:transparent;color:inherit;cursor:pointer;display:flex;padding:0;line-height:0}
  .token button:hover{color:var(--danger)}
  .combo-note{font-size:12px;color:var(--muted);margin-right:auto}
  .combo-note b{color:var(--brand)}

  .dir-layout{display:flex;min-height:360px}
  .dir-cats{width:200px;border-right:1px solid var(--line);padding-right:12px;display:flex;flex-direction:column;gap:3px}
  .dir-cat{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%;color:var(--ink)}
  .dir-cat:hover{background:#f4f5f7}
  .dir-cat.sel{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .dir-cat .c{margin-left:auto;font-size:11px;background:#eef0f3;color:var(--muted);border-radius:10px;padding:1px 7px}
  .dir-cat.sel .c{background:#fff;color:var(--brand)}
  .dir-entries{flex:1;padding-left:16px;display:flex;flex-direction:column;min-width:0}
  .dir-add{display:flex;gap:8px;margin-bottom:8px}
  .dir-dupmsg{font-size:12px;color:var(--danger);margin-bottom:10px;display:none;align-items:center;gap:6px}
  .dir-dupmsg.show{display:flex}
  .dir-list{overflow:auto;max-height:330px;display:flex;flex-direction:column;gap:6px;padding-right:2px}
  .dir-item{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border:1px solid var(--line);border-radius:8px}
  .dir-item .t{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dir-item input{flex:1;height:30px;border:1px solid var(--brand);border-radius:6px;padding:0 8px;font-size:13px;outline:none;font-family:inherit}
  .dir-empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:13px}
  .split-summary{font-size:12px;margin:10px 0 8px;color:var(--ink)}
  .split-summary .icon{width:13px;height:13px;color:var(--manual);vertical-align:-2px}
  .split-table-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:230px}
  .split-table{width:100%;border-collapse:collapse;font-size:12px}
  .split-table th{position:sticky;top:0;text-align:left;background:#fafbfc;color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.3px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .split-table td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .split-table tr:last-child td{border-bottom:0}
  .split-table tr.sp-invalid td{background:#fef6f5}
  .split-table .icon{width:12px;height:12px;color:var(--warn);vertical-align:-2px}
  .sp-new{font-size:10px;font-weight:700;color:var(--manual);background:#e4f6ef;border-radius:4px;padding:0 5px;margin-left:4px}
  .sp-dup{font-size:10px;font-weight:700;color:var(--muted);background:#eef0f3;border-radius:4px;padding:0 5px;margin-left:4px}

  .hist-meta{display:flex;gap:20px;flex-wrap:wrap;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px}
  .hist-meta .m{display:flex;flex-direction:column;gap:2px}
  .hist-meta .m .l{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  .hist-meta .m .v{font-size:13px;font-weight:600}
  .timeline{position:relative;padding-left:22px}
  .timeline:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 16px 6px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item .dot{position:absolute;left:-22px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--brand)}
  .tl-item.old .dot{border-color:#c3c8d0}
  .tl-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}

<body>

<div class="topbar">
  <button class="menu-toggle" id="menuToggle" title="Menu"><svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>

  <div class="spacer"></div>

  <button class="tbtn" id="btnAbout" title="App information"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg></button>

<div class="drawer-backdrop" id="drawerBackdrop"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="row">
        <div class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg><input id="searchInput" placeholder="Search worktypes, orgs, queues…" /></div>
        <button class="addfn" id="btnAddFunction" title="Add Function"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="overlay" id="entityOverlay"><div class="modal"><div class="modal-head"><h3 id="entityTitle">Add</h3><button class="x" data-close="entity"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="modal-body" id="entityBody"></div><div class="modal-foot"><button class="btn" data-close="entity">Cancel</button><button class="btn primary" id="entitySave">Save</button></div></div></div>

<div id="datalists"></div>

<script>
const LS_KEY="verint_mapping_manager_v3";
const IDB_NAME="VerintMappingDB", IDB_STORE="state";
const DIR_CATS=[{key:"businessArea",label:"Business Area"},{key:"worktype",label:"Worktype"},{key:"status",label:"Status"},{key:"organization",label:"Organization Name"},{key:"manualQueue",label:"Manual Verint Queue"},{key:"source",label:"Source Name"}];
const DIR_KEYS=DIR_CATS.map(c=>c.key);

let state={functions:[],directories:{}};
let selection={worktypeId:null};
let searchTerm="";
let viewMode="detail";
let listFilters={text:"",type:"",validated:"",active:""};
let listSort={key:"function",dir:"asc"};
let sidebarSort={key:"custom",dir:"asc",type:"",validated:""};
let detailFilter={text:"",validated:"",org:"",active:""};
let detailSort={key:"",dir:"asc"};
let editingMapId=null;
let selectedIds=new Set();
const expanded=new Set();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* persistence */
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSave(d){try{const db=await idbOpen();db.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).put(d,"current");}catch(e){}}
async function idbLoad(){try{const db=await idbOpen();return await new Promise(res=>{const g=db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get("current");g.onsuccess=()=>res(g.result||null);g.onerror=()=>res(null);});}catch(e){return null;}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}idbSave(state);}
async function load(){let d=null;try{const raw=localStorage.getItem(LS_KEY);if(raw)d=JSON.parse(raw);}catch(e){}if(!d)d=await idbLoad();if(d&&d.functions)state=d;ensureDirectories();}
function ensureDirectories(){if(!state.directories||typeof state.directories!=="object")state.directories={};DIR_KEYS.forEach(k=>{if(!Array.isArray(state.directories[k]))state.directories[k]=[];});migrateActive();}
function migrateActive(){allWorktypes().forEach(({wt})=>(wt.mappings||[]).forEach(m=>{if(m.active===undefined){m.active=true;const t=m.createdAt||nowISO();if(!m.activeSince)m.activeSince=t;if(!m.statusChangedAt)m.statusChangedAt=t;}}));}

/* traversal */
function allWorktypes(){const o=[];state.functions.forEach(fn=>(fn.subFunctions||[]).forEach(sf=>(sf.worktypes||[]).forEach(wt=>o.push({fn,sf,wt}))));return o;}
function findWorktype(id){for(const fn of state.functions)for(const sf of(fn.subFunctions||[]))for(const wt of(sf.worktypes||[]))if(wt.id===id)return{fn,sf,wt};return null;}
function orgCount(wt){const s=new Set();(wt.mappings||[]).forEach(m=>(m.organizations||[]).forEach(o=>s.add(o.toLowerCase())));return s.size;}

/* sort helpers */
function cmp(a,b){if(a==null)a="";if(b==null)b="";if(typeof a==="number"&&typeof b==="number")return a-b;const na=parseFloat(a),nb=parseFloat(b);if(!isNaN(na)&&!isNaN(nb)&&String(a).trim()!==""&&String(b).trim()!==""&&/^[\d.\-]+$/.test(String(a))&&/^[\d.\-]+$/.test(String(b)))return na-nb;return String(a).toLowerCase().localeCompare(String(b).toLowerCase());}
function sortBy(arr,keyFn,dir){const s=[...arr].sort((x,y)=>cmp(keyFn(x),keyFn(y)));if(dir==="desc")s.reverse();return s;}
function mapSortVal(m,wt,key){switch(key){case"businessArea":return m.businessArea||"";case"worktype":return m.worktype||"";case"status":return m.status||"";case"manualQueue":return m.manualQueue||"";case"key":return awdManualKey(wt.type,m);case"organizations":return(m.organizations||[]).join(", ");case"source":return m.source||"";case"remarks":return m.remarks||"";case"validated":return m.validated?1:0;case"active":return(m.active!==false)?1:0;case"version":return m.version||1;case"modifiedAt":return m.modifiedAt||m.createdAt||"";default:return"";}}

/* suggestions */
function suggestions(kind){const set=new Set(state.directories[kind]||[]);allWorktypes().forEach(({wt})=>(wt.mappings||[]).forEach(m=>{if(kind==="businessArea"&&m.businessArea)set.add(m.businessArea);if(kind==="worktype"&&m.worktype)set.add(m.worktype);if(kind==="status"&&m.status)set.add(m.status);if(kind==="manualQueue"&&m.manualQueue)set.add(m.manualQueue);if(kind==="source"&&m.source)set.add(m.source);if(kind==="organization")(m.organizations||[]).forEach(o=>set.add(o));}));return[...set].filter(Boolean).sort((a,b)=>a.localeCompare(b));}
function pushUniq(arr,v){v=(v||"").trim();if(v&&!arr.some(x=>x.toLowerCase()===v.toLowerCase()))arr.push(v);}
function parseBulkValues(raw){const out=[];(raw||"").split(/[\r\n,;\t]+/).forEach(v=>{v=v.trim();if(v&&!out.some(x=>x.toLowerCase()===v.toLowerCase()))out.push(v);});return out;}
/* split a Verint Queue key BUSINESSAREA_WORKTYPE_STATUS into its 3 parts.
   Heuristic: first segment = Business Area, last = Status, everything in between = Worktype
   (so worktypes containing "_" are preserved). Returns null if fewer than 3 segments. */
function parseQueueKeys(raw){const out=[];(raw||"").split(/[\r\n,;\t]+/).forEach(v=>{v=v.trim();if(v)out.push(v);});return out;}
function splitQueueKey(key){const parts=(key||"").split("_").map(p=>p.trim()).filter(p=>p!=="");if(parts.length<3)return null;return{businessArea:parts[0],worktype:parts.slice(1,-1).join("_"),status:parts[parts.length-1]};}
function learn(rec){const d=state.directories;pushUniq(d.businessArea,rec.businessArea);pushUniq(d.worktype,rec.worktype);pushUniq(d.status,rec.status);pushUniq(d.manualQueue,rec.manualQueue);pushUniq(d.source,rec.source);(rec.organizations||[]).forEach(o=>pushUniq(d.organization,o));}
function renderDatalists(){document.getElementById("datalists").innerHTML=DIR_KEYS.map(k=>`<datalist id="dl_${k}">`+suggestions(k).map(v=>`<option value="${esc(v)}"></option>`).join("")+`</datalist>`).join("");}

/* change tracking */
function nowISO(){return new Date().toISOString();}
function fmtDate(iso){if(!iso)return"—";const d=new Date(iso);if(isNaN(d))return"—";const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}
function fmtDateShort(iso){if(!iso)return"—";const d=new Date(iso);if(isNaN(d))return"—";const p=n=>String(n).padStart(2,"0");return p(d.getMonth()+1)+"/"+p(d.getDate())+"/"+String(d.getFullYear()).slice(2)+" "+p(d.getHours())+":"+p(d.getMinutes());}
function snapshotFields(m){return{manualQueue:m.manualQueue||"",businessArea:m.businessArea||"",worktype:m.worktype||"",status:m.status||"",organizations:[...(m.organizations||[])],source:m.source||"",remarks:m.remarks||""};}
function sameFields(a,b){return a.manualQueue===b.manualQueue&&a.businessArea===b.businessArea&&a.worktype===b.worktype&&a.status===b.status&&a.source===b.source&&a.remarks===b.remarks&&(a.organizations||[]).join("|").toLowerCase()===(b.organizations||[]).join("|").toLowerCase();}
function stampNew(rec){const t=nowISO();rec.createdAt=t;rec.modifiedAt=t;rec.version=1;rec.history=[];rec.active=true;rec.activeSince=t;rec.statusChangedAt=t;return rec;}
function stampEdit(m,before){if(!m.createdAt)m.createdAt=nowISO();const after=snapshotFields(m);if(!sameFields(before,after)){m.history=m.history||[];m.history.push({version:m.version||1,savedAt:m.modifiedAt||m.createdAt,fields:before});m.version=(m.version||1)+1;m.modifiedAt=nowISO();return true;}if(!m.modifiedAt)m.modifiedAt=m.createdAt;return false;}
function awdManualKey(type,m){if(type==="manual")return(m.manualQueue||"").trim();return[m.businessArea,m.worktype,m.status].map(v=>(v||"").trim()).join("_");}

/* ---------- DUPLICATE DETECTION (queue key across functions/sub-functions) ---------- */
function findKeyOccurrences(key,excludeWtId){
  const out=[];const k=(key||"").trim().toLowerCase();if(!k)return out;
  allWorktypes().forEach(({fn,sf,wt})=>{
    (wt.mappings||[]).forEach(m=>{
      if(awdManualKey(wt.type,m).trim().toLowerCase()===k){
        out.push({fn,sf,wt,m,current:wt.id===excludeWtId});
      }
    });
  });
  return out;
}

/* TREE */
function renderTree(){
  const tree=document.getElementById("tree"),stats=document.getElementById("sideStats");
  const wts=allWorktypes();const totalMaps=wts.reduce((a,x)=>a+(x.wt.mappings?.length||0),0);
  stats.innerHTML=`<span class="chip">${state.functions.length} Functions</span><span class="chip">${wts.length} Worktypes</span><span class="chip">${totalMaps} Mappings</span>`;
  if(state.functions.length===0){tree.innerHTML=`<div style="padding:24px 12px;color:var(--muted);text-align:center;line-height:1.6">${svg(IC.folder)}<div style="margin-top:8px">No functions yet.</div><div style="font-size:12px">Click the <b>+</b> button to add your first Function.</div></div>`;return;}
  const q=searchTerm.trim().toLowerCase();const F=sidebarSort;const hasFilter=!!q||F.type||F.validated;
  const wtValState=(wt)=>{const ms=wt.mappings||[];if(ms.length===0)return"none";const v=ms.filter(m=>m.validated).length;if(v===0)return"none";if(v===ms.length)return"full";return"partial";};
  const match=(wt)=>{if(F.type&&wt.type!==F.type)return false;if(F.validated&&wtValState(wt)!==F.validated)return false;if(!q)return true;if(wt.name.toLowerCase().includes(q))return true;return(wt.mappings||[]).some(m=>[m.manualQueue,m.businessArea,m.worktype,m.status,m.source,m.remarks,(m.organizations||[]).join(" ")].filter(Boolean).some(v=>v.toLowerCase().includes(q)));};
  const sortWts=(list)=>{if(F.key==="custom")return list;const keyFn=(wt)=>F.key==="name"?wt.name||"":F.key==="type"?wt.type||"":F.key==="mappings"?(wt.mappings||[]).length:F.key==="validated"?(wt.mappings||[]).filter(m=>m.validated).length:wt.name||"";return sortBy(list,keyFn,F.dir);};
  let html="";
  state.functions.forEach(fn=>{
    const fnOpen=expanded.has(fn.id)||hasFilter;const subs=fn.subFunctions||[];
    const visSubs=subs.map(sf=>({sf,wtsV:sortWts((sf.worktypes||[]).filter(match))})).filter(x=>!hasFilter||x.wtsV.length);
    if(hasFilter&&visSubs.length===0)return;
    html+=`<div class="node"><div class="label" data-toggle="${fn.id}">${svg(IC.caret,'caret '+(fnOpen?'open':''))}${svg(IC.folder)}<span class="name fn-name">${esc(fn.name)}</span><span class="cnt">${subs.length}</span><span class="rowactions"><button class="minibtn" title="Add sub-function" data-act="addsf" data-fn="${fn.id}">${svg(IC.plus)}</button><button class="minibtn" title="Rename" data-act="editfn" data-fn="${fn.id}">${svg(IC.edit)}</button><button class="minibtn del" title="Delete" data-act="delfn" data-fn="${fn.id}">${svg(IC.del)}</button></span></div>`;
    if(fnOpen){html+=`<div class="children">`;
      (hasFilter?visSubs.map(x=>x.sf):subs).forEach(sf=>{
        const sfOpen=expanded.has(sf.id)||hasFilter;const wtsAll=sf.worktypes||[];const wtsV=sortWts(hasFilter?wtsAll.filter(match):wtsAll);
        html+=`<div class="node"><div class="label" data-toggle="${sf.id}">${svg(IC.caret,'caret '+(sfOpen?'open':''))}${svg(IC.layers)}<span class="name sf-name">${esc(sf.name)}</span><span class="cnt">${wtsAll.length}</span><span class="rowactions"><button class="minibtn" title="Add worktype" data-act="addwt" data-sf="${sf.id}">${svg(IC.plus)}</button><button class="minibtn" title="Rename" data-act="editsf" data-sf="${sf.id}">${svg(IC.edit)}</button><button class="minibtn del" title="Delete" data-act="delsf" data-sf="${sf.id}">${svg(IC.del)}</button></span></div>`;
        if(sfOpen){html+=`<div class="children">`;
          wtsV.forEach(wt=>{const active=selection.worktypeId===wt.id?'active':'';html+=`<div class="node"><div class="label ${active}" data-select="${wt.id}"><span class="caret hidden"></span>${svg(IC.doc)}<span class="name">${esc(wt.name)}</span><span class="tag ${wt.type}">${wt.type}</span><span class="rowactions"><button class="minibtn" title="Edit" data-act="editwt" data-wt="${wt.id}">${svg(IC.edit)}</button><button class="minibtn del" title="Delete" data-act="delwt" data-wt="${wt.id}">${svg(IC.del)}</button></span></div></div>`;});
          if(!hasFilter)html+=`<div class="addline" data-act="addwt" data-sf="${sf.id}">${svg(IC.plus)} Add worktype</div>`;
          html+=`</div>`;}
        html+=`</div>`;});
      if(!hasFilter)html+=`<div class="addline" data-act="addsf" data-fn="${fn.id}">${svg(IC.plus)} Add sub-function</div>`;
      html+=`</div>`;}
    html+=`</div>`;
  });
  if(hasFilter&&html==="")html=`<div style="padding:24px 12px;color:var(--muted);text-align:center;line-height:1.6">${svg(IC.list)}<div style="margin-top:8px">No worktypes match the current filters.</div></div>`;
  tree.innerHTML=html;
}

/* MAIN DETAIL */

  const ctx=selection.worktypeId?findWorktype(selection.worktypeId):null;
  if(!ctx){main.innerHTML=`<div class="empty">${svg(IC.db)}<h3>Select a Dashboard Worktype</h3><p>Choose a worktype from the left to view and manage its mapping combinations, or create a new Function to get started.</p><button class="btn primary" onclick="openEntity('function')">${svg(IC.plus)} New Function</button></div>`;return;}

  const valCount=maps.filter(m=>m.validated).length;const activeCount=maps.filter(m=>m.active!==false).length;
  const cards=`<div class="cards"><div class="card"><div class="k">Type</div><div class="v" style="text-transform:uppercase;color:${isManual?'var(--manual)':'var(--awd)'}">${wt.type}</div></div><div class="card"><div class="k">Mapping rows</div><div class="v">${maps.length}</div></div><div class="card"><div class="k">Active</div><div class="v" style="color:${activeCount===maps.length&&maps.length?'var(--manual)':'var(--ink)'}">${activeCount}<span style="font-size:14px;color:var(--muted);font-weight:500">/${maps.length}</span></div></div><div class="card"><div class="k">Validated</div><div class="v" style="color:${valCount===maps.length&&maps.length?'var(--manual)':'var(--ink)'}">${valCount}<span style="font-size:14px;color:var(--muted);font-weight:500">/${maps.length}</span></div></div></div>`;

  const df=detailFilter;let vmaps=[...maps];const dq=(df.text||"").trim().toLowerCase();
  if(dq)vmaps=vmaps.filter(m=>[m.manualQueue,m.businessArea,m.worktype,m.status,m.source,m.remarks,(m.organizations||[]).join(" "),awdManualKey(wt.type,m)].filter(Boolean).some(v=>v.toLowerCase().includes(dq)));
  if(df.validated==="yes")vmaps=vmaps.filter(m=>m.validated);
  if(df.validated==="no")vmaps=vmaps.filter(m=>!m.validated);
  if(df.active==="active")vmaps=vmaps.filter(m=>m.active!==false);
  if(df.active==="inactive")vmaps=vmaps.filter(m=>m.active===false);
  if(df.org)vmaps=vmaps.filter(m=>(m.organizations||[]).some(o=>o.toLowerCase()===df.org.toLowerCase()));
  if(detailSort.key)vmaps=sortBy(vmaps,m=>mapSortVal(m,wt,detailSort.key),detailSort.dir);
  const orgOpts=[...new Set(maps.flatMap(m=>m.organizations||[]))].sort((a,b)=>a.localeCompare(b));
  const anyFilter=dq||df.validated||df.org||df.active||detailSort.key;
  const bar=`<div class="section-bar"><h2>Mapping combinations</h2><div class="spacer"></div><span class="chip">${isManual?'Manual · Queue mapping':'AWD · Business Area / Worktype / Status'}</span></div>
    <div class="list-filters"><div class="search" style="max-width:260px"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg><input id="dfSearch" placeholder="Filter mappings…" value="${esc(df.text)}"></div><select class="select lv-select" id="dfActive"><option value="">All statuses</option><option value="active" ${df.active==='active'?'selected':''}>Active</option><option value="inactive" ${df.active==='inactive'?'selected':''}>Inactive</option></select><select class="select lv-select" id="dfVal"><option value="">All validation</option><option value="yes" ${df.validated==='yes'?'selected':''}>Validated</option><option value="no" ${df.validated==='no'?'selected':''}>Not validated</option></select><select class="select lv-select" id="dfOrg"><option value="">All organizations</option>${orgOpts.map(o=>`<option value="${esc(o)}" ${df.org===o?'selected':''}>${esc(o)}</option>`).join("")}</select>${anyFilter?`<button class="btn small" id="dfClear">${svg(IC.x)} Clear</button>`:''}<span class="chip" style="margin-left:auto">${vmaps.length} of ${maps.length} shown</span></div>`;

  selectedIds.forEach(id=>{if(!maps.some(m=>m.id===id))selectedIds.delete(id);});

  let thead;

  else thead=`<tr>${selCb}${sh('Business Area','businessArea')}${sh('Worktype','worktype')}${sh('Status','status')}${sh('Organization(s) counted','organizations')}${sh('Source','source')}${sh('Remarks','remarks')}${sh('Active / Inactive','active')}${sh('Validated','validated')}${sh('Updated','modifiedAt')}<th style="width:104px"></th></tr>`;

  const dorg=document.getElementById("dfOrg");if(dorg)dorg.onchange=()=>{detailFilter.org=dorg.value;renderMain();};

  const selAll=document.getElementById("selAll");if(selAll)selAll.onchange=()=>{if(selAll.checked)vmaps.forEach(m=>selectedIds.add(m.id));else vmaps.forEach(m=>selectedIds.delete(m.id));renderMain();};
  document.querySelectorAll("[data-rowsel]").forEach(cb=>cb.onchange=()=>{const id=cb.dataset.rowsel;cb.checked?selectedIds.add(id):selectedIds.delete(id);renderMain();});
  document.querySelectorAll("[data-bulk]").forEach(b=>b.onclick=()=>bulkAction(wt.id,b.dataset.bulk));
  if(editingMapId)document.querySelector("tr.editing .inline-input")?.focus();

function sh(label,key){const active=detailSort.key===key;const arrow=active?(detailSort.dir==="asc"?' ▲':' ▼'):'';return `<th data-sort="${key}" class="th-sort ${active?'active':''}">${label}<span class="tha">${arrow}</span></th>`;}

function dupBadge(wt,m){
  const others=findKeyOccurrences(awdManualKey(wt.type,m),wt.id).filter(o=>!o.current);
  if(others.length===0)return "";
  const locs=others.map(o=>`${o.fn.name} › ${o.sf.name} › ${o.wt.name}`).join("\n");
  return `<span class="dupflag" title="Also found in:\n${esc(locs)}" onclick="event.stopPropagation();openDupInfo('${wt.id}','${m.id}')">${svg(IC.warn)} Dup</span>`;
}

function rowView(wt,m,isManual){
  const histCount=(m.history||[]).length;
  const histBtn=histCount?`<button class="minibtn" title="Version history (${histCount})" onclick="openHistory('${wt.id}','${m.id}')" style="position:relative">${svg(IC.clock)}<span class="ver-dot">${histCount}</span></button>`:`<button class="minibtn" title="Version history" onclick="openHistory('${wt.id}','${m.id}')">${svg(IC.clock)}</button>`;
  const acts=`<div class="cellactions">${histBtn}<button class="minibtn" title="Edit inline" onclick="startInlineEdit('${m.id}')">${svg(IC.edit)}</button><button class="minibtn del" title="Delete" onclick="deleteMapping('${wt.id}','${m.id}')">${svg(IC.del)}</button></div>`;
  const updated=`<div class="upd"><span class="ver-badge">v${m.version||1}</span><span class="upd-date" title="Created: ${fmtDate(m.createdAt)}\nModified: ${fmtDate(m.modifiedAt)}">${fmtDateShort(m.modifiedAt||m.createdAt)}</span></div>`;
  const validated=validatedCell(wt,m);const activeC=activeCell(wt,m);
  const sel=selectedIds.has(m.id);
  const cb=`<td><label class="rowcb ${sel?'on':''}"><input type="checkbox" data-rowsel="${m.id}" ${sel?'checked':''}><span class="cbbox">${sel?svg(IC.check):''}</span></label></td>`;
  const trcls=sel?' class="row-selected"':'';
  const dup=dupBadge(wt,m);
  if(isManual)return `<tr${trcls}>${cb}<td><b>${esc(m.manualQueue)||'<span class="muted">—</span>'}</b>${dup}</td><td>${orgPills(m.organizations)}</td><td>${esc(m.source)||'<span class="muted">—</span>'}</td><td class="muted">${esc(m.remarks)||'—'}</td><td>${activeC}</td><td>${validated}</td><td>${updated}</td><td>${acts}</td></tr>`;
  return `<tr${trcls}>${cb}<td><b>${esc(m.businessArea)||'<span class="muted">—</span>'}</b>${dup}</td><td>${esc(m.worktype)||'<span class="muted">—</span>'}</td><td>${esc(m.status)||'<span class="muted">—</span>'}</td><td>${orgPills(m.organizations)}</td><td>${esc(m.source)||'<span class="muted">—</span>'}</td><td class="muted">${esc(m.remarks)||'—'}</td><td>${activeC}</td><td>${validated}</td><td>${updated}</td><td>${acts}</td></tr>`;
}
function validatedCell(wt,m){const on=!!m.validated;return `<label class="vchk ${on?'on':''}" title="${on?('Validated on '+fmtDate(m.validatedAt)):'Mark as validated'}"><input type="checkbox" ${on?'checked':''} onchange="toggleValidated('${wt.id}','${m.id}',this.checked)"><span class="box">${on?svg(IC.check):''}</span><span class="vtxt">${on?fmtDateShort(m.validatedAt):'<span class="muted">Not validated</span>'}</span></label>`;}
function activeCell(wt,m){const active=(m.active!==false);const since=m.statusChangedAt||m.activeSince||m.createdAt;const tip=active?('Active since '+fmtDate(since)):('Inactive since '+fmtDate(since));return `<button class="statustog ${active?'on':'off'}" title="${tip} · click to toggle" onclick="toggleActive('${wt.id}','${m.id}')"><span class="dot"></span><span class="st-lbl">${active?'Active':'Inactive'}</span><span class="st-date">${fmtDateShort(since)}</span></button>`;}
function rowEdit(wt,m,isManual){
  const acts=`<div class="cellactions"><button class="minibtn ok" title="Save" onclick="saveInlineEdit('${wt.id}','${m.id}')">${svg(IC.check)}</button><button class="minibtn" title="Cancel" onclick="cancelInlineEdit()">${svg(IC.x)}</button></div>`;
  const orgVal=(m.organizations||[]).join(", ");
  if(isManual)return `<tr class="editing"><td></td><td><input class="inline-input" id="ie_manualQueue" list="dl_manualQueue" value="${esc(m.manualQueue)}" placeholder="Queue name"></td><td><input class="inline-input" id="ie_orgs" list="dl_organization" value="${esc(orgVal)}" placeholder="Org1, Org2"></td><td><input class="inline-input" id="ie_source" list="dl_source" value="${esc(m.source)}" placeholder="Source"></td><td><input class="inline-input" id="ie_remarks" value="${esc(m.remarks)}" placeholder="Remarks"></td><td>${activeCell(wt,m)}</td><td>${validatedCell(wt,m)}</td><td><span class="ver-badge">v${m.version||1}</span></td><td>${acts}</td></tr>`;
  return `<tr class="editing"><td></td><td><input class="inline-input" id="ie_businessArea" list="dl_businessArea" value="${esc(m.businessArea)}" placeholder="Business Area"></td><td><input class="inline-input" id="ie_worktype" list="dl_worktype" value="${esc(m.worktype)}" placeholder="Worktype"></td><td><input class="inline-input" id="ie_status" list="dl_status" value="${esc(m.status)}" placeholder="Status"></td><td><input class="inline-input" id="ie_orgs" list="dl_organization" value="${esc(orgVal)}" placeholder="Org1, Org2"></td><td><input class="inline-input" id="ie_source" list="dl_source" value="${esc(m.source)}" placeholder="Source"></td><td><input class="inline-input" id="ie_remarks" value="${esc(m.remarks)}" placeholder="Remarks"></td><td>${activeCell(wt,m)}</td><td>${validatedCell(wt,m)}</td><td><span class="ver-badge">v${m.version||1}</span></td><td>${acts}</td></tr>`;
}
function orgPills(orgs){if(!orgs||!orgs.length)return'<span class="muted">—</span>';return orgs.map(o=>`<span class="org-pill">${esc(o)}</span>`).join(" ");}

/* bulk bar */
function bulkBar(){
  const n=selectedIds.size;if(n===0)return "";
  return `<div class="bulkbar"><span class="bb-count">${svg(IC.check)} ${n} selected</span><span class="bb-sep"></span><button class="bb-act" data-bulk="active">${svg(IC.check)} Set Active</button><button class="bb-act" data-bulk="inactive">${svg(IC.x)} Set Inactive</button><button class="bb-act" data-bulk="validate">${svg(IC.check)} Validate</button><button class="bb-act" data-bulk="unvalidate">${svg(IC.x)} Unvalidate</button><button class="bb-act" data-bulk="export">${svg(IC.doc)} Export</button><button class="bb-act danger" data-bulk="delete">${svg(IC.del)} Delete</button><span class="bb-sep"></span><button class="bb-clear" data-bulk="clear">Clear selection</button></div>`;
}
function bulkAction(wtId,action){
  const ctx=findWorktype(wtId);if(!ctx)return;const targets=(ctx.wt.mappings||[]).filter(m=>selectedIds.has(m.id));const n=targets.length;const t=nowISO();
  if(action==="clear"){selectedIds.clear();renderMain();return;}
  if(n===0)return;
  if(action==="active"){let c=0;targets.forEach(m=>{if(m.active===false){m.active=true;m.statusChangedAt=t;m.activeSince=t;c++;}});renderAll();toast(`${c} set Active`);return;}
  if(action==="inactive"){let c=0;targets.forEach(m=>{if(m.active!==false){m.active=false;m.statusChangedAt=t;m.inactiveSince=t;c++;}});renderAll();toast(`${c} set Inactive`);return;}
  if(action==="validate"){let c=0;targets.forEach(m=>{if(!m.validated){m.validated=true;m.validatedAt=t;c++;}});renderAll();toast(`${c} validated`);return;}
  if(action==="unvalidate"){let c=0;targets.forEach(m=>{if(m.validated){m.validated=false;m.validatedAt=null;c++;}});renderAll();toast(`${c} unvalidated`);return;}
  if(action==="export"){bulkExportCsv(ctx,targets);toast(`${n} row${n>1?'s':''} exported`);return;}
  if(action==="delete"){if(!confirm(`Delete ${n} selected mapping${n>1?'s':''}? This cannot be undone.`))return;ctx.wt.mappings=ctx.wt.mappings.filter(m=>!selectedIds.has(m.id));selectedIds.clear();editingMapId=null;renderAll();toast(`${n} deleted`);return;}
}
function bulkExportCsv(ctx,targets){const {fn,sf,wt}=ctx;const head=["Function","Sub-Function","Dashboard Worktype","Type","AWD & Manual Verint Queue","Manual Verint Queue","Business Area","Worktype","Status","Organization","Source","Remarks","Active Status","Status Changed Date","Validated","Validation Date","Version","Created Date","Modified Date"];const rows=[head];targets.forEach(m=>{const key=awdManualKey(wt.type,m);const isActive=(m.active!==false);const stChg=m.statusChangedAt||m.activeSince||m.createdAt;const orgs=(m.organizations||[]);const list=orgs.length?orgs:[""];list.forEach(org=>rows.push([fn.name,sf.name,wt.name,wt.type,key,m.manualQueue||"",m.businessArea||"",m.worktype||"",m.status||"",org,m.source||"",m.remarks||"",isActive?"Active":"Inactive",fmtDate(stChg),m.validated?"Yes":"No",m.validated?fmtDate(m.validatedAt):"","v"+(m.version||1),fmtDate(m.createdAt),fmtDate(m.modifiedAt||m.createdAt)]));});download("verint-selected-"+stamp()+".csv",rows.map(r=>r.map(csvCell).join(",")).join("\r\n"),"text/csv");}

/* inline edit */
function startInlineEdit(mId){editingMapId=mId;renderMain();}
function cancelInlineEdit(){editingMapId=null;renderMain();}
function parseOrgs(str){const out=[];(str||"").split(",").forEach(v=>{v=v.trim();if(v&&!out.some(o=>o.toLowerCase()===v.toLowerCase()))out.push(v);});return out;}
function val(id){return(document.getElementById(id)?.value||"").trim();}
function saveInlineEdit(wtId,mId){
  const ctx=findWorktype(wtId);if(!ctx)return;const isManual=ctx.wt.type==="manual";const m=ctx.wt.mappings.find(x=>x.id===mId);if(!m)return;const before=snapshotFields(m);
  const orgs=parseOrgs(document.getElementById("ie_orgs").value);if(orgs.length===0){toast("Add at least one Organization","warn");return;}
  if(isManual){const q=val("ie_manualQueue");if(!q){toast("Manual Verint Queue is required","warn");return;}m.manualQueue=q;}
  else{const ba=val("ie_businessArea"),w=val("ie_worktype"),s=val("ie_status");if(!ba||!w||!s){toast("Business Area, Worktype and Status are required","warn");return;}m.businessArea=ba;m.worktype=w;m.status=s;}
  m.organizations=orgs;m.source=val("ie_source");m.remarks=val("ie_remarks");
  const changed=stampEdit(m,before);learn(m);editingMapId=null;renderAll();toast(changed?"Row updated (v"+m.version+")":"No changes");
}

/* MAPPING MODAL (multi-select + duplicate check) */
let mapCtx=null;
let pendingSave=null;
function openMapping(wtId,mId){
  const ctx=findWorktype(wtId);if(!ctx)return;const isManual=ctx.wt.type==="manual";
  const m=mId?(ctx.wt.mappings||[]).find(x=>x.id===mId):null;
  mapCtx={wtId,mId,tokens:{businessArea:[],worktype:[],status:[],organizations:[]}};
  if(m){mapCtx.tokens.organizations=[...(m.organizations||[])];if(!isManual){mapCtx.tokens.businessArea=m.businessArea?[m.businessArea]:[];mapCtx.tokens.worktype=m.worktype?[m.worktype]:[];mapCtx.tokens.status=m.status?[m.status]:[];}}
  document.getElementById("mapTitle").textContent=(mId?"Edit":"Add")+" Mapping · "+ctx.wt.type.toUpperCase();
  let fields;
  if(isManual)fields=`<div class="field"><label>Manual Verint Queue <span class="req">*</span><span class="hint">start typing for suggestions</span></label><input class="input" id="fQueue" list="dl_manualQueue" value="${esc(m?.manualQueue||'')}" placeholder="e.g. QUEUE_NB_MANUAL_01" oninput="updateComboNote()"></div>`;
  else fields=`${tokenField("Business Area","businessArea","dl_businessArea","e.g. AGLIFECS")}${tokenField("Worktype","worktype","dl_worktype","e.g. BILLINGMNGT, BILLERR, PAYMENTSS")}${tokenField("Status","status","dl_status","e.g. Completed")}`;
  const orgField=tokenField("Organization Name","organizations","dl_organization","e.g. Inforce, Inforce Phase 2",true);
  const meta=`<div class="grid2"><div class="field"><label>Source Name</label><input class="input" id="fSource" list="dl_source" value="${esc(m?.source||'')}" placeholder="e.g. Verint, AWD Export, SQF"></div><div class="field"><label>Remarks</label><input class="input" id="fRemarks" value="${esc(m?.remarks||'')}" placeholder="Optional notes"></div></div>`;
  document.getElementById("mapBody").innerHTML=fields+orgField+meta;
  showOverlay("map");
  ["businessArea","worktype","status","organizations"].forEach(f=>{if(document.getElementById("tokBox_"+f)){renderTokens(f);setupTokenInput(f);}});
  updateComboNote();
  setTimeout(()=>document.getElementById(isManual?"fQueue":"tokInput_businessArea")?.focus(),30);
}
function tokenField(label,field,dl,ph,isOrg){return `<div class="field"><label>${label} <span class="req">*</span><span class="hint">add one or more — Enter or comma${isOrg?'; each org becomes its own row':''}</span></label><div class="tokbox" id="tokBox_${field}"><input id="tokInput_${field}" list="${dl}" placeholder="${esc(ph)}"></div></div>`;}
function setupTokenInput(field){const input=document.getElementById("tokInput_"+field);input.onkeydown=(e)=>{if(e.key==="Enter"||e.key===","){e.preventDefault();addToken(field,input.value);input.value="";}else if(e.key==="Backspace"&&!input.value&&mapCtx.tokens[field].length){mapCtx.tokens[field].pop();renderTokens(field);updateComboNote();}};input.onchange=()=>{if(input.value.trim()){addToken(field,input.value);input.value="";}};input.onblur=()=>{if(input.value.trim()){addToken(field,input.value);input.value="";}};}
function addToken(field,v){v=v.trim();if(!v)return;if(!mapCtx.tokens[field].some(o=>o.toLowerCase()===v.toLowerCase()))mapCtx.tokens[field].push(v);renderTokens(field);updateComboNote();}
function renderTokens(field){const box=document.getElementById("tokBox_"+field),input=document.getElementById("tokInput_"+field);box.querySelectorAll(".token").forEach(t=>t.remove());mapCtx.tokens[field].forEach((o,i)=>{const t=document.createElement("span");t.className="token"+(field==="organizations"?" org":"");t.innerHTML=`${esc(o)} <button title="Remove">${svg(IC.x)}</button>`;t.querySelector("button").onclick=()=>{mapCtx.tokens[field].splice(i,1);renderTokens(field);updateComboNote();};box.insertBefore(t,input);});}
function pendingCount(){const ctx=findWorktype(mapCtx.wtId);const isManual=ctx.wt.type==="manual";const t=mapCtx.tokens;const orgs=t.organizations.length||0;if(isManual)return orgs;return(t.businessArea.length||0)*(t.worktype.length||0)*(t.status.length||0)*orgs;}
function updateComboNote(){const n=pendingCount();const note=document.getElementById("comboNote");if(!note)return;note.innerHTML=n>0?`This will create <b>${n}</b> mapping row${n>1?'s':''}`:`<span style="color:var(--muted)">Add values to generate rows</span>`;}

document.getElementById("mapSave").onclick=()=>{
  const ctx=findWorktype(mapCtx.wtId);if(!ctx)return;const isManual=ctx.wt.type==="manual";const t=mapCtx.tokens;
  ["businessArea","worktype","status","organizations"].forEach(f=>{const inp=document.getElementById("tokInput_"+f);if(inp&&inp.value.trim()){addToken(f,inp.value);inp.value="";}});
  const source=val("fSource"),remarks=val("fRemarks");
  let combos=[];
  if(isManual){const q=val("fQueue");if(!q){toast("Manual Verint Queue is required","warn");return;}if(t.organizations.length===0){toast("Add at least one Organization","warn");return;}t.organizations.forEach(org=>combos.push({manualQueue:q,organizations:[org]}));}
  else{if(t.businessArea.length===0||t.worktype.length===0||t.status.length===0){toast("Add Business Area, Worktype and Status","warn");return;}if(t.organizations.length===0){toast("Add at least one Organization","warn");return;}t.businessArea.forEach(ba=>t.worktype.forEach(w=>t.status.forEach(s=>t.organizations.forEach(org=>combos.push({businessArea:ba,worktype:w,status:s,organizations:[org]})))));}
  combos.forEach(c=>{c.source=source;c.remarks=remarks;});
  // DUPLICATE CHECK on queue keys (across all functions/sub-functions)
  const keys=[...new Set(combos.map(c=>awdManualKey(ctx.wt.type,c).toLowerCase()))];
  const dupFindings=[];
  keys.forEach(k=>{const occ=findKeyOccurrences(k,ctx.wt.id);if(occ.length>0)dupFindings.push({key:k,occ});});
  if(dupFindings.length>0){pendingSave={ctx,isManual,combos};openDupWarning(ctx,dupFindings);return;}
  commitMappingSave(ctx,isManual,combos);
};
function commitMappingSave(ctx,isManual,combos){
  if(!ctx.wt.mappings)ctx.wt.mappings=[];
  const keyOf=(c)=>(isManual?`M|${c.manualQueue}`:`A|${c.businessArea}|${c.worktype}|${c.status}`)+`|${(c.organizations||[]).join(",")}`.toLowerCase();
  const existingKeys=new Set(ctx.wt.mappings.filter(x=>x.id!==mapCtx.mId).map(x=>keyOf(x)));
  let added=0,updated=0,skipped=0;
  if(mapCtx.mId){
    const idx=ctx.wt.mappings.findIndex(x=>x.id===mapCtx.mId);const rec=ctx.wt.mappings[idx];const before=snapshotFields(rec);const first=combos[0];
    Object.assign(rec,{manualQueue:first.manualQueue||"",businessArea:first.businessArea||"",worktype:first.worktype||"",status:first.status||"",organizations:first.organizations,source:first.source,remarks:first.remarks});
    stampEdit(rec,before);learn(rec);updated++;existingKeys.add(keyOf(rec));
    for(let i=1;i<combos.length;i++){const c=combos[i];if(existingKeys.has(keyOf(c))){skipped++;continue;}const nrec=stampNew({id:uid(),...c});ctx.wt.mappings.push(nrec);learn(nrec);existingKeys.add(keyOf(c));added++;}
  }else{combos.forEach(c=>{if(existingKeys.has(keyOf(c))){skipped++;return;}const nrec=stampNew({id:uid(),...c});ctx.wt.mappings.push(nrec);learn(nrec);existingKeys.add(keyOf(c));added++;});}
  closeOverlay("map");renderAll();
  const parts=[];if(added)parts.push(`${added} added`);if(updated)parts.push(`${updated} updated`);if(skipped)parts.push(`${skipped} duplicate${skipped>1?'s':''} skipped`);
  toast(parts.join(", ")||"No changes");
}
/* duplicate warning modal (on save) */
function openDupWarning(ctx,findings){
  const total=findings.reduce((a,f)=>a+f.occ.length,0);
  let html=`<div class="dup-head"><div class="dup-ic">${svg(IC.warn)}</div><div class="dup-lead"><b>Possible duplicate queue${findings.length>1?'s':''} detected.</b><br>The following queue key${findings.length>1?'s were':' was'} already found in <b>${total}</b> existing location${total>1?'s':''}. Review below, then choose to add anyway or cancel.</div></div>`;
  findings.forEach(f=>{
    const inCur=f.occ.some(o=>o.current);
    html+=`<div class="dup-group"><div class="dup-gh"><code class="keycode">${esc(f.key.toUpperCase())}</code>${inCur?'<span class="cur-badge">also in current</span>':'<span class="other-badge">other location</span>'}<span class="gcount">${f.occ.length} match${f.occ.length>1?'es':''}</span></div>`;
    f.occ.forEach(o=>{const orgs=(o.m.organizations||[]).join(", ");html+=`<div class="dup-loc"><div class="path">${svg(IC.folder,'sepi')}<b>${esc(o.fn.name)}</b>${svg(IC.caret,'sepi')}<b>${esc(o.sf.name)}</b>${svg(IC.caret,'sepi')}<span>${esc(o.wt.name)}</span> <span class="tag ${o.wt.type}">${o.wt.type}</span>${o.current?'<span class="cur-badge">current</span>':'<span class="other-badge">other</span>'}</div><span class="orgs">${esc(orgs)||'—'}</span></div>`;});
    html+=`</div>`;
  });
  document.getElementById("dupBody").innerHTML=html;showOverlay("dup");
}
document.getElementById("dupProceed").onclick=()=>{if(!pendingSave)return;const {ctx,isManual,combos}=pendingSave;pendingSave=null;closeOverlay("dup");commitMappingSave(ctx,isManual,combos);};

/* read-only duplicate info (from row badge) */

/* restore proceed button visibility whenever dup modal opens via save */
