<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verint Mapping Manager</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb;
    --brand:#2f6fed; --brand-soft:#e8f0fe; --awd:#2f6fed; --manual:#0f9d76; --danger:#e0483b; --warn:#d97706;
    --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
    --font:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .icon{width:16px;height:16px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:45}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.2px;min-width:0}
  .brand .mark{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .brand .mark svg{width:16px;height:16px;stroke:#fff}
  .brand-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .spacer{flex:1}
  .menu-toggle{display:none;width:36px;height:36px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;align-items:center;justify-content:center;flex:0 0 auto}
  .menu-toggle:hover{background:#f7f8fa}
  .menu-toggle .icon{width:18px;height:18px}
  .tbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font-size:13px;font-weight:500;flex:0 0 auto;white-space:nowrap}
  .tbtn:hover{background:#f7f8fa}
  .tbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .tbtn.primary:hover{background:#2560d8}
  .tbtn .icon{width:15px;height:15px}
  .drawer-backdrop{display:none;position:fixed;inset:56px 0 0 0;background:rgba(17,24,39,.4);z-index:38}
  .drawer-backdrop.show{display:block}
  .layout{display:flex;height:calc(100vh - 56px)}
  .sidebar{width:340px;flex:0 0 340px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .26s cubic-bezier(.4,0,.2,1)}
  .side-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  .side-head .row{display:flex;gap:8px;align-items:center}
  .search{flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
  .search input{border:0;background:transparent;outline:none;width:100%;font-size:13px;color:var(--ink)}
  .search .icon{color:var(--muted)}
  .addfn{height:34px;width:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;flex:0 0 auto}
  .addfn:hover{background:#2560d8}
  .addfn.ghost{background:var(--panel);border-color:var(--line);color:var(--muted)}
  .addfn.ghost:hover{background:#f0f2f5;color:var(--ink)}
  .side-controls{margin-top:10px;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;gap:8px}
  .sc-row{display:flex;align-items:center;gap:8px}
  .sc-row label{font-size:11px;font-weight:600;color:var(--muted);width:42px;flex:0 0 auto}
  .sc-sel{flex:1;height:30px;font-size:12px;padding:0 8px;min-width:0}
  .sc-dir{width:30px;height:30px;flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--brand)}
  .sc-dir:hover{background:#f0f2f5}
  .sc-dir .icon{width:14px;height:14px}
  .sc-clear{border:0;background:transparent;color:var(--brand);font-size:12px;font-weight:600;cursor:pointer;padding:2px;text-align:left}
  .sc-clear:hover{text-decoration:underline}
  .side-stats{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .chip{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
  .tree{overflow:auto;padding:8px;flex:1}
  .dev-info{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .dev-avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
  .dev-meta{min-width:0}
  .dev-label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  .dev-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dev-mail{font-size:11px;color:var(--brand);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .dev-mail:hover{text-decoration:underline}
  .node{user-select:none}
  .node .label{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;position:relative}
  .node .label:hover{background:#f5f6f8}
  .node .label.active{background:var(--brand-soft)}
  .caret{width:16px;height:16px;color:var(--muted);transition:transform .12s ease;flex:0 0 auto}
  .caret.open{transform:rotate(90deg)}
  .caret.hidden{visibility:hidden}
  .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .fn-name{font-weight:600}
  .sf-name{font-weight:500}
  .cnt{font-size:11px;color:var(--muted);background:#eef0f3;border-radius:10px;padding:1px 7px}
  .rowactions{display:none;gap:2px}
  .node .label:hover .rowactions{display:flex}
  .minibtn{width:24px;height:24px;border:0;background:transparent;color:var(--muted);border-radius:6px;display:flex;align-items:center;justify-content:center}
  .minibtn:hover{background:#e6e8ec;color:var(--ink)}
  .minibtn.del:hover{background:#fde7e5;color:var(--danger)}
  .minibtn.ok:hover{background:#e4f6ef;color:var(--manual)}
  .children{margin-left:14px;border-left:1px solid var(--line);padding-left:4px}
  .tag{font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:5px;text-transform:uppercase}
  .tag.awd{background:#e8f0fe;color:var(--awd)}
  .tag.manual{background:#e4f6ef;color:var(--manual)}
  .addline{display:flex;align-items:center;gap:6px;padding:5px 8px;margin:2px 0;color:var(--brand);font-size:12px;font-weight:600;border-radius:7px;cursor:pointer}
  .addline:hover{background:var(--brand-soft)}
  .main{flex:1;overflow:auto;padding:22px 26px}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center;gap:10px}
  .empty svg{width:44px;height:44px;color:#c3c8d0}
  .empty h3{margin:6px 0 0;color:var(--ink);font-weight:600}
  .empty p{margin:0;max-width:380px;line-height:1.5}
  .detail-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
  .breadcrumb{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .breadcrumb b{color:var(--ink);font-weight:600}
  .detail-head h1{margin:0;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
  .detail-head .spacer{flex:1}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .card .k{font-size:12px;color:var(--muted)}
  .card .v{font-size:22px;font-weight:700;margin-top:2px}
  .section-bar{display:flex;align-items:center;margin:0 0 12px}
  .section-bar h2{font-size:15px;margin:0;font-weight:600}
  .section-bar .spacer{flex:1}
  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-wrap.paged{border-radius:var(--radius) var(--radius) 0 0}
  /* ===== Pagination bar ===== */
  .pager{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);padding:10px 14px;margin-top:-1px}
  .pager-info{font-size:12.5px;color:var(--muted)}
  .pager-info b{color:var(--ink);font-weight:700}
  .pager-size{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-left:auto}
  .pager-size .select{width:auto;min-width:64px;height:30px;padding:0 8px;font-size:12.5px}
  .pager-nav{display:flex;align-items:center;gap:4px}
  .pg-btn{width:30px;height:30px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;display:flex;align-items:center;justify-content:center}
  .pg-btn:hover:not(:disabled){background:#f0f2f5;border-color:#cfd6e4}
  .pg-btn:disabled{opacity:.4;cursor:not-allowed}
  .pg-btn .icon{width:15px;height:15px}
  .pg-cur{font-size:12.5px;font-weight:600;color:var(--ink);padding:0 8px;white-space:nowrap}
  @media (max-width:640px){.pager{gap:10px;padding:10px 12px}.pager-size{margin-left:0;order:3}.pager-nav{order:2;margin-left:auto}.pager-info{order:1;width:100%}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fafbfc}
  tbody tr.editing{background:#f5f8ff !important}
  tbody tr.row-selected{background:var(--brand-soft) !important}
  .org-pill{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:2px 8px;font-weight:600;font-size:12px;margin:1px 0}
  .muted{color:var(--muted)}
  .cellactions{display:flex;gap:4px;justify-content:flex-end}
  .table-empty{padding:34px;text-align:center;color:var(--muted)}
  .inline-input{width:100%;min-width:70px;height:32px;padding:0 8px;border:1px solid var(--brand);border-radius:6px;font-size:13px;font-family:inherit;color:var(--ink);outline:none;background:#fff}
  .inline-input:focus{box-shadow:0 0 0 3px rgba(47,111,237,.14)}
  .upd{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
  .ver-badge{display:inline-block;background:#eef0f3;color:var(--muted);border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700;width:fit-content}
  .upd-date{font-size:11px;color:var(--muted)}
  .ver-dot{position:absolute;top:-3px;right:-3px;background:var(--brand);color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1}
  .vchk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
  .vchk input{position:absolute;opacity:0;width:0;height:0}
  .vchk .box{width:18px;height:18px;border:1.6px solid #c3c8d0;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;transition:.12s}
  .vchk .box .icon{width:13px;height:13px;stroke-width:2.6}
  .vchk.on .box{background:var(--manual);border-color:var(--manual)}
  .vchk:hover .box{border-color:var(--manual)}
  .vchk .vtxt{font-size:11px;color:var(--manual);font-weight:600}
  .vchk:not(.on) .vtxt{font-weight:400}
  .statustog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:3px 10px 3px 8px;cursor:pointer;white-space:nowrap;font-family:inherit}
  .statustog:hover{border-color:#c3c8d0}
  .statustog .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .statustog.on .dot{background:var(--manual);box-shadow:0 0 0 3px rgba(15,157,118,.16)}
  .statustog.off .dot{background:#c3c8d0;box-shadow:0 0 0 3px rgba(150,150,150,.14)}
  .statustog .st-lbl{font-size:12px;font-weight:700}
  .statustog.on .st-lbl{color:var(--manual)}
  .statustog.off .st-lbl{color:var(--muted)}
  .statustog .st-date{font-size:10px;color:var(--muted)}
  .shq{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:3px 10px 3px 8px;cursor:pointer;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:700}
  .shq:hover{border-color:#c3c8d0}
  .shq .dot{width:8px;height:8px;border-radius:50%;background:#c3c8d0;flex:0 0 auto}
  .shq.yes{border-color:#f6d9d5;background:#fef6f5;color:var(--danger)}
  .shq.yes .dot{background:var(--danger);box-shadow:0 0 0 3px rgba(224,72,59,.14)}
  .shq.no{color:var(--muted)}
  .scat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:3px 10px;cursor:pointer;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted)}
  .scat:hover{border-color:#c3c8d0}
  .scat .d2{width:8px;height:8px;border-radius:50%;background:#c3c8d0;flex:0 0 auto}
  .def-org{font-size:11px;color:var(--manual);background:#e4f6ef;border:1px solid #cdeede;border-radius:20px;padding:3px 9px;font-weight:600}
  .rowcb{display:inline-flex;align-items:center;cursor:pointer}
  .rowcb input{position:absolute;opacity:0;width:0;height:0}
  .rowcb .cbbox{width:18px;height:18px;border:1.6px solid #c3c8d0;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;transition:.12s}
  .rowcb .cbbox .icon{width:13px;height:13px;stroke-width:2.8}
  .rowcb.on .cbbox{background:var(--brand);border-color:var(--brand)}
  .rowcb:hover .cbbox{border-color:var(--brand)}
  .dupflag{display:inline-flex;align-items:center;gap:4px;margin-left:6px;color:var(--warn);font-size:11px;font-weight:700;cursor:help}
  .dupflag .icon{width:13px;height:13px}
  .bulkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:10px;padding:9px 12px;margin-bottom:12px;box-shadow:var(--shadow);animation:bbIn .18s ease}
  @keyframes bbIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .bb-count{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
  .bb-count .icon{width:15px;height:15px;color:#4ade80}
  .bb-sep{width:1px;height:20px;background:rgba(255,255,255,.2)}
  .bb-act{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:7px;font-size:12.5px;font-weight:500}
  .bb-act:hover{background:rgba(255,255,255,.18)}
  .bb-act .icon{width:14px;height:14px}
  .bb-act.danger{border-color:rgba(224,72,59,.5);background:rgba(224,72,59,.22)}
  .bb-act.danger:hover{background:rgba(224,72,59,.4)}
  .bb-clear{border:0;background:transparent;color:#cbd5e1;font-size:12.5px;font-weight:600;cursor:pointer;margin-left:auto}
  .bb-clear:hover{color:#fff;text-decoration:underline}
  .btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:13px;font-weight:500;color:var(--ink)}
  .btn:hover{background:#f7f8fa}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#2560d8}
  .btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
  .btn.warn:hover{filter:brightness(.94)}
  .btn.danger-btn{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.danger-btn:hover{filter:brightness(.94)}
  .btn.danger-btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .btn.small{height:30px;padding:0 10px;font-size:12px}
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);width:100%;max-width:560px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
  .modal.wide{max-width:720px}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal-head h3{margin:0;font-size:16px;font-weight:700}
  .modal-head .x{margin-left:auto;width:30px;height:30px;border:0;background:transparent;color:var(--muted);border-radius:7px;display:flex;align-items:center;justify-content:center}
  .modal-head .x:hover{background:#f0f1f3;color:var(--ink)}
  .modal-body{padding:18px 20px;overflow:auto}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fafbfc;align-items:center}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .field label .req{color:var(--danger)}
  .field .hint{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
  .input,.select,textarea{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff;outline:none}
  textarea{height:auto;padding:9px 11px;resize:vertical;min-height:62px;line-height:1.4}
  .input:focus,.select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .toggle .opt{border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  .toggle .opt:hover{border-color:#cfd6e4}
  .toggle .opt.sel{border-color:var(--brand);background:var(--brand-soft)}
  .toggle .opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid #c3c8d0;margin-top:1px;flex:0 0 auto}
  .toggle .opt.sel .dot{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px #fff}
  .toggle .opt .t{font-weight:600;font-size:13px}
  .toggle .opt .d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
  .tokbox{border:1px solid var(--line);border-radius:8px;padding:7px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:40px}
  .tokbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
  .tokbox input{border:0;outline:none;flex:1;min-width:120px;height:26px;font-size:13px;font-family:inherit;background:transparent}
  .token{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:3px 6px 3px 9px;font-size:12px;font-weight:600}
  .token.org{background:#e4f6ef;color:var(--manual)}
  .token button{border:0;background:transparent;color:inherit;cursor:pointer;display:flex;padding:0;line-height:0}
  .token button:hover{color:var(--danger)}
  .combo-note{font-size:12px;color:var(--muted);margin-right:auto}
  .combo-note b{color:var(--brand)}
  .kbd{display:inline-block;font-family:"Consolas",ui-monospace,monospace;font-size:10.5px;font-weight:700;background:#eef0f3;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink);white-space:nowrap;margin:0 1px}
  .sc-list{display:flex;flex-direction:column;gap:8px}
  .sc-list .r{display:flex;align-items:center;gap:10px;font-size:12.5px}
  .sc-list .r .keys{flex:0 0 150px}
  .sc-list .r .d{color:var(--muted)}
  .split-summary{font-size:12px;margin:10px 0 8px;color:var(--ink)}
  .split-summary .icon{width:13px;height:13px;color:var(--manual);vertical-align:-2px}
  .split-table-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:260px}
  .split-table{width:100%;border-collapse:collapse;font-size:12px}

<script>
const LS_KEY="verint_mapping_manager_v3";
const IDB_NAME="VerintMappingDB", IDB_STORE="state";
const DIR_CATS=[{key:"businessArea",label:"Business Area"},{key:"worktype",label:"Worktype"},{key:"status",label:"Status"},{key:"organization",label:"Organization Name"},{key:"manualQueue",label:"Manual Verint Queue"},{key:"source",label:"Source Name"}];
const DIR_KEYS=DIR_CATS.map(c=>c.key);
const STATUS_CATS=[{k:"delay",label:"Delay",color:"#d97706",bg:"#fef3e2"},{k:"processed",label:"Processed",color:"#0f9d76",bg:"#e4f6ef"},{k:"closed",label:"Closed",color:"#2f6fed",bg:"#e8f0fe"},{k:"nigo",label:"NIGO",color:"#e0483b",bg:"#fdecea"}];
const STATUS_CAT_ORDER=["","delay","processed","closed","nigo"];
function statusCatLabel(k){const c=STATUS_CATS.find(x=>x.k===k);return c?c.label:"";}
function normStatusCat(v){v=(v||"").trim().toLowerCase();if(!v)return "";const f=STATUS_CATS.find(c=>c.k===v||c.label.toLowerCase()===v);return f?f.k:"";}
function guessStatusCat(status){const t=(status||"").toLowerCase();if(/nigo|not in good order|not-in-good-order|reject|return|rework/.test(t))return "nigo";if(/delay|pend|hold|await|wait|aging|overdue|backlog/.test(t))return "delay";if(/clos/.test(t))return "closed";if(/process|complet|done|finish|resolv|posted/.test(t))return "processed";return "";}
function statusCatSelect(id,cls,val,firstLabel){return `<select class="${cls}" id="${id}"><option value="">${firstLabel||'— Uncategorized —'}</option>`+STATUS_CATS.map(c=>`<option value="${c.k}" ${val===c.k?'selected':''}>${c.label}</option>`).join("")+`</select>`;}
let state={functions:[],directories:{}};
let selection={worktypeId:null};
let searchTerm="";
let viewMode="detail";
let listFilters={text:"",type:"",validated:"",active:""};
let listSort={key:"function",dir:"asc"};
let sidebarSort={key:"custom",dir:"asc",type:"",validated:""};
let detailFilter={text:"",validated:"",org:"",active:"",cat:""};
let detailSort={key:"",dir:"asc"};
let editingMapId=null;
let selectedIds=new Set();
let dirPageFilter={text:"",cat:""};
let dirPageSort={key:"value",dir:"asc"};
let dirSelected=new Set();
let dirEditKey=null;
let dirPageActivePanel=null;
/* ===== Pagination state & helpers ===== */
let pager={detail:{page:1,size:25,sig:""},list:{page:1,size:25,sig:""},dir:{page:1,size:25,sig:""}};
function paginate(view,rows,sig){const p=pager[view];if(sig!==p.sig){p.sig=sig;p.page=1;}const size=p.size;const total=rows.length;const pages=size==="all"?1:Math.max(1,Math.ceil(total/size));if(p.page>pages)p.page=pages;if(p.page<1)p.page=1;const start=size==="all"?0:(p.page-1)*size;const end=size==="all"?total:start+size;return {slice:rows.slice(start,end),total,page:p.page,pages,size,start,end:Math.min(end,total)};}
function pagerBar(view,pg){if(pg.total===0)return "";const sizes=[10,25,50,100,"all"];const opts=sizes.map(s=>`<option value="${s}" ${String(pager[view].size)===String(s)?"selected":""}>${s==="all"?"All":s}</option>`).join("");const info=pg.total===0?"No rows":`Showing <b>${pg.start+1}\u2013${pg.end}</b> of <b>${pg.total}</b>`;const disF=pg.page<=1?"disabled":"";const disL=pg.page>=pg.pages?"disabled":"";return `<div class="pager"><div class="pager-info">${info}</div><div class="pager-size">Rows per page <select class="select" id="pgSize_${view}">${opts}</select></div><div class="pager-nav"><button class="pg-btn" data-pg="first" ${disF} title="First page">${svg('<path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/>')}</button><button class="pg-btn" data-pg="prev" ${disF} title="Previous">${svg('<path d="M15 18l-6-6 6-6"/>')}</button><span class="pg-cur">Page ${pg.page} of ${pg.pages}</span><button class="pg-btn" data-pg="next" ${disL} title="Next">${svg('<path d="M9 18l6-6-6-6"/>')}</button><button class="pg-btn" data-pg="last" ${disL} title="Last page">${svg('<path d="M13 17l5-5-5-5M6 17l5-5-5-5"/>')}</button></div></div>`;}
function wirePager(view,rerender){document.querySelectorAll("#main [data-pg]").forEach(b=>b.onclick=()=>{if(b.disabled)return;const act=b.dataset.pg,p=pager[view];if(act==="first")p.page=1;else if(act==="prev")p.page=Math.max(1,p.page-1);else if(act==="next")p.page=p.page+1;else if(act==="last")p.page=1e9;rerender();});const ss=document.getElementById("pgSize_"+view);if(ss)ss.onchange=()=>{const v=ss.value;pager[view].size=(v==="all"?"all":parseInt(v,10));pager[view].page=1;rerender();};}
const expanded=new Set();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSave(d){try{const db=await idbOpen();db.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).put(d,"current");}catch(e){}}
async function idbLoad(){try{const db=await idbOpen();return await new Promise(res=>{const g=db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get("current");g.onsuccess=()=>res(g.result||null);g.onerror=()=>res(null);});}catch(e){return null;}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}idbSave(state);}
async function load(){let d=null;try{const raw=localStorage.getItem(LS_KEY);if(raw)d=JSON.parse(raw);}catch(e){}if(!d)d=await idbLoad();if(d&&d.functions)state=d;ensureDirectories();}
function ensureDirectories(){if(!state.directories||typeof state.directories!=="object")state.directories={};DIR_KEYS.forEach(k=>{if(!Array.isArray(state.directories[k]))state.directories[k]=[];});migrateActive();}
function migrateActive(){state.functions.forEach(fn=>(fn.subFunctions||[]).forEach(sf=>{if(!Array.isArray(sf.defaultOrgs)){sf.defaultOrgs=sf.defaultOrg?[sf.defaultOrg]:[];}delete sf.defaultOrg;}));allWorktypes().forEach(({wt})=>(wt.mappings||[]).forEach(m=>{if(m.active===undefined){m.active=true;const t=m.createdAt||nowISO();if(!m.activeSince)m.activeSince=t;if(!m.statusChangedAt)m.statusChangedAt=t;}if(m.sharedQueue===undefined)m.sharedQueue=false;if(m.statusCategory===undefined)m.statusCategory=guessStatusCat(m.status)||"";}));}
function allWorktypes(){const o=[];state.functions.forEach(fn=>(fn.subFunctions||[]).forEach(sf=>(sf.worktypes||[]).forEach(wt=>o.push({fn,sf,wt}))));return o;}
function findWorktype(id){for(const fn of state.functions)for(const sf of(fn.subFunctions||[]))for(const wt of(sf.worktypes||[]))if(wt.id===id)return{fn,sf,wt};return null;}
function orgCount(wt){const s=new Set();(wt.mappings||[]).forEach(m=>(m.organizations||[]).forEach(o=>s.add(o.toLowerCase())));return s.size;}
function cmp(a,b){if(a==null)a="";if(b==null)b="";if(typeof a==="number"&&typeof b==="number")return a-b;const na=parseFloat(a),nb=parseFloat(b);if(!isNaN(na)&&!isNaN(nb)&&String(a).trim()!==""&&String(b).trim()!==""&&/^[\d.\-]+$/.test(String(a))&&/^[\d.\-]+$/.test(String(b)))return na-nb;return String(a).toLowerCase().localeCompare(String(b).toLowerCase());}
function sortBy(arr,keyFn,dir){const s=[...arr].sort((x,y)=>cmp(keyFn(x),keyFn(y)));if(dir==="desc")s.reverse();return s;}
function mapSortVal(m,wt,key){switch(key){case"businessArea":return m.businessArea||"";case"worktype":return m.worktype||"";case"status":return m.status||"";case"manualQueue":return m.manualQueue||"";case"key":return awdManualKey(wt.type,m);case"organizations":return(m.organizations||[]).join(", ");case"source":return m.source||"";case"remarks":return m.remarks||"";case"validated":return m.validated?1:0;case"active":return(m.active!==false)?1:0;case"sharedQueue":return m.sharedQueue?1:0;case"statusCategory":return m.statusCategory||"";case"version":return m.version||1;case"modifiedAt":return m.modifiedAt||m.createdAt||"";default:return"";}}
function suggestions(kind){const set=new Set(state.directories[kind]||[]);if(kind==="organization")state.functions.forEach(fn=>(fn.subFunctions||[]).forEach(sf=>{(sf.defaultOrgs||[]).forEach(o=>set.add(o));}));allWorktypes().forEach(({wt})=>(wt.mappings||[]).forEach(m=>{if(kind==="businessArea"&&m.businessArea)set.add(m.businessArea);if(kind==="worktype"&&m.worktype)set.add(m.worktype);if(kind==="status"&&m.status)set.add(m.status);if(kind==="manualQueue"&&m.manualQueue)set.add(m.manualQueue);if(kind==="source"&&m.source)set.add(m.source);if(kind==="organization")(m.organizations||[]).forEach(o=>set.add(o));}));return[...set].filter(Boolean).sort((a,b)=>a.localeCompare(b));}
function pushUniq(arr,v){v=(v||"").trim();if(v&&!arr.some(x=>x.toLowerCase()===v.toLowerCase()))arr.push(v);}
function parseBulkValues(raw){const out=[];(raw||"").split(/[\r\n,;\t]+/).forEach(v=>{v=v.trim();if(v&&!out.some(x=>x.toLowerCase()===v.toLowerCase()))out.push(v);});return out;}
function parseQueueKeys(raw){const out=[];(raw||"").split(/[\r\n,;\t]+/).forEach(v=>{v=v.trim();if(v)out.push(v);});return out;}
function splitQueueKey(key){key=(key||"").trim();if(/^m/i.test(key))return null;if(!/^[A-Za-z0-9_]+$/.test(key))return null;const parts=key.split("_").filter(p=>p!=="");if(parts.length!==3)return null;return{businessArea:parts[0],worktype:parts[1],status:parts[2]};}
function learn(rec){const d=state.directories;pushUniq(d.businessArea,rec.businessArea);pushUniq(d.worktype,rec.worktype);pushUniq(d.status,rec.status);pushUniq(d.manualQueue,rec.manualQueue);pushUniq(d.source,rec.source);(rec.organizations||[]).forEach(o=>pushUniq(d.organization,o));}
function renderDatalists(){document.getElementById("datalists").innerHTML=DIR_KEYS.map(k=>`<datalist id="dl_${k}">`+suggestions(k).map(v=>`<option value="${esc(v)}"></option>`).join("")+`</datalist>`).join("");}
function nowISO(){return new Date().toISOString();}
function fmtDate(iso){if(!iso)return"—";const d=new Date(iso);if(isNaN(d))return"—";const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}
function fmtDateShort(iso){if(!iso)return"—";const d=new Date(iso);if(isNaN(d))return"—";const p=n=>String(n).padStart(2,"0");return p(d.getMonth()+1)+"/"+p(d.getDate())+"/"+String(d.getFullYear()).slice(2)+" "+p(d.getHours())+":"+p(d.getMinutes());}
function snapshotFields(m){return{manualQueue:m.manualQueue||"",businessArea:m.businessArea||"",worktype:m.worktype||"",status:m.status||"",organizations:[...(m.organizations||[])],source:m.source||"",remarks:m.remarks||"",sharedQueue:!!m.sharedQueue,statusCategory:m.statusCategory||""};}
function sameFields(a,b){return a.manualQueue===b.manualQueue&&a.businessArea===b.businessArea&&a.worktype===b.worktype&&a.status===b.status&&a.source===b.source&&a.remarks===b.remarks&&!!a.sharedQueue===!!b.sharedQueue&&(a.statusCategory||"")===(b.statusCategory||"")&&(a.organizations||[]).join("|").toLowerCase()===(b.organizations||[]).join("|").toLowerCase();}
function stampNew(rec){const t=nowISO();rec.createdAt=t;rec.modifiedAt=t;rec.version=1;rec.history=[];rec.active=true;rec.activeSince=t;rec.statusChangedAt=t;if(rec.sharedQueue===undefined)rec.sharedQueue=false;if(rec.statusCategory===undefined)rec.statusCategory="";return rec;}
function stampEdit(m,before){if(!m.createdAt)m.createdAt=nowISO();const after=snapshotFields(m);if(!sameFields(before,after)){m.history=m.history||[];m.history.push({version:m.version||1,savedAt:m.modifiedAt||m.createdAt,fields:before});m.version=(m.version||1)+1;m.modifiedAt=nowISO();return true;}if(!m.modifiedAt)m.modifiedAt=m.createdAt;return false;}
function awdManualKey(type,m){if(type==="manual")return(m.manualQueue||"").trim();return[m.businessArea,m.worktype,m.status].map(v=>(v||"").trim()).join("_");}
function findKeyOccurrences(key,excludeWtId){const out=[];const k=(key||"").trim().toLowerCase();if(!k)return out;allWorktypes().forEach(({fn,sf,wt})=>{(wt.mappings||[]).forEach(m=>{if(awdManualKey(wt.type,m).trim().toLowerCase()===k)out.push({fn,sf,wt,m,current:wt.id===excludeWtId});});});return out;}

function commitMappingSave(ctx,isManual,combos){if(!ctx.wt.mappings)ctx.wt.mappings=[];const keyOf=(c)=>(isManual?`M|${c.manualQueue}`:`A|${c.businessArea}|${c.worktype}|${c.status}`)+`|${(c.organizations||[]).join(",")}`.toLowerCase();const existingKeys=new Set(ctx.wt.mappings.filter(x=>x.id!==mapCtx.mId).map(x=>keyOf(x)));let added=0,updated=0,skipped=0;if(mapCtx.mId){const idx=ctx.wt.mappings.findIndex(x=>x.id===mapCtx.mId);const rec=ctx.wt.mappings[idx];const before=snapshotFields(rec);const first=combos[0];Object.assign(rec,{manualQueue:first.manualQueue||"",businessArea:first.businessArea||"",worktype:first.worktype||"",status:first.status||"",organizations:first.organizations,sharedQueue:first.sharedQueue,statusCategory:first.statusCategory||"",source:first.source,remarks:first.remarks});stampEdit(rec,before);learn(rec);updated++;existingKeys.add(keyOf(rec));for(let i=1;i<combos.length;i++){const c=combos[i];if(existingKeys.has(keyOf(c))){skipped++;continue;}const nrec=stampNew({id:uid(),...c});ctx.wt.mappings.push(nrec);learn(nrec);existingKeys.add(keyOf(c));added++;}}else{combos.forEach(c=>{if(existingKeys.has(keyOf(c))){skipped++;return;}const nrec=stampNew({id:uid(),...c});ctx.wt.mappings.push(nrec);learn(nrec);existingKeys.add(keyOf(c));added++;});}const _keep=mapKeepOpen&&!mapCtx.mId;const _wtId=mapCtx.wtId;renderAll();const parts=[];if(added)parts.push(`${added} added`);if(updated)parts.push(`${updated} updated`);if(skipped)parts.push(`${skipped} duplicate${skipped>1?'s':''} skipped`);toast(parts.join(", ")||"No changes");if(_keep){openMapping(_wtId);}else{closeOverlay("map");}}
function openDupWarning(ctx,findings){const total=findings.reduce((a,f)=>a+f.occ.length,0);let html=`<div class="dup-head"><div class="dup-ic">${svg(IC.warn)}</div><div class="dup-lead"><b>Possible duplicate queue${findings.length>1?'s':''} detected.</b><br>The following queue key${findings.length>1?'s were':' was'} already found in <b>${total}</b> existing location${total>1?'s':''}. Review below, then choose to add anyway or cancel.</div></div>`;findings.forEach(f=>{const inCur=f.occ.some(o=>o.current);html+=`<div class="dup-group"><div class="dup-gh"><code class="keycode">${esc(f.key.toUpperCase())}</code>${inCur?'<span class="cur-badge">also in current</span>':'<span class="other-badge">other location</span>'}<span class="gcount">${f.occ.length} match${f.occ.length>1?'es':''}</span></div>`;f.occ.forEach(o=>{const orgs=(o.m.organizations||[]).join(", ");html+=`<div class="dup-loc"><div class="path">${svg(IC.folder,'sepi')}<b>${esc(o.fn.name)}</b>${svg(IC.caret,'sepi')}<b>${esc(o.sf.name)}</b>${svg(IC.caret,'sepi')}<span>${esc(o.wt.name)}</span> <span class="tag ${o.wt.type}">${o.wt.type}</span>${o.current?'<span class="cur-badge">current</span>':'<span class="other-badge">other</span>'}</div><span class="orgs">${esc(orgs)||'—'}</span></div>`;});html+=`</div>`;});document.getElementById("dupBody").innerHTML=html;showOverlay("dup");}

function parseDelimited(raw){raw=(raw||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");if(!raw.trim())return [];const firstLine=raw.split("\n")[0];const delim=firstLine.indexOf("\t")>-1?"\t":(firstLine.indexOf(",")>-1?",":(firstLine.indexOf(";")>-1?";":"\t"));const rows=[];let field="",row=[],inQ=false;for(let i=0;i<raw.length;i++){const ch=raw[i];if(inQ){if(ch=='"'){if(raw[i+1]=='"'){field+='"';i++;}else inQ=false;}else field+=ch;}else{if(ch=='"')inQ=true;else if(ch===delim){row.push(field);field="";}else if(ch=="\n"){row.push(field);rows.push(row);row=[];field="";}else field+=ch;}}row.push(field);rows.push(row);return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c!==""));}
function normType(v){v=(v||"").trim().toLowerCase();if(v==="manual"||v==="m")return "manual";return "awd";}

function impMapKey(mp,orgs){return (mp.manualQueue?("M|"+mp.manualQueue):("A|"+mp.businessArea+"|"+mp.worktype+"|"+mp.status)).toLowerCase()+"|"+((orgs||[]).join(",").toLowerCase());}
function analyzeStruct(rows){const out={items:[],errors:0,skipHeader:false,addWt:0,addMap:0,skipMap:0,errMap:0};if(rows.length&&looksLikeHeader(rows[0])){out.skipHeader=true;rows=rows.slice(1);}const existF={};state.functions.forEach(f=>{const fk=f.name.toLowerCase();existF[fk]={obj:f,sf:{}};(f.subFunctions||[]).forEach(sf=>{const sk=sf.name.toLowerCase();existF[fk].sf[sk]={obj:sf,wt:{}};(sf.worktypes||[]).forEach(wt=>{existF[fk].sf[sk].wt[wt.name.toLowerCase()]={type:wt.type,keys:new Set((wt.mappings||[]).map(m=>impMapKey(m.manualQueue?{manualQueue:m.manualQueue}:{businessArea:m.businessArea,worktype:m.worktype,status:m.status},m.organizations)))};});});});const planWt={};rows.forEach(r=>{const c=classifyImportRow(r);const fn=c.fn,sf=c.sf,wt=c.wt,queue=c.queue,cat=c.cat;if(!fn||!sf||!wt){out.items.push({fn,sf,wt,ty:"awd",status:"error",reason:"missing Function / Sub-Function / Worktype",queue,cat,mapping:null,mapStatus:"none",mapReason:""});out.errors++;return;}const fk=fn.toLowerCase(),sk=sf.toLowerCase(),wk=wt.toLowerCase();
  /* Split Verint Queue condition: a clean BUSINESSAREA_WORKTYPE_STATUS → AWD; otherwise → Manual Verint Queue */

  const existWtObj=existF[fk]&&existF[fk].sf[sk]&&existF[fk].sf[sk].wt[wk];
  const pk=fk+"|"+sk+"|"+wk;let wtStatus,wtReason="";if(existWtObj){wtStatus="skip";wtReason="worktype already exists";effType=existWtObj.type;}else if(planWt[pk]){wtStatus="skip";wtReason="worktype added above";effType=planWt[pk].type;}else{wtStatus="add";out.addWt++;}
  const defOrgs=(existF[fk]&&existF[fk].sf[sk]&&existF[fk].sf[sk].obj.defaultOrgs)||[];

function commitStruct(analysis){let addedWt=0,newF=0,newSf=0,addedMap=0,skippedMap=0;const mko=(m)=>impMapKey(m.manualQueue?{manualQueue:m.manualQueue}:{businessArea:m.businessArea,worktype:m.worktype,status:m.status},m.organizations);analysis.items.forEach(it=>{if(!it.fn||!it.sf||!it.wt)return;let f=state.functions.find(x=>x.name.toLowerCase()===it.fn.toLowerCase());if(!f){f={id:uid(),name:it.fn,subFunctions:[]};state.functions.push(f);expanded.add(f.id);newF++;}let sf=(f.subFunctions||[]).find(x=>x.name.toLowerCase()===it.sf.toLowerCase());if(!sf){sf={id:uid(),name:it.sf,worktypes:[],defaultOrgs:[]};f.subFunctions.push(sf);expanded.add(f.id);expanded.add(sf.id);newSf++;}let wt=(sf.worktypes||[]).find(x=>x.name.toLowerCase()===it.wt.toLowerCase());if(!wt){wt={id:uid(),name:it.wt,type:it.ty,mappings:[]};sf.worktypes.push(wt);addedWt++;}if(it.mapStatus==="add"&&it.mapping){const orgs=(sf.defaultOrgs||[]).slice();const rec=Object.assign({businessArea:"",worktype:"",status:"",manualQueue:"",sharedQueue:false,statusCategory:it.cat||"",source:"",remarks:""},it.mapping,{organizations:orgs});const existing=new Set((wt.mappings||[]).map(mko));if(existing.has(mko(rec))){skippedMap++;}else{const nrec=stampNew({id:uid(),...rec});wt.mappings.push(nrec);learn(nrec);addedMap++;}}});return {addedWt,newF,newSf,skipped:analysis.items.filter(i=>i.status==="skip").length,addedMap,skippedMap};}

function renderStructBody(pasteVal){const body=document.getElementById("structBody");body.innerHTML=`<div class="imp-note">Columns: <code>Function</code>, <code>Sub-Function</code>, <code>Dashboard Worktype Name</code>, then optional <code>Type</code> (AWD/Manual), <code>Status Category</code> (Delay/Processed/Closed/NIGO) and <code>Verint Queue</code>. When a queue is given the mapping is created too: a clean <code>BUSINESSAREA_WORKTYPE_STATUS</code> becomes an AWD mapping; anything else (spaces, special chars, starts with M, or ≠ two “_”) becomes a Manual Verint Queue. Organization is optional (auto-fills from the sub-function default). Type &amp; Category are auto-detected when blank. Header row optional. Drop a .csv/.txt, paste from Excel, or type below.</div><div class="imp-drop" id="structDrop">${svg(IC.upload)}<div><b>Drop CSV / TXT file</b> or click to browse</div><div style="font-size:11px;margin-top:2px">For Excel: copy the cells and paste into the box below</div></div><input type="file" id="structFile" accept=".csv,.txt,.tsv" style="display:none"><div class="field"><label>Or paste data</label><textarea id="structText" placeholder="New Business${'\t'}1035${'\t'}EXCHCASH${'\t'}AWD${'\t'}Processed${'\t'}AGLIFECS_EXCHCASH_COMPLETED&#10;New Business${'\t'}1035${'\t'}Review1035${'\t'}AWD${'\t'}Delay${'\t'}AGLIFECS_REVIEW1035_PENDING&#10;New Business${'\t'}ARC-DE${'\t'}ALIP DE Manual${'\t'}Manual${'\t'}NIGO${'\t'}M ALIP DE Rejects" style="min-height:120px">${esc(pasteVal||"")}</textarea></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" id="structPreview">${svg(IC.list)} Preview</button></div><div id="structPreviewBox"></div>`;const drop=document.getElementById("structDrop"),file=document.getElementById("structFile");drop.onclick=()=>file.click();drop.ondragover=(e)=>{e.preventDefault();drop.classList.add("drag");};drop.ondragleave=()=>drop.classList.remove("drag");drop.ondrop=(e)=>{e.preventDefault();drop.classList.remove("drag");c function readStructFile(f){const name=(f.name||"").toLowerCase();if(name.endsWith(".xlsx")||name.endsWith(".xls")){toast("For Excel: open the file, copy the cells, and paste them here.","warn");return;}const r=new FileReader();r.onload=()=>{const ta=document.getElementById("structText");if(ta)ta.value=r.result;previewStruct();};r.readAsText(f);}

let histCtx=null;
function openHistory(wtId,mId){const ctx=findWorktype(wtId);if(!ctx)return;const m=(ctx.wt.mappings||[]).find(x=>x.id===mId);if(!m)return;histCtx={wtId,mId};const isManual=ctx.wt.type==="manual";const labelOf=isManual?(m.manualQueue||"(queue)"):[m.businessArea,m.worktype,m.status].filter(Boolean).join(" · ")||"(mapping)";document.getElementById("histTitle").textContent="Version History · "+labelOf;const meta=`<div class="hist-meta"><div class="m"><span class="l">Created</span><span class="v">${fmtDate(m.createdAt)}</span></div><div class="m"><span class="l">Last modified</span><span class="v">${fmtDate(m.modifiedAt||m.createdAt)}</span></div><div class="m"><span class="l">Current version</span><span class="v">v${m.version||1}</span></div><div class="m"><span class="l">Revisions</span><span class="v">${(m.history||[]).length}</span></div></div>`;const items=[];items.push(tlItem(m.version||1,m.modifiedAt||m.createdAt,snapshotFields(m),isManual,true,null));const hist=[...(m.history||[])].sort((a,b)=>(b.version||0)-(a.version||0));let prev=snapshotFields(m);hist.forEach(h=>{items.push(tlItem(h.version,h.savedAt,h.fields,isManual,false,prev));prev=h.fields;});const body=(m.history&&m.history.length)?meta+`<div class="timeline">${items.join("")}</div>`:meta+`<div class="hist-empty">No previous revisions yet — this mapping is still on its first version.<br>Any future edits will be recorded here.</div>`;document.getElementById("histBody").innerHTML=body;showOverlay("hist");document.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>restoreVersion(+b.dataset.restore));}
function tlItem(version,when,f,isManual,isCurrent,diffAgainst){const fields=isManual?[["Manual Verint Queue","manualQueue"],["Status Category","statusCategory"],["Shared Queue","sharedQueue"],["Organizations","organizations"],["Source","source"],["Remarks","remarks"]]:[["Business Area","businessArea"],["Worktype","worktype"],["Status","status"],["Status Category","statusCategory"],["Shared Queue","sharedQueue"],["Organizations","organizations"],["Source","source"],["Remarks","remarks"]];const cells=fields.map(([lab,key])=>{let cur=key==="organizations"?(f.organizations||[]).join(", "):key==="sharedQueue"?(f.sharedQueue?"Yes":"No"):key==="statusCategory"?(statusCatLabel(f.statusCategory)||"—"):(f[key]||"");let changed=false;if(diffAgainst){let other=key==="organizations"?(diffAgainst.organizations||[]).join(", "):key==="sharedQueue"?(diffAgainst.sharedQueue?"Yes":"No"):key==="statusCategory"?(statusCatLabel(diffAgainst.statusCategory)||"—"):(diffAgainst[key]||"");changed=(String(cur).toLowerCase()!==String(other).toLowerCase());}return `<div class="f ${changed?'chg':''}"><span class="fl">${lab}</span><span class="fv" title="${esc(cur)}">${esc(cur)||'<span class="muted">—</span>'}</span></div>`;}).join("");const restoreBtn=isCurrent?"":`<button class="btn small" data-restore="${version}" title="Restore this version">${svg(IC.restore)} Restore</button>`;return `<div class="tl-item ${isCurrent?'':'old'}"><span class="dot"></span><div class="tl-head"><span class="vb">v${version}</span><span class="when">${fmtDate(when)}</span>${isCurrent?'<span class="cur">Current</span>':''}<span class="spacer"></span>${restoreBtn}</div><div class="tl-fields">${cells}</div></div>`;}

function doEntitySave(keepOpen){const {kind,id,parentId}=entityCtx;const name=document.getElementById("entName").value.trim();if(!name){toast("Please enter a name","warn");return;}if(kind==="function"&&!id&&state.functions.some(f=>f.name.toLowerCase()===name.toLowerCase())){toast("A function with this name already exists","warn");return;}if(kind==="subfunction"&&!id){const fn=state.functions.find(f=>f.id===parentId);if((fn.subFunctions||[]).some(s=>s.name.toLowerCase()===name.toLowerCase())){toast("A sub-function with this name already exists here","warn");return;}}if(kind==="worktype"&&!id){let sf=null;for(const f of state.functions){const s=(f.subFunctions||[]).find(x=>x.id===parentId);if(s){sf=s;break;}}if((sf.worktypes||[]).some(w=>w.name.toLowerCase()===name.toLowerCase())){toast("A worktype with this name already exists here","warn");return;}}if(kind==="function"){if(id)state.functions.find(f=>f.id===id).name=name;else{const nf={id:uid(),name,subFunctions:[]};state.functions.push(nf);expanded.add(nf.id);}}if(kind==="subfunction"){const inp=document.getElementById("entDefOrgInput");if(inp&&inp.value.trim()){addEntityOrg(inp.value);inp.value="";}const defOrgs=[...entityDefOrgs];if(id){for(const f of state.functions){const sf=(f.subFunctions||[]).find(s=>s.id===id);if(sf){sf.name=name;sf.defaultOrgs=defOrgs;break;}}}else{const fn=state.functions.find(f=>f.id===parentId);const ns={id:uid(),name,worktypes:[],defaultOrgs:defOrgs};fn.subFunctions.push(ns);expanded.add(fn.id);expanded.add(ns.id);}defOrgs.forEach(o=>pushUniq(state.directories.organization,o));}if(kind==="worktype"){const type=document.querySelector("#typeToggle .opt.sel")?.dataset.type||"awd";if(id){const c=findWorktype(id);c.wt.name=name;c.wt.type=type;}else{let sf=null;for(const f of state.functions){const s=(f.subFunctions||[]).find(x=>x.id===parentId);if(s){sf=s;break;}}const nw={id:uid(),name,type,mappings:[]};sf.worktypes.push(nw);expanded.add(sf.id);selection.worktypeId=nw.id;viewMode="detail";} function dirPageSaveEdit(cat,index){const nv=(document.getElementById("dpEditInput")?.value||"").trim();if(!nv){toast("Value cannot be empty","warn");return;}if(dirHasValue(cat,nv,index)){toast("Duplicate not allowed","warn");return;}state.directories[cat][index]=nv;dirEditKey=null;save();renderDatalists();renderDirectoriesPage();toast("Updated");}
function dirPageDelete(cat,index){const v=state.directories[cat][index];if(!confirm(`Remove "${v}" from ${catLabel(cat)}?`))return;state.directories[cat].splice(index,1);save();renderDatalists();renderDirectoriesPage();toast("Removed");}
function dirBulkAction(action){const items=[...dirSelected].map(k=>{const i=k.indexOf("|");return {cat:k.slice(0,i),value:k.slice(i+1)};});if(action==="clear"){dirSelected.clear();renderDirectoriesPage();return;}if(items.length===0)return;if(action==="delete"){if(!confirm(`Delete ${items.length} selected value${items.length>1?'s':''}? This cannot be undone.`))return;items.forEach(it=>{const arr=state.directories[it.cat]||[];const idx=arr.findIndex(x=>x.toLowerCase()===it.value);if(idx>-1)arr.splice(idx,1);});dirSelected.clear();save();renderDatalists();renderDirectoriesPage();toast(`${items.length} deleted`);return;}if(action==="export"){const rows=[["Category","Value","Used in mappings"]];items.forEach(it=>{const real=(state.directories[it.cat]||[]).find(x=>x.toLowerCase()===it.value)||it.value;rows.push([catLabel(it.cat),real,dirUsageCount(it.cat,real)]);});download("verint-directories-"+stamp()+".csv",rows.map(r=>r.map(csvCell).join(",")).join("\r\n"),"text/csv");toast(`${items.length} exported`);return;}if(action==="move"){const target=prompt("Move selected values to which directory?\nType one of:\n"+DIR_CATS.map(c=>"• "+c.label).join("\n"));if(!target)return;const tc=DIR_CATS.find(c=>c.label.toLowerCase()===target.trim().toLowerCase()||c.key.toLowerCase()===target.trim().toLowerCase());if(!tc){toast("Unknown directory: "+target,"warn");return;}let moved=0,skipped=0;items.forEach(it=>{if(it.cat===tc.key)return;const arr=state.directories[it.cat]||[];const idx=arr.findIndex(x=>x.toLowerCase()===it.value);if(idx<0)return;const value=arr[idx];if(dirHasValue(tc.key,value)){arr.splice(idx,1);skipped++;}else{arr.splice(idx,1);state.directories[tc.key].push(value);moved++;}});dirSelected.clear();save();renderDatalists();renderDirectoriesPage();toast(`Moved ${moved} to ${tc.label}${skipped?`, ${skipped} already existed`:''}`);return;}}

function renderClearData(){const st=clearStats();const opt=(id,name,desc,count)=>{const sel=clearSel.has(id);return `<div class="clr-opt ${sel?'sel':''}" data-clr="${id}"><span class="clr-cb">${sel?svg(IC.check):''}</span><div class="clr-body"><div class="clr-name">${name}</div><div class="clr-desc">${desc}</div></div><span class="clr-count">${count}</span></div>`;};let dirSub="";if(clearSel.has("directories")){dirSub=`<div class="clr-sub">`+DIR_CATS.map(c=>{const sel=clearDirSel.has(c.key);return `<div class="clr-subopt ${sel?'sel':''}" data-clrdir="${c.key}"><span class="clr-cb">${sel?svg(IC.check):''}</span><span class="n">${c.label}</span><span class="clr-count">${st.dirBy[c.key]}</span></div>`;}).join("")+`</div>`;}const body=`<div class="clr-lead">${svg(IC.warn)}<div><b>This permanently deletes the selected data</b> from this browser. This cannot be undone — export a backup first if unsure.</div></div><div class="clr-sec"><div class="clr-sec-title">Choose what to clear <span class="selall" id="clrSelAll">Select all</span></div>${opt("mappings","All Mappings","Remove every mapping row; keeps structure &amp; directories.",st.mappings)}${opt("worktypes","Worktypes &amp; Mappings","Remove all worktypes and their mappings; keeps functions &amp; sub-functions.",st.worktypes)}${opt("structure","Entire Structure","Remove all Functions, Sub-functions, Worktypes &amp; Mappings; keeps directories.",st.functions+" fn")}${opt("directories","Directories","Remove master directory values (choose which below).",st.directories)}${dirSub}${opt("everything","Everything (Full Reset)","Wipe all data and reset the app.","ALL")}</div><div class="clr-confirm"><label>Type <b>CLEAR</b> to confirm deletion</label><input id="clrConfirmInput" placeholder="CLEAR" autocomplete="off"></div>`;document.getElementById("clearBody").innerHTML=body;updateClearNote();document.querySelectorAll("[data-clr]").forEach(el=>el.onclick=()=>{const id=el.dataset.clr;if(id==="everything"){if(clearSel.has("everything")){clearSel.delete("everything");}else{clearSel=new Set(["everything"]);clearDirSel=new Set();}}else{clearSel.delete("everything");clearSel.has(id)?clearSel.delete(id):clearSel.add(id);if(id==="directories"&&clearSel.has("directories")&&clearDirSel.size===0){DIR_KEYS.forEach(k=>clearDirSel.add(k));}}renderClearData();});document.querySelectorAll("[data-clrdir]").forEach(el=>el.onclick=()=>{const k=el.dataset.clrdir;clearDirSel.has(k)?clearDirSel.delete(k):clearDirSel.add(k);renderClearData();});document.getElementById("clrSelAll").onclick=()=>{clearSel=new Set(["everything"]);clearDirSel=new Set();renderClearData();};const ci=document.getElementById("clrConfirmInput");if(ci)ci.oninput=updateClearNote;}
function updateClearNote(){const note=document.getElementById("clearNote");const btn=document.getElementById("clearProceed");const confirmVal=(document.getElementById("clrConfirmInput")?.value||"").trim().toUpperCase();let ready=clearSel.size>0&&confirmVal==="CLEAR";if(clearSel.has("directories")&&!clearSel.has("everything")&&clearDirSel.size===0&&clearSel.size===1)ready=false;if(note)note.innerHTML=clearSel.size===0?`<span style="color:var(--muted)">Select what to clear</span>`:(confirmVal==="CLEAR"?`<span style="color:var(--danger)">Ready to clear ${clearSel.has("everything")?'<b>everything</b>':`<b>${clearSel.size}</b> selection${clearSel.size>1?'s':''}`}</span>`:`<span style="color:var(--muted)">Type CLEAR to enable</span>`);if(btn)btn.disabled=!ready;}
function performClear(){const acted=[];if(clearSel.has("everything")){state={functions:[],directories:{}};ensureDirectories();selection.worktypeId=null;editingMapId=null;selectedIds.clear();viewMode="detail";searchTerm="";dirPageActivePanel=null;closeOverlay("clear");renderAll();toast("All data cleared — app reset");return;}if(clearSel.has("structure")){state.functions=[];selection.worktypeId=null;editingMapId=null;selectedIds.clear();acted.push("structure");}else if(clearSel.has("worktypes")){state.functions.forEach(f=>(f.subFunctions||[]).forEach(sf=>sf.worktypes=[]));selection.worktypeId=null;editingMapId=null;selectedIds.clear();acted.push("worktypes");}else if(clearSel.has("mappings")){allWorktypes().forEach(({wt})=>wt.mappings=[]);editingMapId=null;selectedIds.clear();acted.push("mappings");}if(clearSel.has("directories")){const keys=clearDirSel.size?[...clearDirSel]:DIR_KEYS;keys.forEach(k=>state.directories[k]=[]);acted.push("directories");}closeOverlay("clear");renderAll();toast(acted.length?("Cleared: "+acted.join(", ")):"Nothing cleared");}

document.getElementById("fileInput").onchange=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.functions)throw 0;if(!confirm("Import will replace current data. Continue?")){e.target.value="";return;}state=data;ensureDirectories();selection.worktypeId=null;editingMapId=null;selectedIds.clear();viewMode="detail";renderAll();toast("Data imported");}catch{toast("Invalid JSON file","warn");}e.target.value="";};r.readAsText(f);};
function buildCsv(){const head=["Function","Sub-Function","Dashboard Worktype","Type","AWD & Manual Verint Queue","Manual Verint Queue","Business Area","Worktype","Status","Status Category","Shared Queue","Organization","Source","Remarks","Active Status","Status Changed Date","Validated","Validation Date","Version","Created Date","Modified Date"];const rows=[head];state.functions.forEach(fn=>(fn.subFunctions||[]).forEach(sf=>(sf.worktypes||[]).forEach(wt=>{const maps=wt.mappings||[];if(maps.length===0){rows.push([fn.name,sf.name,wt.name,wt.type,"","","","","","","","","","","","","","","","",""]);return;}maps.forEach(m=>{const key=awdManualKey(wt.type,m);const isActive=(m.active!==false);const stChg=m.statusChangedAt||m.activeSince||m.createdAt;const orgs=(m.organizations||[]);const list=orgs.length?orgs:[""];list.forEach(org=>rows.push([fn.name,sf.name,wt.name,wt.type,key,m.manualQueue||"",m.businessArea||"",m.worktype||"",m.status||"",statusCatLabel(m.statusCategory),m.sharedQueue?"Yes":"No",org,m.source||"",m.remarks||"",isActive?"Active":"Inactive",fmtDate(stChg),m.validated?"Yes":"No",m.validated?fmtDate(m.validatedAt):"","v"+(m.version||1),fmtDate(m.createdAt),fmtDate(m.modifiedAt||m.createdAt)]));});})));return rows.map(r=>r.map(csvCell).join(",")).join("\r\n");}
function csvCell(v){v=(v==null?"":String(v));return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes());}
function closeOverlay(k){document.getElementById(k+"Overlay").classList.remove("show");}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeOverlay(b.dataset.close));
document.querySelectorAll(".overlay").forEach(o=>o.onclick=(e)=>{if(e.target===o)o.classList.remove("show");});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.querySelectorAll(".overlay.show").forEach(o=>o.classList.remove("show"));closeDrawer();closeMenus();}});
/* ===================== KEYBOARD SHORTCUTS ===================== */
function topOverlay(){const ovs=[...document.querySelectorAll(".overlay.show")];return ovs.length?ovs[ovs.length-1]:null;}
function activeIsEditable(){const el=document.activeElement;if(!el)return false;const t=el.tagName;return t==="INPUT"||t==="TEXTAREA"||t==="SELECT"||el.isContentEditable;}
const PRIMARY_BTN={entityOverlay:"entitySave",mapOverlay:"mapSave",orgOverlay:"orgApply",structOverlay:"structImport",clearOverlay:"clearProceed",dupOverlay:"dupProceed"};
const ADD_BTN={entityOverlay:"entitySaveAdd",mapOverlay:"mapSaveAdd"};
function clickIf(id){const b=id&&document.getElementById(id);if(b&&b.offsetParent!==null&&!b.disabled){b.click();return true;}return false;}
document.addEventListener("keydown",e=>{
  const ov=topOverlay();
  // In-form save shortcuts (work even while typing): Ctrl/Cmd+Enter, Shift+Enter, Ctrl/Cmd+S
  if(ov){
    const pri=PRIMARY_BTN[ov.id],add=ADD_BTN[ov.id];
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();if(e.shiftKey&&add){clickIf(add);}else{clickIf(pri);}return;}
    if(e.shiftKey&&e.key==="Enter"){e.preventDefault();if(!clickIf(add))clickIf(pri);return;}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();clickIf(pri);return;}
  }
  // Letter shortcuts — only when NOT typing in a field
  if(activeIsEditable())return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(!e.shiftKey)return;
  const k=e.key.toLowerCase();
  if(ov){
    const pri=PRIMARY_BTN[ov.id],add=ADD_BTN[ov.id];
    if(k==="s"){e.preventDefault();clickIf(pri);return;}
    if(k==="a"){e.preventDefault();if(!clickIf(add))clickIf(pri);return;}
    return;
  }
  // Global navigation shortcuts (no modal open)
  if(k==="n"){e.preventDefault();if(selection.worktypeId&&viewMode==="detail"){openMapping(selection.worktypeId);}else{openEntity("function");}return;}
  if(k==="a"){e.preventDefault();if(selection.worktypeId&&viewMode==="detail")openMapping(selection.worktypeId);return;}
  if(k==="f"){e.preventDefault();document.getElementById("searchInput")?.focus();return;}
  if(k==="d"){e.preventDefault();document.getElementById("btnDirectories").click();return;}
  if(k==="l"){e.preventDefault();document.getElementById("btnListView").click();return;}
  if(k==="i"){e.preventDefault();openStructImport();return;}
  if(k==="k"){e.preventDefault();openShortcuts();return;}
  if(k==="?"){e.preventDefault();openShortcuts();return;}
});
function openShortcuts(){const rows=[["Shift + S","Save the open form"],["Shift + A","Save &amp; add another (keeps the form open)"],["Ctrl / ⌘ + Enter","Save from any field, even while typing"],["Shift + Enter","Save &amp; add another, even while typing"],["Esc","Close / cancel the dialog"],["Shift + N","New — Add mapping (in a worktype) or New Function"],["Shift + F","Focus the search box"],["Shift + D","Open Directories"],["Shift + L","Open List View"],["Shift + I","Import structure"],["Shift + K  /  ?","Show this shortcuts help"]];document.getElementById("aboutBody").innerHTML=`<div class="ab-hero"><div class="ab-logo"><svg class="icon" viewBox="0 0 24 24" style="width:26px;height:26px;stroke:#fff"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M9 13h6"/></svg></div><div><div class="ab-name">Keyboard Shortcuts</div><div class="ab-ver">Work faster with the keyboard</div></div></div><div class="sc-list">${rows.map(r=>`<div class="r"><span class="keys">${r[0].split(" ").map(p=>(p==="+"||p==="/")?`<span style="color:var(--muted)">${p}</span>`:`<span class="kbd">${p}</span>`).join(" ")}</span><span class="d">${r[1]}</span></div>`).join("")}</div><div class="ab-tech" style="margin-top:16px">Tip: letter shortcuts (Shift+S, Shift+A, …) work when you're not typing in a field. While typing, use Ctrl/⌘+Enter to save or Shift+Enter to save &amp; add another.</div>`;showOverlay("about");}
let toastT;
function toast(msg,type){const t=document.getElementById("toast");t.innerHTML=(type==="warn"?'<svg class="icon" viewBox="0 0 24 24" style="color:#fbbf24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>':'<svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>')+esc(msg);t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2400);}
function init(){renderAll();}
load().then(init);
</script>
