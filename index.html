function deleteMapping(wtId,mId){const ctx=findWorktype(wtId);if(!ctx)return;if(!confirm("Delete this mapping row?"))return;ctx.wt.mappings=ctx.wt.mappings.filter(x=>x.id!==mId);if(editingMapId===mId)editingMapId=null;selectedIds.delete(mId);renderAll();toast("Mapping deleted");}
function toggleValidated(wtId,mId,checked){const ctx=findWorktype(wtId);if(!ctx)return;const m=(ctx.wt.mappings||[]).find(x=>x.id===mId);if(!m)return;if(checked){m.validated=true;m.validatedAt=nowISO();}else{m.validated=false;m.validatedAt=null;}renderAll();toast(checked?("Validated on "+fmtDate(m.validatedAt)):"Validation cleared");}
function toggleActive(wtId,mId){const ctx=findWorktype(wtId);if(!ctx)return;const m=(ctx.wt.mappings||[]).find(x=>x.id===mId);if(!m)return;const nowActive=(m.active===false);const t=nowISO();m.active=nowActive;m.statusChangedAt=t;if(nowActive)m.activeSince=t;else m.inactiveSince=t;renderAll();toast(nowActive?("Set Active on "+fmtDate(t)):("Set Inactive on "+fmtDate(t)));}

/* VERSION HISTORY */
let histCtx=null;
function openHistory(wtId,mId){const ctx=findWorktype(wtId);if(!ctx)return;const m=(ctx.wt.mappings||[]).find(x=>x.id===mId);if(!m)return;histCtx={wtId,mId};const isManual=ctx.wt.type==="manual";const labelOf=isManual?(m.manualQueue||"(queue)"):[m.businessArea,m.worktype,m.status].filter(Boolean).join(" · ")||"(mapping)";document.getElementById("histTitle").textContent="Version History · "+labelOf;const meta=`<div class="hist-meta"><div class="m"><span class="l">Created</span><span class="v">${fmtDate(m.createdAt)}</span></div><div class="m"><span class="l">Last modified</span><span class="v">${fmtDate(m.modifiedAt||m.createdAt)}</span></div><div class="m"><span class="l">Current version</span><span class="v">v${m.version||1}</span></div><div class="m"><span class="l">Revisions</span><span class="v">${(m.history||[]).length}</span></div></div>`;const items=[];items.push(tlItem(m.version||1,m.modifiedAt||m.createdAt,snapshotFields(m),isManual,true,null));const hist=[...(m.history||[])].sort((a,b)=>(b.version||0)-(a.version||0));let prev=snapshotFields(m);hist.forEach(h=>{items.push(tlItem(h.version,h.savedAt,h.fields,isManual,false,prev));prev=h.fields;});const body=(m.history&&m.history.length)?meta+`<div class="timeline">${items.join("")}</div>`:meta+`<div class="hist-empty">No previous revisions yet — this mapping is still on its first version.<br>Any future edits will be recorded here.</div>`;document.getElementById("histBody").innerHTML=body;showOverlay("hist");document.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>restoreVersion(+b.dataset.restore));}
function tlItem(version,when,f,isManual,isCurrent,diffAgainst){const fields=isManual?[["Manual Verint Queue","manualQueue"],["Organizations","organizations"],["Source","source"],["Remarks","remarks"]]:[["Business Area","businessArea"],["Worktype","worktype"],["Status","status"],["Organizations","organizations"],["Source","source"],["Remarks","remarks"]];const cells=fields.map(([lab,key])=>{let cur=key==="organizations"?(f.organizations||[]).join(", "):(f[key]||"");let changed=false;if(diffAgainst){let other=key==="organizations"?(diffAgainst.organizations||[]).join(", "):(diffAgainst[key]||"");changed=(cur.toLowerCase()!==other.toLowerCase());}return `<div class="f ${changed?'chg':''}"><span class="fl">${lab}</span><span class="fv" title="${esc(cur)}">${esc(cur)||'<span class="muted">—</span>'}</span></div>`;}).join("");const restoreBtn=isCurrent?"":`<button class="btn small" data-restore="${version}" title="Restore this version">${svg(IC.restore)} Restore</button>`;return `<div class="tl-item ${isCurrent?'':'old'}"><span class="dot"></span><div class="tl-head"><span class="vb">v${version}</span><span class="when">${fmtDate(when)}</span>${isCurrent?'<span class="cur">Current</span>':''}<span class="spacer"></span>${restoreBtn}</div><div class="tl-fields">${cells}</div></div>`;}
function restoreVersion(version){if(!histCtx)return;const ctx=findWorktype(histCtx.wtId);if(!ctx)return;const m=(ctx.wt.mappings||[]).find(x=>x.id===histCtx.mId);if(!m)return;const h=(m.history||[]).find(x=>x.version===version);if(!h)return;if(!confirm(`Restore version v${version}? The current values will be saved as a new version.`))return;const before=snapshotFields(m);const f=h.fields;m.manualQueue=f.manualQueue||"";m.businessArea=f.businessArea||"";m.worktype=f.worktype||"";m.status=f.status||"";m.organizations=[...(f.organizations||[])];m.source=f.source||"";m.remarks=f.remarks||"";stampEdit(m,before);learn(m);closeOverlay("hist");renderAll();toast("Restored to v"+version+" (now v"+m.version+")");}

/* ENTITY MODAL */
let entityCtx=null;
function openEntity(kind,id,parentId){entityCtx={kind,id,parentId};const body=document.getElementById("entityBody"),title=document.getElementById("entityTitle");let name="",type="awd";if(kind==="function"){if(id){const fn=state.functions.find(f=>f.id===id);name=fn?.name||"";}title.textContent=id?"Rename Function":"Add Function";body.innerHTML=fieldText("Function name","entName",name,"e.g. Operations, New Business, Claims");}if(kind==="subfunction"){if(id){for(const f of state.functions){const sf=(f.subFunctions||[]).find(s=>s.id===id);if(sf){name=sf.name;break;}}}title.textContent=id?"Rename Sub-function":"Add Sub-function";body.innerHTML=fieldText("Sub-function name","entName",name,"e.g. Policy Services, Underwriting");}if(kind==="worktype"){if(id){const c=findWorktype(id);name=c?.wt.name||"";type=c?.wt.type||"awd";}title.textContent=id?"Edit Dashboard Worktype":"Add Dashboard Worktype";body.innerHTML=fieldText("Dashboard Worktype name","entName",name,"e.g. NB Policy Issue, Address Change")+`<div class="field"><label>Type <span class="req">*</span></label><div class="toggle" id="typeToggle"><div class="opt ${type==='awd'?'sel':''}" data-type="awd"><span class="dot"></span><div><div class="t">AWD</div><div class="d">Captures Business Area, Worktype, Status &amp; Organization</div></div></div><div class="opt ${type==='manual'?'sel':''}" data-type="manual"><span class="dot"></span><div><div class="t">Manual</div><div class="d">Captures Manual Verint Queue &amp; Organization only</div></div></div></div></div>`;setTimeout(()=>document.querySelectorAll("#typeToggle .opt").forEach(o=>o.onclick=()=>{document.querySelectorAll("#typeToggle .opt").forEach(x=>x.classList.remove("sel"));o.classList.add("sel");}));}showOverlay("entity");setTimeout(()=>document.getElementById("entName")?.focus(),30);}
function fieldText(label,id,v,ph){return `<div class="field"><label>${label} <span class="req">*</span></label><input class="input" id="${id}" value="${esc(v)}" placeholder="${esc(ph)}"></div>`;}
document.getElementById("entitySave").onclick=()=>{const {kind,id,parentId}=entityCtx;const name=document.getElementById("entName").value.trim();if(!name){toast("Please enter a name","warn");return;}
  // duplicate name guard within same parent scope
  if(kind==="function"&&!id&&state.functions.some(f=>f.name.toLowerCase()===name.toLowerCase())){toast("A function with this name already exists","warn");return;}
  if(kind==="subfunction"&&!id){const fn=state.functions.find(f=>f.id===parentId);if((fn.subFunctions||[]).some(s=>s.name.toLowerCase()===name.toLowerCase())){toast("A sub-function with this name already exists here","warn");return;}}
  if(kind==="worktype"&&!id){let sf=null;for(const f of state.functions){const s=(f.subFunctions||[]).find(x=>x.id===parentId);if(s){sf=s;break;}}if((sf.worktypes||[]).some(w=>w.name.toLowerCase()===name.toLowerCase())){toast("A worktype with this name already exists here","warn");return;}}
  if(kind==="function"){if(id)state.functions.find(f=>f.id===id).name=name;else{const nf={id:uid(),name,subFunctions:[]};state.functions.push(nf);expanded.add(nf.id);}}
  if(kind==="subfunction"){if(id){for(const f of state.functions){const sf=(f.subFunctions||[]).find(s=>s.id===id);if(sf){sf.name=name;break;}}}else{const fn=state.functions.find(f=>f.id===parentId);const ns={id:uid(),name,worktypes:[]};fn.subFunctions.push(ns);expanded.add(fn.id);expanded.add(ns.id);}}
  if(kind==="worktype"){const type=document.querySelector("#typeToggle .opt.sel")?.dataset.type||"awd";if(id){const c=findWorktype(id);c.wt.name=name;c.wt.type=type;}else{let sf=null;for(const f of state.functions){const s=(f.subFunctions||[]).find(x=>x.id===parentId);if(s){sf=s;break;}}const nw={id:uid(),name,type,mappings:[]};sf.worktypes.push(nw);expanded.add(sf.id);selection.worktypeId=nw.id;viewMode="detail";}}
  closeOverlay("entity");renderAll();toast("Saved");};

/* DIRECTORIES (with strict duplicate prevention) */
let dirActiveCat="businessArea",dirEditIdx=null;
function openDirectories(){dirEditIdx=null;showOverlay("dir");renderDir();}
function dirHasValue(cat,v,exceptIdx){return(state.directories[cat]||[]).some((x,i)=>i!==exceptIdx&&x.toLowerCase()===v.toLowerCase());}
function renderDir(){
  const body=document.getElementById("dirBody");
  const cats=DIR_CATS.map(c=>`<button class="dir-cat ${c.key===dirActiveCat?'sel':''}" data-cat="${c.key}">${svg(IC.list)}<span>${c.label}</span><span class="c">${(state.directories[c.key]||[]).length}</span></button>`).join("");
  const label=DIR_CATS.find(c=>c.key===dirActiveCat).label;const entries=state.directories[dirActiveCat]||[];
  const list=entries.length?entries.map((v,i)=>dirItem(v,i)).join(""):`<div class="dir-empty">No entries yet.<br>Add your first ${esc(label)} above.</div>`;
  body.innerHTML=`<div class="dir-layout"><div class="dir-cats">${cats}</div><div class="dir-entries"><div class="dir-add"><input class="input" id="dirNewInput" placeholder="Add new ${esc(label)}…"><button class="btn primary" id="dirAddBtn">${svg(IC.plus)} Add</button></div><div class="dir-dupmsg" id="dirDupMsg">${svg(IC.warn)}<span id="dirDupText"></span></div><div id="dirBulkWrap"><button class="btn small" id="dirBulkToggle" style="margin-bottom:8px">${svg(IC.list)} Bulk paste / import</button><div id="dirBulkPanel" style="display:none;margin-bottom:12px"><textarea id="dirBulkText" placeholder="Paste multiple ${esc(label)} values — one per line, or comma / tab / semicolon separated…"></textarea><div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap"><button class="btn primary small" id="dirBulkAdd">${svg(IC.check)} Add all</button><button class="btn small" id="dirBulkFile">${svg(IC.folder)} Import from file (.csv/.txt)</button><input type="file" id="dirBulkFileInput" accept=".csv,.txt" style="display:none"><span class="hint" style="margin-left:auto">Duplicates are blocked</span></div></div></div><div id="dirSplitWrap"><button class="btn small" id="dirSplitToggle" style="margin-bottom:8px">${svg(IC.layers)} Split Verint Queue → Business Area / Worktype / Status</button><div id="dirSplitPanel" style="display:none;margin-bottom:12px"><textarea id="dirSplitText" placeholder="Paste Verint Queue keys such as:&#10;AGLIFECS_BILLINGMNGT_COMPLETED&#10;AGLIFECS_BILLERR_COMPLETED&#10;(one per line, or comma / semicolon separated)"></textarea><div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap"><button class="btn small" id="dirSplitPreview">${svg(IC.list)} Preview split</button><button class="btn primary small" id="dirSplitDistribute">${svg(IC.check)} Distribute to directories</button><span class="hint" style="margin-left:auto">Splits on “_” → first = Business Area, last = Status, middle = Worktype</span></div><div id="dirSplitPreviewBox"></div></div></div><div class="dir-list">${list}</div></div></div>`;
  document.querySelectorAll(".dir-cat").forEach(b=>b.onclick=()=>{dirActiveCat=b.dataset.cat;dirEditIdx=null;renderDir();});
  const addBtn=document.getElementById("dirAddBtn"),newInp=document.getElementById("dirNewInput"),dupMsg=document.getElementById("dirDupMsg"),dupText=document.getElementById("dirDupText");
  const liveCheck=()=>{const v=newInp.value.trim();if(v&&dirHasValue(dirActiveCat,v)){dupText.textContent=`"${v}" already exists in ${label} — duplicates are not allowed.`;dupMsg.classList.add("show");addBtn.disabled=true;addBtn.style.opacity=".5";}else{dupMsg.classList.remove("show");addBtn.disabled=false;addBtn.style.opacity="1";}};
  const doAdd=()=>{const v=newInp.value.trim();if(!v){toast("Enter a value","warn");return;}if(dirHasValue(dirActiveCat,v)){liveCheck();toast("Duplicate not allowed","warn");return;}state.directories[dirActiveCat].push(v);newInp.value="";save();renderDatalists();renderDir();toast("Added");};
  addBtn.onclick=doAdd;newInp.oninput=liveCheck;newInp.onkeydown=(e)=>{if(e.key==="Enter"){e.preventDefault();doAdd();}};setTimeout(()=>newInp.focus(),20);
  const bulkToggle=document.getElementById("dirBulkToggle"),bulkPanel=document.getElementById("dirBulkPanel");
  bulkToggle.onclick=()=>{bulkPanel.style.display=bulkPanel.style.display==="none"?"block":"none";if(bulkPanel.style.display==="block")document.getElementById("dirBulkText").focus();};
  const commitBulk=(raw)=>{const items=parseBulkValues(raw);if(items.length===0){toast("No values found","warn");return;}const existing=state.directories[dirActiveCat]||[];let added=0,skipped=0;items.forEach(v=>{if(existing.some(x=>x.toLowerCase()===v.toLowerCase())){skipped++;return;}existing.push(v);added++;});save();renderDatalists();renderDir();toast(`Added ${added}${skipped?`, blocked ${skipped} duplicate${skipped>1?'s':''}`:''}`);};
  document.getElementById("dirBulkAdd").onclick=()=>commitBulk(document.getElementById("dirBulkText").value);
  document.getElementById("dirBulkFile").onclick=()=>document.getElementById("dirBulkFileInput").click();
  document.getElementById("dirBulkFileInput").onchange=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{commitBulk(r.result);e.target.value="";};r.readAsText(f);};
  // --- Split Verint Queue keys into BA / WT / Status directories ---
  const splitToggle=document.getElementById("dirSplitToggle"),splitPanel=document.getElementById("dirSplitPanel"),splitBox=document.getElementById("dirSplitPreviewBox");
  splitToggle.onclick=()=>{splitPanel.style.display=splitPanel.style.display==="none"?"block":"none";if(splitPanel.style.display==="block")document.getElementById("dirSplitText").focus();};
  const buildSplit=()=>{const keys=parseQueueKeys(document.getElementById("dirSplitText").value);const seen=new Set();const parsed=[];let invalid=0;keys.forEach(k=>{const kl=k.toLowerCase();if(seen.has(kl))return;seen.add(kl);const s=splitQueueKey(k);if(!s){invalid++;parsed.push({key:k,invalid:true});}else parsed.push({key:k,...s});});return{parsed,invalid};};
  const has=(cat,v)=>dirHasValue(cat,v);
  const renderSplitPreview=()=>{const {parsed,invalid}=buildSplit();if(parsed.length===0){splitBox.innerHTML=`<div class="hint" style="margin-top:10px">Nothing to preview yet.</div>`;return;}
    const newBA=new Set(),newWT=new Set(),newST=new Set();
    const rowsHtml=parsed.map(p=>{if(p.invalid)return `<tr class="sp-invalid"><td><code class="keycode">${esc(p.key)}</code></td><td colspan="3" class="muted">${svg(IC.warn)} needs at least 3 parts (BA_WT_STATUS)</td></tr>`;
      const baNew=!has("businessArea",p.businessArea)&&!newBA.has(p.businessArea.toLowerCase());const wtNew=!has("worktype",p.worktype)&&!newWT.has(p.worktype.toLowerCase());const stNew=!has("status",p.status)&&!newST.has(p.status.toLowerCase());
      if(baNew)newBA.add(p.businessArea.toLowerCase());if(wtNew)newWT.add(p.worktype.toLowerCase());if(stNew)newST.add(p.status.toLowerCase());
      return `<tr><td><code class="keycode">${esc(p.key)}</code></td><td>${esc(p.businessArea)} ${baNew?'<span class="sp-new">new</span>':'<span class="sp-dup">exists</span>'}</td><td>${esc(p.worktype)} ${wtNew?'<span class="sp-new">new</span>':'<span class="sp-dup">exists</span>'}</td><td>${esc(p.status)} ${stNew?'<span class="sp-new">new</span>':'<span class="sp-dup">exists</span>'}</td></tr>`;}).join("");
    splitBox.innerHTML=`<div class="split-summary">${svg(IC.check)} ${parsed.length-invalid} valid · <b class="sp-new">${newBA.size}</b> new Business Area · <b class="sp-new">${newWT.size}</b> new Worktype · <b class="sp-new">${newST.size}</b> new Status${invalid?` · <b class="sp-dup">${invalid} invalid</b>`:''}</div><div class="split-table-wrap"><table class="split-table"><thead><tr><th>Verint Queue Key</th><th>Business Area</th><th>Worktype</th><th>Status</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
  };
  document.getElementById("dirSplitText").oninput=()=>{if(splitBox.innerHTML.trim())renderSplitPreview();};
  document.getElementById("dirSplitPreview").onclick=renderSplitPreview;
  document.getElementById("dirSplitDistribute").onclick=()=>{const {parsed,invalid}=buildSplit();const valid=parsed.filter(p=>!p.invalid);if(valid.length===0){toast("No valid queue keys to distribute","warn");return;}
    let aBA=0,aWT=0,aST=0;
    valid.forEach(p=>{if(!dirHasValue("businessArea",p.businessArea)){state.directories.businessArea.push(p.businessArea);aBA++;}if(!dirHasValue("worktype",p.worktype)){state.directories.worktype.push(p.worktype);aWT++;}if(!dirHasValue("status",p.status)){state.directories.status.push(p.status);aST++;}});
    save();renderDatalists();
    const total=aBA+aWT+aST;
    if(total===0){toast("All values already exist — nothing new added","warn");}
    else{toast(`Distributed: +${aBA} Business Area, +${aWT} Worktype, +${aST} Status${invalid?` (${invalid} invalid skipped)`:''}`);}
    // re-render but keep the split panel open with a fresh preview
    dirActiveCat="businessArea";renderDir();setTimeout(()=>{const sp=document.getElementById("dirSplitPanel");if(sp){sp.style.display="block";}},0);
  };
  document.querySelectorAll("[data-diract]").forEach(b=>b.onclick=()=>{const a=b.dataset.diract,i=+b.dataset.i;if(a==="edit"){dirEditIdx=i;renderDir();document.getElementById("dirEditInput")?.focus();}if(a==="cancel"){dirEditIdx=null;renderDir();}if(a==="save"){const nv=document.getElementById("dirEditInput").value.trim();if(!nv){toast("Value cannot be empty","warn");return;}if(dirHasValue(dirActiveCat,nv,i)){toast("Duplicate not allowed","warn");return;}state.directories[dirActiveCat][i]=nv;dirEditIdx=null;save();renderDatalists();renderDir();toast("Updated");}if(a==="del"){if(!confirm(`Remove "${state.directories[dirActiveCat][i]}" from ${label}?`))return;state.directories[dirActiveCat].splice(i,1);dirEditIdx=null;save();renderDatalists();renderDir();toast("Removed");}});
  const ei=document.getElementById("dirEditInput");if(ei)ei.onkeydown=(e)=>{if(e.key==="Enter"){e.preventDefault();document.querySelector('[data-diract="save"]')?.click();}else if(e.key==="Escape"){dirEditIdx=null;renderDir();}};
}
function dirItem(v,i){if(i===dirEditIdx)return `<div class="dir-item"><input id="dirEditInput" value="${esc(v)}"><button class="minibtn ok" data-diract="save" data-i="${i}" title="Save">${svg(IC.check)}</button><button class="minibtn" data-diract="cancel" data-i="${i}" title="Cancel">${svg(IC.x)}</button></div>`;return `<div class="dir-item"><span class="t">${esc(v)}</span><button class="minibtn" data-diract="edit" data-i="${i}" title="Edit">${svg(IC.edit)}</button><button class="minibtn del" data-diract="del" data-i="${i}" title="Remove">${svg(IC.del)}</button></div>`;}

/* LIST VIEW */
function flattenMappings(){const out=[];state.functions.forEach(fn=>(fn.subFunctions||[]).forEach(sf=>(sf.worktypes||[]).forEach(wt=>(wt.mappings||[]).forEach(m=>out.push({fn,sf,wt,m})))));return out;}
function renderListView(){
  const main=document.getElementById("main");let rows=flattenMappings();const total=rows.length;const f=listFilters;const q=(f.text||"").trim().toLowerCase();
  if(q)rows=rows.filter(r=>{const{fn,sf,wt,m}=r;return[fn.name,sf.name,wt.name,m.manualQueue,m.businessArea,m.worktype,m.status,m.source,m.remarks,(m.organizations||[]).join(" "),awdManualKey(wt.type,m)].filter(Boolean).some(v=>v.toLowerCase().includes(q));});
  if(f.type)rows=rows.filter(r=>r.wt.type===f.type);
  if(f.validated==="yes")rows=rows.filter(r=>r.m.validated);if(f.validated==="no")rows=rows.filter(r=>!r.m.validated);
  if(f.active==="active")rows=rows.filter(r=>r.m.active!==false);if(f.active==="inactive")rows=rows.filter(r=>r.m.active===false);
  const lvKeyFn=(r)=>{switch(listSort.key){case"function":return r.fn.name||"";case"subFunction":return r.sf.name||"";case"worktypeName":return r.wt.name||"";case"type":return r.wt.type||"";case"key":return awdManualKey(r.wt.type,r.m);case"organizations":return(r.m.organizations||[]).join(", ");case"source":return r.m.source||"";case"active":return(r.m.active!==false)?1:0;case"validated":return r.m.validated?1:0;case"version":return r.m.version||1;default:return r.fn.name||"";}};
  rows=sortBy(rows,lvKeyFn,listSort.dir);
  const head=`<div class="detail-head"><div><div class="breadcrumb">${svg(IC.list)} <b>All Mappings</b> · consolidated list view</div><h1>List View</h1></div><div class="spacer"></div><button class="btn" id="btnExportCsv2">${svg(IC.doc)} Export CSV</button></div>`;
  const valTotal=flattenMappings().filter(r=>r.m.validated).length;
  const cards=`<div class="cards"><div class="card"><div class="k">Total mappings</div><div class="v">${total}</div></div><div class="card"><div class="k">AWD</div><div class="v" style="color:var(--awd)">${flattenMappings().filter(r=>r.wt.type==='awd').length}</div></div><div class="card"><div class="k">Manual</div><div class="v" style="color:var(--manual)">${flattenMappings().filter(r=>r.wt.type==='manual').length}</div></div><div class="card"><div class="k">Validated</div><div class="v" style="color:${valTotal===total&&total?'var(--manual)':'var(--ink)'}">${valTotal}<span style="font-size:14px;color:var(--muted);font-weight:500">/${total}</span></div></div></div>`;
  const filters=`<div class="list-filters"><div class="search" style="max-width:320px"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg><input id="lvSearch" placeholder="Search all mappings…" value="${esc(f.text)}"></div><select class="select lv-select" id="lvType"><option value="">All types</option><option value="awd" ${f.type==='awd'?'selected':''}>AWD only</option><option value="manual" ${f.type==='manual'?'selected':''}>Manual only</option></select><select class="select lv-select" id="lvActive"><option value="">All statuses</option><option value="active" ${f.active==='active'?'selected':''}>Active</option><option value="inactive" ${f.active==='inactive'?'selected':''}>Inactive</option></select><select class="select lv-select" id="lvVal"><option value="">All validation</option><option value="yes" ${f.validated==='yes'?'selected':''}>Validated</option><option value="no" ${f.validated==='no'?'selected':''}>Not validated</option></select>${(f.text||f.type||f.validated||f.active||listSort.key!=='function'||listSort.dir!=='asc')?`<button class="btn small" id="lvClear">${svg(IC.x)} Clear</button>`:''}<span class="chip" style="margin-left:auto">${rows.length} of ${total} shown</span></div>`;
  const lvh=(label,key)=>{const active=listSort.key===key;const arrow=active?(listSort.dir==="asc"?' ▲':' ▼'):'';return `<th data-lvsort="${key}" class="th-sort ${active?'active':''}">${label}<span class="tha">${arrow}</span></th>`;};
  const thead=`<tr>${lvh('Function','function')}${lvh('Sub-Function','subFunction')}${lvh('Dashboard Worktype','worktypeName')}${lvh('Type','type')}${lvh('AWD &amp; Manual Verint Queue','key')}${lvh('Organization(s)','organizations')}${lvh('Source','source')}${lvh('Active / Inactive','active')}${lvh('Validated','validated')}${lvh('Version','version')}<th style="width:80px"></th></tr>`;
  const body=rows.map(r=>{const{fn,sf,wt,m}=r;const key=awdManualKey(wt.type,m);const valCell=m.validated?`<span class="lv-val on">${svg(IC.check)} ${fmtDateShort(m.validatedAt)}</span>`:`<span class="lv-val muted">—</span>`;const isActive=(m.active!==false);const stChg=m.statusChangedAt||m.activeSince||m.createdAt;const actCell=`<span class="lv-status ${isActive?'on':'off'}"><span class="dot"></span>${isActive?'Active':'Inactive'} <span class="lv-status-date">${fmtDateShort(stChg)}</span></span>`;const others=findKeyOccurrences(key,wt.id).filter(o=>!o.current);const dupB=others.length?`<span class="dupflag" title="Also in ${others.length} other location(s)" onclick="openDupInfo('${wt.id}','${m.id}')">${svg(IC.warn)} Dup</span>`:'';return `<tr><td>${esc(fn.name)}</td><td>${esc(sf.name)}</td><td><b>${esc(wt.name)}</b></td><td><span class="tag ${wt.type}">${wt.type}</span></td><td><code class="keycode">${esc(key)||'<span class="muted">—</span>'}</code>${dupB}</td><td>${orgPills(m.organizations)}</td><td>${esc(m.source)||'<span class="muted">—</span>'}</td><td>${actCell}</td><td>${valCell}</td><td><span class="ver-badge">v${m.version||1}</span></td><td><div class="cellactions"><button class="minibtn" title="Open in detail" onclick="openFromList('${wt.id}')">${svg(IC.doc)}</button><button class="minibtn" title="History" onclick="openHistory('${wt.id}','${m.id}')">${svg(IC.clock)}</button></div></td></tr>`;}).join("");
  const table=rows.length?`<div class="table-wrap"><table><thead>${thead}</thead><tbody>${body}</tbody></table></div>`:`<div class="table-wrap"><div class="table-empty">${svg(IC.db)}<div style="margin-top:8px">${total?'No mappings match the current filters.':'No mappings yet. Add worktypes and mappings to see them here.'}</div></div></div>`;
  main.innerHTML=head+cards+filters+`<div class="section-bar"><h2>All mapping combinations</h2></div>`+table;
  const s=document.getElementById("lvSearch");s.oninput=()=>{listFilters.text=s.value;renderListView();s.focus();s.setSelectionRange(s.value.length,s.value.length);};
  document.getElementById("lvType").onchange=(e)=>{listFilters.type=e.target.value;renderListView();};
  document.getElementById("lvVal").onchange=(e)=>{listFilters.validated=e.target.value;renderListView();};
  const lva=document.getElementById("lvActive");if(lva)lva.onchange=(e)=>{listFilters.active=e.target.value;renderListView();};
  document.getElementById("btnExportCsv2").onclick=()=>document.getElementById("btnExportCsv").click();
  const lvc=document.getElementById("lvClear");if(lvc)lvc.onclick=()=>{listFilters={text:"",type:"",validated:"",active:""};listSort={key:"function",dir:"asc"};renderListView();};
  document.querySelectorAll("#main th[data-lvsort]").forEach(th=>th.onclick=()=>{const k=th.dataset.lvsort;if(listSort.key===k)listSort.dir=listSort.dir==="asc"?"desc":"asc";else{listSort.key=k;listSort.dir="asc";}renderListView();});
}
function openFromList(wtId){viewMode="detail";selection.worktypeId=wtId;editingMapId=null;selectedIds.clear();renderAll();}

/* ABOUT */
const APP_INFO={name:"Verint Mapping Manager",version:"3.2",released:"September 2026",purpose:"Accurately map and count processed items from Verint by linking each Dashboard Worktype (AWD or Manual) to its supporting Business Area, Worktype, Status, Manual Queue and Organization combinations. Multi-select generates every combination automatically, with duplicate detection across functions.",dev:{name:"Mark F. Rusco",email:"mark.rusco@accenture.com",role:"Bus & Technology Delivery Senior Analyst"}};
function openAbout(){const wts=allWorktypes();const maps=flattenMappings();const dirCount=DIR_KEYS.reduce((a,k)=>a+((state.directories[k]||[]).length),0);const validated=maps.filter(r=>r.m.validated).length;const feature=(t,d)=>`<div class="ab-feat"><div class="ab-fi">${svg(IC.check)}</div><div><b>${t}</b><span>${d}</span></div></div>`;document.getElementById("aboutBody").innerHTML=`<div class="ab-hero"><div class="ab-logo"><svg class="icon" viewBox="0 0 24 24" style="width:26px;height:26px;stroke:#fff"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg></div><div><div class="ab-name">${APP_INFO.name}</div><div class="ab-ver">Version ${APP_INFO.version} · ${APP_INFO.released}</div></div></div><p class="ab-purpose">${APP_INFO.purpose}</p><div class="ab-sec-title">At a glance</div><div class="ab-stats"><div class="ab-stat"><span class="n">${state.functions.length}</span><span class="l">Functions</span></div><div class="ab-stat"><span class="n">${wts.length}</span><span class="l">Worktypes</span></div><div class="ab-stat"><span class="n">${maps.length}</span><span class="l">Mappings</span></div><div class="ab-stat"><span class="n">${validated}</span><span class="l">Validated</span></div><div class="ab-stat"><span class="n">${dirCount}</span><span class="l">Directory items</span></div></div><div class="ab-sec-title">Key features</div><div class="ab-feats">${feature("Function hierarchy","Function → Sub-function → Dashboard Worktype tree with search.")}${feature("AWD & Manual types","AWD captures Business Area / Worktype / Status; Manual captures Verint Queue.")}${feature("Multi-select row expansion","Pick multiple values — every combination becomes a row.")}${feature("Duplicate detection","Blocks directory dupes; flags queue keys reused across functions/sub-functions.")}${feature("Directories & autocomplete","Master lists for each field with type-ahead suggestions & bulk import.")}${feature("Inline & bulk editing","Edit rows in place; multi-select bulk actions.")}${feature("Active / Validation tracking","Auto-dated Active/Inactive and validation states.")}${feature("Change history","Created / modified dates plus full version history with restore.")}${feature("List view + filter/sort","Consolidated, filterable, sortable view of every mapping.")}${feature("Export & import","JSON backup/restore and analysis-ready CSV with combined key.")}</div><div class="ab-sec-title">Data & storage</div><div class="ab-kv"><div><span>Persistence</span><b>Browser localStorage + IndexedDB (offline, on-device)</b></div><div><span>Storage key</span><b>${LS_KEY}</b></div><div><span>Database</span><b>${IDB_NAME} / ${IDB_STORE}</b></div><div><span>CSV key column</span><b>AWD &amp; Manual Verint Queue (BA_WT_STATUS or Queue)</b></div><div><span>Privacy</span><b>All data stays in your browser — nothing is sent to any server</b></div></div><div class="ab-sec-title">Developer</div><div class="ab-dev"><div class="dev-avatar">MR</div><div class="ab-dev-meta"><div class="ab-dev-name">${APP_INFO.dev.name}</div><div class="ab-dev-role">${APP_INFO.dev.role}</div><a class="dev-mail" href="mailto:${APP_INFO.dev.email}">${APP_INFO.dev.email}</a></div></div><div class="ab-tech">Single-file web application · HTML · CSS · Vanilla JavaScript · No external dependencies</div>`;showOverlay("about");}

/* TREE EVENTS */
document.getElementById("tree").addEventListener("click",(e)=>{const actBtn=e.target.closest("[data-act]");if(actBtn){e.stopPropagation();const a=actBtn.dataset.act;if(a==="addsf")openEntity("subfunction",null,actBtn.dataset.fn);if(a==="editfn")openEntity("function",actBtn.dataset.fn);if(a==="delfn")deleteFunction(actBtn.dataset.fn);if(a==="addwt")openEntity("worktype",null,actBtn.dataset.sf);if(a==="editsf")openEntity("subfunction",actBtn.dataset.sf);if(a==="delsf")deleteSub(actBtn.dataset.sf);if(a==="editwt")openEntity("worktype",actBtn.dataset.wt);if(a==="delwt")deleteWorktype(actBtn.dataset.wt);return;}const sel=e.target.closest("[data-select]");if(sel){viewMode="detail";selection.worktypeId=sel.dataset.select;editingMapId=null;selectedIds.clear();renderAll();if(isDrawerMode())closeDrawer();return;}const tog=e.target.closest("[data-toggle]");if(tog){const id=tog.dataset.toggle;expanded.has(id)?expanded.delete(id):expanded.add(id);renderTree();}});
function deleteFunction(id){const fn=state.functions.find(f=>f.id===id);if(!confirm(`Delete function "${fn.name}" and all its sub-functions & worktypes?`))return;state.functions=state.functions.filter(f=>f.id!==id);renderAll();toast("Function deleted");}
function deleteSub(id){for(const f of state.functions){const sf=(f.subFunctions||[]).find(s=>s.id===id);if(sf){if(!confirm(`Delete sub-function "${sf.name}" and its worktypes?`))return;f.subFunctions=f.subFunctions.filter(s=>s.id!==id);break;}}renderAll();toast("Sub-function deleted");}
function deleteWorktype(id){const c=findWorktype(id);if(!confirm(`Delete worktype "${c.wt.name}" and its mappings?`))return;c.sf.worktypes=c.sf.worktypes.filter(w=>w.id!==id);if(selection.worktypeId===id)selection.worktypeId=null;renderAll();toast("Worktype deleted");}

document.getElementById("searchInput").oninput=(e)=>{searchTerm=e.target.value;renderTree();};
document.getElementById("btnAddFunction").onclick=()=>openEntity("function");
document.getElementById("btnDirectories").onclick=openDirectories;
document.getElementById("btnAbout").onclick=openAbout;
document.getElementById("btnListView").onclick=()=>{viewMode=viewMode==="list"?"detail":"list";editingMapId=null;renderAll();if(isDrawerMode())closeDrawer();};
function updateSideDirBtn(){const b=document.getElementById("scDir");const disabled=sidebarSort.key==="custom";b.style.opacity=disabled?".4":"1";b.style.pointerEvents=disabled?"none":"auto";b.innerHTML=sidebarSort.dir==="asc"?'<svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>':'<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';}
function updateSideFilterBadge(){const btn=document.getElementById("btnSideFilter");const active=sidebarSort.key!=="custom"||sidebarSort.type||sidebarSort.validated;btn.style.color=active?"var(--brand)":"var(--muted)";btn.style.borderColor=active?"var(--brand)":"var(--line)";}
document.getElementById("btnSideFilter").onclick=()=>{const c=document.getElementById("sideControls");c.style.display=c.style.display==="none"?"block":"none";};
document.getElementById("scSort").onchange=(e)=>{sidebarSort.key=e.target.value;updateSideDirBtn();updateSideFilterBadge();renderTree();};
document.getElementById("scDir").onclick=()=>{sidebarSort.dir=sidebarSort.dir==="asc"?"desc":"asc";updateSideDirBtn();renderTree();};
document.getElementById("scType").onchange=(e)=>{sidebarSort.type=e.target.value;updateSideFilterBadge();renderTree();};
document.getElementById("scVal").onchange=(e)=>{sidebarSort.validated=e.target.value;updateSideFilterBadge();renderTree();};
document.getElementById("scClear").onclick=()=>{sidebarSort={key:"custom",dir:"asc",type:"",validated:""};document.getElementById("scSort").value="custom";document.getElementById("scType").value="";document.getElementById("scVal").value="";updateSideDirBtn();updateSideFilterBadge();renderTree();};
updateSideDirBtn();updateSideFilterBadge();

/* responsive drawer */
function isDrawerMode(){return window.matchMedia("(max-width:900px)").matches;}
function openDrawer(){document.getElementById("sidebar").classList.add("open");document.getElementById("drawerBackdrop").classList.add("show");}
function closeDrawer(){document.getElementById("sidebar").classList.remove("open");document.getElementById("drawerBackdrop").classList.remove("show");}
function toggleDrawer(){document.getElementById("sidebar").classList.contains("open")?closeDrawer():openDrawer();}
document.getElementById("menuToggle").onclick=toggleDrawer;
document.getElementById("drawerBackdrop").onclick=closeDrawer;
window.addEventListener("resize",()=>{if(!isDrawerMode())closeDrawer();});

/* export/import */
document.getElementById("btnExportJson").onclick=()=>{download("verint-mapping-"+stamp()+".json",JSON.stringify(state,null,2),"application/json");toast("JSON exported");};
document.getElementById("btnExportCsv").onclick=()=>{download("verint-mapping-"+stamp()+".csv",buildCsv(),"text/csv");toast("CSV exported");};
document.getElementById("btnImport").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.functions)throw 0;if(!confirm("Import will replace current data. Continue?")){e.target.value="";return;}state=data;ensureDirectories();selection.worktypeId=null;editingMapId=null;selectedIds.clear();viewMode="detail";renderAll();toast("Data imported");}catch{toast("Invalid JSON file","warn");}e.target.value="";};r.readAsText(f);};
function buildCsv(){const head=["Function","Sub-Function","Dashboard Worktype","Type","AWD & Manual Verint Queue","Manual Verint Queue","Business Area","Worktype","Status","Organization","Source","Remarks","Active Status","Status Changed Date","Validated","Validation Date","Version","Created Date","Modified Date"];const rows=[head];state.functions.forEach(fn=>(fn.subFunctions||[]).forEach(sf=>(sf.worktypes||[]).forEach(wt=>{const maps=wt.mappings||[];if(maps.length===0){rows.push([fn.name,sf.name,wt.name,wt.type,"","","","","","","","","","","","","","",""]);return;}maps.forEach(m=>{const key=awdManualKey(wt.type,m);const isActive=(m.active!==false);const stChg=m.statusChangedAt||m.activeSince||m.createdAt;const orgs=(m.organizations||[]);const list=orgs.length?orgs:[""];list.forEach(org=>rows.push([fn.name,sf.name,wt.name,wt.type,key,m.manualQueue||"",m.businessArea||"",m.worktype||"",m.status||"",org,m.source||"",m.remarks||"",isActive?"Active":"Inactive",fmtDate(stChg),m.validated?"Yes":"No",m.validated?fmtDate(m.validatedAt):"","v"+(m.version||1),fmtDate(m.createdAt),fmtDate(m.modifiedAt||m.createdAt)]));});})));return rows.map(r=>r.map(csvCell).join(",")).join("\r\n");}
function csvCell(v){v=(v==null?"":String(v));return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes());}

/* overlay + toast */
function closeOverlay(k){document.getElementById(k+"Overlay").classList.remove("show");}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeOverlay(b.dataset.close));
document.querySelectorAll(".overlay").forEach(o=>o.onclick=(e)=>{if(e.target===o)o.classList.remove("show");});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.querySelectorAll(".overlay.show").forEach(o=>o.classList.remove("show"));closeDrawer();}});
let toastT;
function toast(msg,type){const t=document.getElementById("toast");t.innerHTML=(type==="warn"?'<svg class="icon" viewBox="0 0 24 24" style="color:#fbbf24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>':'<svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>')+esc(msg);t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2400);}

function init(){renderAll();}
load().then(init);
</script>
</body>
</html>
